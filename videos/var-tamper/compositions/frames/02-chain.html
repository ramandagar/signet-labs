  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="02-chain"]');
      if (!root || !window.gsap) return;
      var $ = function (id) {
        return root.querySelector('#' + id);
      };

      var D = 4.117;
      var BLUE = '#3987e5';
      var HAIR = 'rgba(215, 216, 217, 0.24)';
      var stage = $('c02-stage');

      var tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines['02-chain'] = tl;

      /* Blueprint camera modifier: one slow push-in under the whole shot,
         ending at 3.3 so Scene 3's chip-then-hold stays DEAD STILL. */
      tl.fromTo(
        stage,
        { scale: 1, transformOrigin: '50% 40%' },
        { scale: 1.035, duration: 3.3, ease: 'none' },
        0
      );

      // Verbatim product output — segment texts concatenate to exactly:
      // {"chain_valid": true, "length": 17, "signed_by": "var-key-1"}
      // true stays ink (green reserved); blue carries structure only.
      var WELL_SEGS = [
        [$('c02-w1'), '{'],
        [$('c02-w2'), '"chain_valid"'],
        [$('c02-w3'), ':'],
        [$('c02-w4'), ' '],
        [$('c02-w5'), 'true'],
        [$('c02-w6'), ','],
        [$('c02-w7'), ' '],
        [$('c02-w8'), '"length"'],
        [$('c02-w9'), ':'],
        [$('c02-w10'), ' '],
        [$('c02-w11'), '17'],
        [$('c02-w12'), ','],
        [$('c02-w13'), ' '],
        [$('c02-w14'), '"signed_by"'],
        [$('c02-w15'), ':'],
        [$('c02-w16'), ' '],
        [$('c02-w17'), '"var-key-1"'],
        [$('c02-w18'), '}']
      ];
      var WELL_T0 = 1.92;
      var WELL_T1 = 3.2;
      var WELL_N = WELL_SEGS.reduce(function (a, s) {
        return a + s[1].length;
      }, 0);
      var wellCaret = $('c02-wc');

      /* Typing driver — every rendered value is a pure function of driver.t
         (discrete-text-sequence mechanics; seek-safe both ways). */
      var driver = { t: 0 };
      tl.to(
        driver,
        {
          t: D,
          duration: D,
          ease: 'none',
          onUpdate: function () {
            var t = driver.t;
            var i, take, txt;
            var count = function (t0, t1, total) {
              if (t <= t0) return 0;
              if (t >= t1) return total;
              return Math.floor(((t - t0) / (t1 - t0)) * total);
            };
            var n = count(WELL_T0, WELL_T1, WELL_N);
            for (i = 0; i < WELL_SEGS.length; i++) {
              take = Math.max(0, Math.min(WELL_SEGS[i][1].length, n));
              n -= take;
              txt = WELL_SEGS[i][1].substring(0, take);
              if (WELL_SEGS[i][0].textContent !== txt) WELL_SEGS[i][0].textContent = txt;
            }

            // well caret: hidden until the well docks, square-wave blink while
            // idle, solid while typing, off once the chip beat begins (hold is still)
            var wOp;
            if (t < 1.52 || t > WELL_T1 + 0.22) wOp = 0;
            else if (t >= WELL_T0) wOp = 1;
            else wOp = Math.sin((Math.PI * 2 * t) / 0.53) > 0 ? 1 : 0.15;
            wellCaret.style.opacity = wOp;
          }
        },
        0
      );

      // ── Scene 1 — 17 mini blocks cascade in groups (fast stagger), docking left→right…
      for (var i = 1; i <= 17; i++) {
        var start = 0.08 + Math.floor((i - 1) / 3) * 0.17 + ((i - 1) % 3) * 0.05;
        tl.fromTo(
          $('c02-b' + i),
          { x: -24, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.32, ease: 'power3.out' },
          start
        );
      }
      // …and the 1px blue links draw as each pair docks.
      for (var j = 1; j <= 16; j++) {
        var linkStart = 0.08 + Math.floor(j / 3) * 0.17 + (j % 3) * 0.05 + 0.1;
        tl.fromTo(
          $('c02-l' + j),
          { scaleX: 0 },
          { scaleX: 1, duration: 0.22, ease: 'power2.out' },
          linkStart
        );
      }

      // hash wave — one left→right border flash across the intact strip
      // ("every one hash-linked to the last"), flat plane, no glow.
      for (var k = 1; k <= 17; k++) {
        tl.fromTo(
          $('c02-b' + k),
          { borderColor: BLUE },
          { borderColor: HAIR, duration: 0.3, ease: 'power1.out', immediateRender: false },
          1.36 + (k - 1) * 0.026
        );
      }

      // ── Scene 2 — the verify well docks, then the JSON line types verbatim.
      tl.fromTo(
        $('c02-well'),
        { y: 14, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.38, ease: 'power3.out' },
        1.52
      );

      // ── Scene 3 — `exit 0` chip springs in last; hold to the end.
      tl.fromTo(
        $('c02-chip'),
        { scale: 0.7, y: 10, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.4, ease: 'back.out(1.9)' },
        3.34
      );

      tl.seek(0);
    })();
  </script>
