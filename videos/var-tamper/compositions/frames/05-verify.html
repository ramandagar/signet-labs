      <div class="f05-verify-stage">
        <div class="f05-verify-world" id="f05-verify-world">
          <div class="f05-verify-chrome" id="f05-verify-chrome">
            <div class="f05-verify-chrome-left">
              <span class="f05-verify-stub"></span>
              <span class="f05-verify-kicker">var / verify</span>
            </div>
            <div class="f05-verify-meta">17 events &middot; entry 03</div>
          </div>
          <div class="f05-verify-well" id="f05-verify-well">
            <div class="f05-verify-cmd" id="f05-verify-cmd"><span class="f05-verify-prompt">/</span><span id="f05-verify-cmdtext"></span><span class="f05-verify-caret" id="f05-verify-caret-cmd"></span></div>
            <div class="f05-verify-json">
              <div class="f05-verify-line" data-layout-allow-overlap=""><span id="f05-verify-l1a"></span><span class="f05-verify-caret" id="f05-verify-caret-l1a"></span><span class="f05-verify-key" id="f05-verify-l1b"></span><span class="f05-verify-caret" id="f05-verify-caret-l1b"></span><span id="f05-verify-l1c"></span><span class="f05-verify-caret" id="f05-verify-caret-l1c"></span><span class="f05-verify-false" id="f05-verify-l1d"></span><span class="f05-verify-caret" id="f05-verify-caret-l1d"></span><span id="f05-verify-l1e"></span><span class="f05-verify-caret" id="f05-verify-caret-l1e"></span></div>
              <div class="f05-verify-line" data-layout-allow-overlap=""><span id="f05-verify-l2a"></span><span class="f05-verify-caret" id="f05-verify-caret-l2a"></span><span class="f05-verify-key" id="f05-verify-l2b"></span><span class="f05-verify-caret" id="f05-verify-caret-l2b"></span><span id="f05-verify-l2c" data-layout-allow-overlap=""></span><span class="f05-verify-caret" id="f05-verify-caret-l2c"></span></div>
            </div>

        </div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });

      /* entrances — stage arrives fast on the cut, hero visible well before 0.5s */
      tl.fromTo('#f05-verify-chrome', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power2.out' }, 0.02);
      tl.fromTo('#f05-verify-well', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power2.out' }, 0.1);

      /* the shot's one camera move: slow continuous push-in, decelerating to a dead
         hold exactly as the chip lands at 5.6s */
      tl.fromTo('#f05-verify-world', { scale: 1 }, { scale: 1.035, duration: 5.6, ease: 'power2.out' }, 0);

      /* discrete-text-sequence typing — zero-duration set per character, seek-safe */
      const typeSeg = (el, text, t0, per) => {
        for (let i = 1; i <= text.length; i++) {
          tl.set(el, { textContent: text.slice(0, i), immediateRender: false }, t0 + i * per);
        }
        return t0 + text.length * per;
      };

      /* Scene 1 — the command types 0.35–2.05s behind the block caret */
      const CMD = 'var verify-bundle session_bundle.json --key demo.key';
      tl.set('#f05-verify-caret-cmd', { opacity: 1, immediateRender: false }, 0.3);
      typeSeg($('f05-verify-cmdtext'), CMD, 0.35, 1.7 / CMD.length);
      tl.set('#f05-verify-caret-cmd', { opacity: 0, immediateRender: false }, 2.2);

      /* submit beat — the committed line dims as the machine starts answering */
      tl.to('#f05-verify-cmd', { opacity: 0.45, duration: 0.3, ease: 'power2.inOut' }, 2.2);

      /* Scene 2 — the answer JSON types verbatim, 2.32–5.44s; `false` in incident red */
      const PER = 0.032;
      const SEGS = [
        ['l1a', '{', 0],
        ['l1b', '"chain_valid"', 0],
        ['l1c', ': ', 0],
        ['l1d', 'false', 0],
        ['l1e', ',', 0.116],
        ['l2a', '  ', 0],
        ['l2b', '"error"', 0],
        ['l2c', ': "entry 3: hash mismatch (event modified or entries removed)"}', 0],
      ];
      let t = 2.32;
      const marks = [];
      for (const [id, text, gap] of SEGS) {
        marks.push([id, t]);
        t = typeSeg($('f05-verify-' + id), text, t, PER) + gap;
      }
      marks.push([null, t]);
      for (let i = 0; i < marks.length - 1; i++) {
        const [id, on] = marks[i];
        const off = id === null ? 0 : (i === marks.length - 2 ? 5.6 : marks[i + 1][1]);
        if (id !== null) {
          tl.set('#f05-verify-caret-' + id, { opacity: 1, immediateRender: false }, on);
          tl.set('#f05-verify-caret-' + id, { opacity: 0, immediateRender: false }, off);
        }
      }

      /* Scene 3 — `exit 1` stamps on the sub-drop at 5.6s, then the frame holds STILL */
      tl.fromTo('#f05-verify-chip',
        { opacity: 0, scale: 2.6 },
        { opacity: 1, scale: 1, duration: 0.22, ease: 'power3.in', transformOrigin: '50% 50%' },
        5.38
      );

      window.__timelines['05-verify'] = tl;
    })();
  </script>
