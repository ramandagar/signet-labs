  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="04-crack"]');
      if (!root || !window.gsap) return;
      var $ = function (id) {
        return root.querySelector('#' + id);
      };

      var D = 3.541;
      var BLUE = '#3987e5';
      var HAIR = 'rgba(215, 216, 217, 0.24)';
      var world = $('f04-world');
      var card = $('f04-card');
      var crack = $('f04-crack');

      var tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines['04-crack'] = tl;

      /* ── Scene 1 (0–0.7s) — the strip re-forms: 17 blocks cascade in groups,
         links draw as each pair docks (compressed cascade of 02-chain). ── */
      for (var i = 1; i <= 17; i++) {
        var start = 0.02 + Math.floor((i - 1) / 3) * 0.08 + ((i - 1) % 3) * 0.026;
        tl.fromTo(
          $('f04-b' + i),
          { x: -24, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.24, ease: 'power3.out' },
          start
        );
      }
      for (var j = 1; j <= 16; j++) {
        var linkStart = 0.02 + Math.floor(j / 3) * 0.08 + (j % 3) * 0.026 + 0.08;
        tl.fromTo(
          $('f04-l' + j),
          { scaleX: 0 },
          { scaleX: 1, duration: 0.16, ease: 'power2.out' },
          linkStart
        );
      }

      /* ── THE one camera move (blueprint zoom-out-workspace-reveal, inverted):
         a single continuous decelerating push-in running under Scenes 1–2.
         transformOrigin pinned to block 03's center in world space (352,270);
         the counter-translate (608,190) carries that point to (960,460) —
         block 03 framed dead center, numerals legible at 1.5×. The camera
         eases to a full stop at 1.65s and is LOCKED for the rest of the shot:
         card + crack are element motion, never camera. ── */
      tl.fromTo(
        world,
        { scale: 1, x: 0, y: 0, transformOrigin: '352px 270px' },
        { scale: 1.5, x: 608, y: 190, duration: 1.55, ease: 'power3.out' },
        0.1
      );

      /* ── Scene 2 (0.7–1.8s) — the event body card opens; block 03 takes the
         blue selection border; hairline divider draws; the value types red. ── */
      tl.fromTo(
        card,
        { y: 14, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.42, ease: 'power3.out' },
        0.74
      );
      tl.fromTo(
        $('f04-b3'),
        { borderColor: HAIR },
        { borderColor: BLUE, duration: 0.3, ease: 'power2.out', immediateRender: false },
        0.74
      );
      tl.fromTo(
        $('f04-div'),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.3, ease: 'power2.out', transformOrigin: 'left center' },
        0.95
      );

      /* verbatim value types once — every rendered char is a pure function of
         driver.t (discrete-text-sequence mechanics; seek-safe both ways). */
      var val = $('f04-val');
      var VALUE = 'mallory';
      var driver = { t: 0 };
      tl.to(
        driver,
        {
          t: D,
          duration: D,
          ease: 'none',
          onUpdate: function () {
            var t = driver.t;
            var n;
            if (t <= 1.12) n = 0;
            else if (t >= 1.52) n = VALUE.length;
            else n = Math.floor(((t - 1.12) / 0.4) * VALUE.length);
            var txt = VALUE.substring(0, n);
            if (val.textContent !== txt) val.textContent = txt;
          }
        },
        0
      );

      /* ── Scene 3 (1.8–2.3s) — the crack draws ONCE across block 03, camera
         already locked; a single decelerating stroke, no echo, no second draw. ── */
      var L = crack.getTotalLength();
      gsap.set(crack, { strokeDasharray: L, strokeDashoffset: L });
      tl.fromTo(
        crack,
        { strokeDashoffset: L },
        { strokeDashoffset: 0, duration: 0.45, ease: 'power2.inOut' },
        1.8
      );

      /* ── Scene 4 (2.3–3.541s) — ABSOLUTELY STILL. No tweens, no blinks,
         no camera. The stillness IS the beat. ── */

      tl.seek(0);
    })();
  </script>
