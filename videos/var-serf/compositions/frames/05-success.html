    #root .sk05-well {

    #root .sk05-head {

    /* spinner <-> ok — same-center scale swap */
    #root .sk05-state {

  </style>

  <div id="root" data-composition-id="05-success" data-width="1920" data-height="1080" data-duration="5.355">
    <div class="clip sk05-ground" data-start="0" data-duration="5.355" data-track-index="0"></div>

    <div class="clip sk05-stage" data-start="0" data-duration="5.355" data-track-index="1">
      <div class="sk05-well">
        <div class="sk05-head">
          <span class="sk05-head-label">stdout</span>
          <span class="sk05-head-right">
            <span class="sk05-state">
              <svg class="sk05-spin" width="18" height="18" viewBox="0 0 18 18">
                <circle cx="9" cy="9" r="7" fill="none" stroke="#3987E5" stroke-width="1.8" stroke-dasharray="30 14" />
              </svg>
              <span class="sk05-ok">ok</span>
            </span>
            <span class="sk05-win">
              <span class="sk05-win1">window 01</span>
              <span class="sk05-win2">window 02</span>
            </span>
          </span>
        </div>
        <div class="sk05-body">
          <div class="sk05-rowa">
            <svg class="sk05-badge" width="40" height="40" viewBox="0 0 40 40">
              <circle class="sk05-ring" cx="20" cy="20" r="16.5" fill="none" stroke="rgba(175,179,183,0.45)" stroke-width="1.5" stroke-dasharray="103.67" stroke-dashoffset="103.67" transform="rotate(-90 20 20)" />
              <path class="sk05-check" d="M12.5 20.8 L18 26.2 L28 15.4" fill="none" stroke="#0CA30C" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter" stroke-dasharray="22.43" stroke-dashoffset="22.43" />
            </svg>
            <span class="sk05-line"><span class="sk05-arrow"></span><span class="sk05-text"></span><span class="sk05-caret"></span></span>
          </div>
          <div class="sk05-rowb">resolved</div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var DUR = 5.355;
      var TICK_AT = 4.5; // the sub-drop — green tick draws exactly here

      var well = document.querySelector(".sk05-well");
      var spin = document.querySelector(".sk05-spin");
      var ok = document.querySelector(".sk05-ok");
      var win1 = document.querySelector(".sk05-win1");
      var win2 = document.querySelector(".sk05-win2");
      var badge = document.querySelector(".sk05-badge");
      var ring = document.querySelector(".sk05-ring");
      var check = document.querySelector(".sk05-check");
      var arrow = document.querySelector(".sk05-arrow");
      var text = document.querySelector(".sk05-text");
      var caret = document.querySelector(".sk05-caret");
      var rowb = document.querySelector(".sk05-rowb");

      gsap.set([spin, win1, win2, badge, rowb], { transformOrigin: "50% 50%" });

      /* ---- discrete-text-sequence: baked sparse schedule, reverse-searched per frame ----
         the well prints VERBATIM: "-> {'query': 'affected packages', 'results':
         ['pkg-a', 'pkg-b']} (after structured-error retry)" */
      var LINE =
        "-> {'query': 'affected packages', 'results': ['pkg-a', 'pkg-b']} (after structured-error retry)";
      var TYPE_AT = 1.15;
      var seq = [{ t: TYPE_AT, text: "" }];
      var tc = TYPE_AT;
      for (var i = 0; i < LINE.length; i++) {
        var ch = LINE.charAt(i);
        tc += 0.024;
        if (ch === "{") tc += 0.1;
        if (ch === ":") tc += 0.09;
        if (ch === ",") tc += 0.07;
        if (ch === "[") tc += 0.06;
        if (ch === "(") tc += 0.2; // the parenthetical lands as a final beat
        seq.push({ t: tc, text: LINE.slice(0, i + 1) });
      }
      var END_TYPE = tc; // ~4.25

      function entryAt(t) {
        for (var k = seq.length - 1; k >= 0; k--) {
          if (t >= seq[k].t) return seq[k];
        }
        return seq[0];
      }

      /* geometry (constant, deterministic) */
      var RING_LEN = ring.getTotalLength(); // ~103.67
      var CHECK_LEN = check.getTotalLength(); // ~22.43
      var PENDING_OFFSET = RING_LEN * 0.25; // hold the pending arc at ~270 deg

      /* exact initial dash state (matches the markup attributes) so the tick is
         invisible until it draws at the sub-drop */
      check.style.strokeDasharray = String(CHECK_LEN);
      check.style.strokeDashoffset = String(CHECK_LEN);

      var tl = gsap.timeline({ paused: true });

      /* one linear driver writes arrow/text/caret — every value a pure function of t.
         Ends at 4.8 so NOTHING tweens past the dead-still mark (5.2). */
      var state = { t: 0 };
      tl.to(
        state,
        {
          t: 4.8,
          duration: 4.8,
          ease: "none",
          onUpdate: function () {
            var t = state.t;
            var e = entryAt(t);
            var n = e.text.length;
            arrow.textContent = e.text.slice(0, Math.min(n, 3)); // "-> " prefix, the machine's mark
            text.textContent = e.text.slice(3);

            // caret — born with the typing, dies just before the tick lands
            caret.style.opacity =
              t < TYPE_AT ? "0" : t < 4.45 ? "1" : t < 4.6 ? String((4.6 - t) / 0.15) : "0";
          },
        },
        0
      );

      /* Scene 1 — the well arrives; hero visible well before 0.5s */
      tl.fromTo(
        well,
        { autoAlpha: 0, y: 24 },
        { autoAlpha: 1, y: 0, duration: 0.45, ease: "power3.out" },
        0.08
      );

      /* the trigger — same call, NEXT WINDOW: window 01 swaps to window 02 (scale-swap) */
      tl.fromTo(
        win1,
        { scale: 1, autoAlpha: 1 },
        { scale: 0.88, autoAlpha: 0, duration: 0.16, ease: "power2.in" },
        0.55
      );
      tl.fromTo(
        win2,
        { scale: 1.14, autoAlpha: 0 },
        { scale: 1, autoAlpha: 1, duration: 0.22, ease: "back.out(2)" },
        0.62
      );

      /* Scene 2 — the machine works: thin accent arc spinner (finite, timeline-driven,
         dies the instant the result resolves) */
      tl.to(spin, { rotation: 950, duration: 3.95, ease: "none" }, 0.55);

      /* pending badge — gutter arc fades in with the typing, draws to ~270 deg and holds */
      tl.fromTo(badge, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.25 }, 1.12);
      tl.fromTo(
        ring,
        { strokeDashoffset: RING_LEN },
        { strokeDashoffset: PENDING_OFFSET, duration: 0.9, ease: "power1.inOut" },
        1.2
      );

      /* Scene 3 — the receipt: the answer lands, the display moment springs in */
      tl.fromTo(
        rowb,
        { autoAlpha: 0, y: 20, scale: 0.94 },
        { autoAlpha: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.5)" },
        4.28
      );

      /* the sub-drop, exactly at 4.5s — spinner dies, ring closes, GREEN tick draws (green #1) */
      tl.to(spin, { autoAlpha: 0, duration: 0.12 }, TICK_AT);
      tl.fromTo(
        ring,
        { strokeDashoffset: PENDING_OFFSET },
        { strokeDashoffset: 0, duration: 0.16, ease: "power2.out", immediateRender: false },
        TICK_AT
      );
      tl.fromTo(
        check,
        { strokeDashoffset: CHECK_LEN },
        { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" },
        TICK_AT + 0.02
      );
      tl.fromTo(
        badge,
        { scale: 0.88 },
        { scale: 1, duration: 0.34, ease: "back.out(1.8)", immediateRender: false },
        TICK_AT
      );

      /* resolve marker — spinner's spot swaps to "ok" (ink/muted/blue; green is spent) */
      tl.fromTo(
        ok,
        { autoAlpha: 0, scale: 0.85 },
        { autoAlpha: 1, scale: 1, duration: 0.22, ease: "back.out(2)" },
        4.54
      );

      /* DEAD STILL from ~4.84 to 5.355 — no tween starts or runs past 4.84 */

      window.__timelines = window.__timelines || {};
      window.__timelines["05-success"] = tl;
    })();
  </script>
