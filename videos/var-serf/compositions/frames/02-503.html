  <script>

      var DUR = 9.813;

      var textB = document.querySelector(".f02-503-text-b");
      var caretA = document.querySelector(".f02-503-caret-a");

      var strike = document.querySelector(".f02-503-strike");

      // Line A — the call, human cadence (fast keystrokes, a beat at the colon)
      var LINE_A = "flaky_dependency: query_affected()";
      var GAPS_A = [0.028, 0.042, 0.034, 0.062, 0.03, 0.048];
      var A_SEQ = [{ t: 0.4, text: "" }];
      var ta = 0.4;
      for (var i = 0; i < LINE_A.length; i++) {
        ta += GAPS_A[i % GAPS_A.length];
        if (LINE_A.charAt(i) === ":") ta += 0.18;
        if (LINE_A.charAt(i) === "_") ta += 0.05;
        A_SEQ.push({ t: ta, text: LINE_A.slice(0, i + 1) });
      }
      var END_A = ta; // ~2.01

      // Line B — the machine answers: "503" lands as one chunk, then the words roll out
      var TAIL_B = " Service Unavailable";
      var B_SEQ = [{ t: 0, text: "" }, { t: 2.12, text: "503" }];
      var tb = 2.28;
      for (var j = 0; j < TAIL_B.length; j++) {
        tb += 0.068 + (TAIL_B.charAt(j) === " " ? 0.05 : 0);
        B_SEQ.push({ t: tb, text: "503" + TAIL_B.slice(0, j + 1) });
      }
      var END_B = tb; // ~3.74

      function entryAt(seq, t) {
        for (var k = seq.length - 1; k >= 0; k--) {
          if (t >= seq[k].t) return seq[k];
        }
        return seq[0];

      var T_A_HIDE = 2.12; // hand-off: line A caret dies as line B caret is born

          duration: DUR,

            var t = state.t;

            textB.textContent = entryAt(B_SEQ, t).text;

            var p = Math.PI * 2 * BLINK_CYCLES * (t / DUR);
            var wave = Math.sin(p) > 0 ? "1" : "0";
