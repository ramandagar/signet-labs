<div id="root" data-composition-id="06-taxonomy" data-width="1920" data-height="1080" data-duration="4.8">
  <div class="clip tax06-ground" data-start="0" data-duration="4.8" data-track-index="0"></div>

  <div class="clip tax06-stage" data-start="0" data-duration="4.8" data-track-index="1">
    <div class="tax06-cam">

      <!-- chrome -->
      <div class="tax06-chrome-l">ERROR TAXONOMY</div>
      <div class="tax06-chrome-r">NO. 06</div>
      <div class="tax06-chrome-bar"></div>

      <!-- the taxonomy strip, full-width -->
      <div class="tax06-float">
        <div class="tax06-strip">
          <div class="tax06-cell">
            <span class="tax06-idx"><span class="tax06-idx-s">/</span> 01</span>
            <span class="tax06-cellmid"><span class="tax06-lab">TRANSIENT</span><span class="tax06-stub"></span></span>
          </div>
          <div class="tax06-cell">
            <span class="tax06-idx"><span class="tax06-idx-s">/</span> 02</span>
            <span class="tax06-cellmid"><span class="tax06-lab">PERMANENT</span><span class="tax06-stub"></span></span>
          </div>
          <div class="tax06-cell">
            <span class="tax06-idx"><span class="tax06-idx-s">/</span> 03</span>

          </div>
          <div class="tax06-cell">
            <span class="tax06-idx"><span class="tax06-idx-s">/</span> 04</span>
            <span class="tax06-cellmid"><span class="tax06-lab">RATE_LIMIT</span><span class="tax06-stub"></span></span>
          </div>

      <!-- caption line — types under the strip -->
      <div class="tax06-captionrow"><span class="tax06-cap1"></span><span class="tax06-capsep">&middot;</span><span class="tax06-cap2"></span><span class="tax06-caret"></span></div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
  (function () {
    var DUR = 4.8;

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

    /* camera — steady push under the whole shot (multi-phase-camera steady-push pattern) */
    tl.fromTo(".tax06-cam", { scale: 1 }, { scale: 1.035, duration: DUR, ease: "sine.inOut" }, 0);

    /* chrome */
    tl.fromTo(".tax06-chrome-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 0.05);
    tl.fromTo(
      [".tax06-chrome-l", ".tax06-chrome-r"],
      { autoAlpha: 0, y: -10 },
      { autoAlpha: 1, y: 0, duration: 0.45, stagger: 0.06 },
      0.1
    );

    /* six cells — one per beat, short slide directly into slot (grid-card-assemble, stagger-assemble
       in its direct-into-slot form); the accent stub wipes in right after each landing */
    var LAND = [0.3, 0.7, 1.1, 1.5, 1.9, 2.3];
    var cells = document.querySelectorAll(".tax06-cell");
    LAND.forEach(function (at, i) {
      var cell = cells[i];
      tl.fromTo(cell, { autoAlpha: 0, y: 26 }, { autoAlpha: 1, y: 0, duration: 0.5 }, at);
      tl.fromTo(
        cell.querySelector(".tax06-stub"),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.35, ease: "back.out(1.7)" },
        at + 0.22
      );
    });

    /* caption — discrete-text-sequence typing: baked sparse schedule, reverse-searched per frame;
       every value a pure function of the timeline clock (seek-safe) */
    var T0 = 2.75, STEP = 0.048;
    var P1 = "SIX CATEGORIES";
    var P2 = "SIX RECOVERY PLANS";

    var SEQ1 = [{ t: T0, text: "" }];
    var t = T0;
    for (var i = 0; i < P1.length; i++) { t += STEP; SEQ1.push({ t: t, text: P1.slice(0, i + 1) }); }
    var T_SEP = t + 0.06;

    var t2 = T_SEP + 0.12;
    var SEQ2 = [{ t: t2, text: "" }];
    for (var j = 0; j < P2.length; j++) { t2 += STEP; SEQ2.push({ t: t2, text: P2.slice(0, j + 1) }); }
    var END_TYPE = t2;

    function entryAt(seq, x) {
      for (var k = seq.length - 1; k >= 0; k--) { if (x >= seq[k].t) return seq[k]; }
      return seq[0];
    }

    var cap1 = document.querySelector(".tax06-cap1");
    var cap2 = document.querySelector(".tax06-cap2");
    var sep = document.querySelector(".tax06-capsep");
    var caret = document.querySelector(".tax06-caret");

    var GRACE = 0.22, BLINK_CYCLES = 7; /* whole number over DUR — period ~0.69s */
    var state = { t: 0 };
    tl.to(
      state,
      {
        t: DUR,
        duration: DUR,
        ease: "none",
        onUpdate: function () {
          var x = state.t;
          cap1.textContent = entryAt(SEQ1, x).text;
          cap2.textContent = entryAt(SEQ2, x).text;
          sep.style.opacity = x >= T_SEP ? "1" : "0";
          var wave = Math.sin(Math.PI * 2 * BLINK_CYCLES * (x / DUR)) > 0 ? "1" : "0";
          caret.style.opacity = x < T0 ? "0" : x <= END_TYPE + GRACE ? "1" : wave;
        },
      },
      0
    );

    /* hold — one collective sine float on the strip (sine-wave-loop onUpdate form,
       settle-and-fade envelope so it rests before the frame ends) */
    var stripFloat = document.querySelector(".tax06-float");
    var fl = { p: 0 };
    var FLOAT_CYCLES = 1.5, FLOAT_DUR = 3.8;
    tl.to(
      fl,
      {
        p: Math.PI * 2 * FLOAT_CYCLES,
        duration: FLOAT_DUR,
        ease: "none",
        onUpdate: function () {
          var u = fl.p / (Math.PI * 2 * FLOAT_CYCLES);
          var env = u < 0.8 ? 1 : Math.max(0, (1 - u) / 0.2);
          stripFloat.style.transform = "translateY(" + (Math.sin(fl.p) * 3 * env).toFixed(3) + "px)";
        },
      },
      1.0
    );

    window.__timelines["06-taxonomy"] = tl;
  })();
</script>
