      var SEG_B = 'https://github.com/signet-labs/var-runtime'; // 42 chars — dim, wrapped line
      var SEG_C = 'python3 demo.py'; // 15 chars — bright, second prompt
      var TOTAL_1 = SEG_A.length + SEG_B.length; // 51  (~28 chars/s over the typing window)
      var TYP0_1 = 1.55,
        TYP1_1 = 3.41; // typing window, command 1
      var SWAP = 3.95; // hard-cut: submitted + fresh prompt (after one caret blink beat)
      var TYP0_2 = 4.05,
        TYP1_2 = 4.6; // typing window, command 2 (fast)
      var FREEZE = 6.65; // caret goes solid for the poster tail (03-session convention)

      var tl = gsap.timeline({ paused: true });

            // command 1 — char budget splits across the wrap boundary
            var n = 0;
            if (t >= TYP1_1) n = TOTAL_1;
            else if (t > TYP0_1) n = Math.floor(((t - TYP0_1) / (TYP1_1 - TYP0_1)) * TOTAL_1);
            var na = Math.min(n, SEG_A.length);
            var nb = Math.max(0, Math.min(n - SEG_A.length, SEG_B.length));

            var tb = SEG_B.substring(0, nb);
