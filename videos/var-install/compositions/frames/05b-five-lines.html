  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="05b-five-lines"]');
      if (!root || !window.gsap) return;
      var $ = function (id) {
        return root.querySelector('#' + id);

      var D = 8.469;
      var TYPE0 = 1.4;
      var TYPE1 = 5.6;
      var sp = function (n) {

      };

      // Verbatim README "5-line integration" snippet (8 physical lines),
      // typed as character slices — every rendered value is a pure function of
      // driver.t (discrete-text-sequence / context-sensitive-cursor mechanics).

            [$('f05b-l1s0'), 'from '],
            [$('f05b-l1s1'), 'var_runtime'],

            [$('f05b-l1s4'), ', '],

        },
        {

            [$('f05b-l2s0'), 'rt = '],

            [$('f05b-l2s2'), '(store='],
            [$('f05b-l2s3'), '"var.db"'],
            [$('f05b-l2s4'), ', '],
            [$('f05b-l2s5'), 'proofs='],
            [$('f05b-l2s6'), '"proofs.json"'],

        },
        {

          segs: [
            [$('f05b-l3s0'), 's = rt.start_session(principal_id='],
            [$('f05b-l3s1'), '"alice@co"'],
            [$('f05b-l3s2'), ', '],
            [$('f05b-l3s3'), 'agent_id='],
            [$('f05b-l3s4'), '"coder-1"'],
            [$('f05b-l3s5'), ',']
          ]
        },
        {
          caret: $('f05b-c4'),
          segs: [
            [$('f05b-l4s0'), sp(21)],
            [$('f05b-l4s1'), 'permissions=['],
            [$('f05b-l4s2'), '"read:repo"'],
            [$('f05b-l4s3'), ', '],
            [$('f05b-l4s4'), '"run:tests"'],

        },
        {
          caret: $('f05b-c5'),
          segs: [
            [$('f05b-l5s0'), sp(21)],
            [$('f05b-l5s1'), 'budget='],
            [$('f05b-l5s2'), 'Budget'],
            [$('f05b-l5s3'), '(max_usd='],
            [$('f05b-l5s4'), '2.00'],
            [$('f05b-l5s5'), '))']
          ]
        },
        {
          caret: $('f05b-c6'),
          segs: [
            [$('f05b-l6s0'), 'd = rt.'],
            [$('f05b-l6s1'), 'gate_claim'],
            [$('f05b-l6s2'), '(s, {'],
            [$('f05b-l6s3'), '"claim"'],
            [$('f05b-l6s4'), ': '],
            [$('f05b-l6s5'), '"tests_passed"'],
            [$('f05b-l6s6'), ',']
          ]
        },
        {
          caret: $('f05b-c7'),
          segs: [
            [$('f05b-l7s0'), sp(22)],
            [$('f05b-l7s1'), '"target"'],
            [$('f05b-l7s2'), ': {'],
            [$('f05b-l7s3'), '"commit_sha"'],
            [$('f05b-l7s4'), ': '],
            [$('f05b-l7s5'), 'sha'],
            [$('f05b-l7s6'), '}, '],
            [$('f05b-l7s7'), '"confidence"'],
            [$('f05b-l7s8'), ': '],
            [$('f05b-l7s9'), '0.97'],
            [$('f05b-l7s10'), '})']
          ]
        },
        {
          caret: $('f05b-c8'),
          segs: [
            [$('f05b-l8s0'), 'if '],
            [$('f05b-l8s1'), 'd.admitted'],
            [$('f05b-l8s2'), ': ...']
          ]
        }
      ];
      var TOTALS = LINES.map(function (l) {
        return l.segs.reduce(function (a, s) {
          return a + s[1].length;
        }, 0);
      });
      // uniform character rate across the type window → per-line windows
      var TOTAL = TOTALS.reduce(function (a, b) {
        return a + b;
      }, 0);
      (function () {
        var cum = 0;
        for (var i = 0; i < LINES.length; i++) {
          LINES[i].w0 = TYPE0 + (cum / TOTAL) * (TYPE1 - TYPE0);
          cum += TOTALS[i];
          LINES[i].w1 = TYPE0 + (cum / TOTAL) * (TYPE1 - TYPE0);
        }
      })();

      var rule = $('f05b-rule');
      var kicker = $('f05b-kicker');
      var w1 = $('f05b-w1');
      var w2 = $('f05b-w2');
      var well = $('f05b-well');
      var ubar = $('f05b-ubar');
      var chip = $('f05b-chip');

      var tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines['05b-five-lines'] = tl;

      // Scene 1 — caption card lands left-of-center; well slides in right, empty with caret.
      tl.fromTo(
        rule,
        { scaleX: 0, transformOrigin: '0% 50%' },
        { scaleX: 1, duration: 0.5, ease: 'power3.out' },
        0.05
      );
      tl.fromTo(
        kicker,
        { y: 16, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.55, ease: 'power2.out' },
        0.18
      );
      tl.fromTo(
        w1,
        { y: 70, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.75, ease: 'power4.out' },
        0.28
      );
      tl.fromTo(
        w2,
        { y: 70, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.75, ease: 'power4.out' },
        0.5
      );
      tl.fromTo(
        well,
        { x: 130, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.85, ease: 'power3.out' },
        0.45
      );

      // Typing driver — seek-safe both ways; caret owned by the active line,
      // solid while typing, deterministic square-wave blink while idle/parked.
      var driver = { t: 0 };
      tl.to(
        driver,
        {
          t: D,
          duration: D,
          ease: 'none',
          onUpdate: function () {
            var t = driver.t;
            var i, j, l, n;
            for (i = 0; i < LINES.length; i++) {
              l = LINES[i];
              if (t <= l.w0) n = 0;
              else if (t >= l.w1) n = TOTALS[i];
              else n = Math.floor(((t - l.w0) / (l.w1 - l.w0)) * TOTALS[i]);
              for (j = 0; j < l.segs.length; j++) {
                var seg = l.segs[j];
                var take = Math.max(0, Math.min(seg[1].length, n));
                n -= take;
                var txt = seg[1].substring(0, take);
                if (seg[0].textContent !== txt) seg[0].textContent = txt;
              }
            }
            var blink = Math.sin((Math.PI * 2 * t) / 0.53) > 0 ? 1 : 0.15;
            var active, op;
            if (t < TYPE0) {
              active = 0;
              op = blink;
            } else if (t < TYPE1) {
              active = LINES.length - 1;
              for (i = 0; i < LINES.length; i++) {
                if (t < LINES[i].w1) {
                  active = i;
                  break;
                }
              }
              op = 1;
            } else {
              active = LINES.length - 1;
              op = blink;
            }
            for (i = 0; i < LINES.length; i++) {
              LINES[i].caret.style.opacity = i === active ? op : 0;
            }
          }
        },
        0
      );

      // Scene 3 — gate_claim: 2px blue underline draws left→right; caret parks at end.
      tl.fromTo(
        ubar,
        { scaleX: 0, transformOrigin: '0% 50%' },
        { scaleX: 1, duration: 1.2, ease: 'power2.inOut' },
        5.7
      );

      // Scene 4 — zero-deps chip under the well; hold still to the end.
      tl.fromTo(
        chip,
        { y: 22, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: 'power2.out' },
        7.45
      );

      tl.seek(0);
    })();
