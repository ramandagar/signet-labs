  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="05-admit"]');
      if (!root || !window.gsap) return;
      var $ = function (id) {
        return root.querySelector('#' + id);
      };

      var chip = $('s05-chip');
      var chipring = $('s05-chipring');
      var evold = $('s05-evold');
      var evnew = $('s05-evnew');
      var evtag = $('s05-evtag');
      var band = $('s05-band');
      var word = $('s05-word');
      var bandlabel = $('s05-bandlabel');
      var ripple = $('s05-ripple');
      var sub = $('s05-sub');
      var rows = [];
      for (var i = 0; i < 5; i++) {
        rows.push({ row: $('s05-row' + i), box: $('s05-box' + i), check: $('s05-check' + i) });
      }

      var tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines['05-admit'] = tl;

      // ── Scene 1 (0.0–2.2) — the re-run trigger: card persists; `↻ re-run` chip
      // emits one pulse ring + press pulse; evidence swaps stale → fresh.
      tl.fromTo(
        chipring,
        { opacity: 0, scale: 0.8 },
        {
          keyframes: [
            { opacity: 0.9, scale: 1, duration: 0.08, ease: 'none' },
            { opacity: 0, scale: 1.5, duration: 0.42, ease: 'power2.out' }
          ]
        },
        0.3
      );
      tl.fromTo(
        chip,
        { scale: 1 },
        {
          keyframes: [
            { scale: 1.06, duration: 0.14, ease: 'power2.out' },
            { scale: 1, duration: 0.22, ease: 'power2.inOut' }
          ],
          immediateRender: false
        },
        0.3
      );
      tl.fromTo(
        evold,
        { opacity: 1, y: 0 },
        { opacity: 0, y: -12, duration: 0.28, ease: 'power2.in' },
        1.3
      );
      tl.fromTo(
        evnew,
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.32, ease: 'power3.out' },
        1.52
      );
      tl.fromTo(
        evtag,
        { opacity: 0, scale: 0.8 },
        { opacity: 1, scale: 1, duration: 0.3, ease: 'back.out(1.7)', transformOrigin: '50% 50%' },
        1.68
      );

      // ── Scene 2 (2.2–5.4) — five check rows land one per VO beat, each ticking blue.
      var TIMES = [2.2, 2.78, 3.36, 3.94, 4.52];
      for (i = 0; i < 5; i++) {
        var t = TIMES[i];
        var r = rows[i];
        tl.fromTo(
          r.row,
          { opacity: 0, y: 26 },
          { opacity: 1, y: 0, duration: 0.45, ease: 'back.out(1.4)' },
          t
        );
        tl.fromTo(
          r.box,
          { scale: 1 },
          {
            keyframes: [
              { scale: 1.18, duration: 0.12, ease: 'power2.out' },
              { scale: 1, duration: 0.2, ease: 'power2.inOut' }
            ],
            immediateRender: false
          },
          t + 0.18
        );
        tl.fromTo(
          r.box,
          { backgroundColor: 'rgba(57,135,229,0)', borderColor: 'rgba(215,216,217,0.28)' },
          {
            backgroundColor: 'rgba(57,135,229,1)',
            borderColor: 'rgba(57,135,229,1)',
            duration: 0.16,
            ease: 'power1.out'
          },
          t + 0.2
        );
        tl.fromTo(
          r.check,
          { strokeDashoffset: 22 },
          { strokeDashoffset: 0, duration: 0.28, ease: 'power2.out' },
          t + 0.24
        );
      }

      // ── Scene 3 (5.4–6.2) — the flip: band floods green #0ca30c exactly on the
      // sub-drop; word inks; one ripple ring expands once; sub line prints beneath.
      tl.fromTo(
        band,
        { backgroundColor: 'rgba(16,16,16,1)', borderColor: 'rgba(215,216,217,0.24)' },
        {
          backgroundColor: 'rgba(12,163,12,1)',
          borderColor: 'rgba(12,163,12,1)',
          duration: 0.12,
          ease: 'power2.out'
        },
        5.4
      );
      tl.fromTo(
        band,
        { scale: 1 },
        {
          keyframes: [
            { scale: 1.016, duration: 0.12, ease: 'power2.out' },
            { scale: 1, duration: 0.26, ease: 'power2.inOut' }
          ],
          immediateRender: false,
          transformOrigin: '0% 50%'
        },
        5.4
      );
      tl.fromTo(
        word,
        { opacity: 0 },
        { opacity: 1, duration: 0.12, ease: 'power2.out' },
        5.4
      );
      tl.fromTo(
        bandlabel,
        { opacity: 1 },
        { opacity: 0, duration: 0.15, ease: 'power1.out' },
        5.4
      );
      tl.fromTo(
        ripple,
        { opacity: 0, scale: 0.97 },
        {
          keyframes: [
            { opacity: 0.85, scale: 1, duration: 0.07, ease: 'none' },
            { opacity: 0, scale: 1.055, duration: 0.63, ease: 'power2.out' }
          ]
        },
        5.4
      );
      tl.fromTo(
        sub,
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' },
        5.58
      );

      // ── Scene 4 (6.2→end) — DEAD STILL: last tween ends ~6.13s; nothing moves after.

      tl.seek(0);
    })();
  </script>
