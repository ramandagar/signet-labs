  </style>

  <div

          <div class="c06-bnum">02</div>

        <div class="c06-block c06-b3" id="c06-b3">

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="06-chain"]');
      if (!root || !window.gsap) return;
      var $ = function (id) {
        return root.querySelector('#' + id);
      };

      var D = 7.957;
      var stage = $('c06-stage');
      var wellCaret = $('c06-wc');
      var stampCaret = $('c06-sc');

      // Verbatim product output — segment texts concatenate to exactly:
      // chain verified : {'chain_valid': True, 'length': 17, ...}
      var WELL_SEGS = [
        [$('c06-w1'), 'chain verified'],
        [$('c06-w2'), ' : '],
        [$('c06-w3'), '{'],
        [$('c06-w4'), "'chain_valid'"],
        [$('c06-w5'), ': '],
        [$('c06-w6'), 'True'],
        [$('c06-w7'), ', '],
        [$('c06-w8'), "'length'"],
        [$('c06-w9'), ': '],
        [$('c06-w10'), '17'],
        [$('c06-w11'), ', ...'],
        [$('c06-w12'), '}']
      ];
      var WELL_T0 = 0.25;
      var WELL_T1 = 2.25;

      // Stamp at the chain head — signed_by: var-key-1
      var STAMP_SEGS = [
        [$('c06-s1'), 'signed_by: '],
        [$('c06-s2'), 'var-key-1']
      ];
      var STAMP_T0 = 5.35;
      var STAMP_T1 = 6.15;

      var WELL_N = WELL_SEGS.reduce(function (a, s) { return a + s[1].length; }, 0);
      var STAMP_N = STAMP_SEGS.reduce(function (a, s) { return a + s[1].length; }, 0);

      var tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines['06-chain'] = tl;

      // Blueprint camera modifier: one slow push-in under the whole shot,
      // ending at 5.2 so Scene 3's stamp-then-hold stays DEAD STILL.
      tl.fromTo(
        stage,
        { scale: 1, transformOrigin: '50% 45%' },
        { scale: 1.035, duration: 5.2, ease: 'none' },
        0
      );

      // Typing driver — every rendered value is a pure function of driver.t
      // (discrete-text-sequence / smooth-slice mechanics; seek-safe both ways).
      var driver = { t: 0 };
      tl.to(
        driver,
        {
          t: D,
          duration: D,
          ease: 'none',
          onUpdate: function () {
            var t = driver.t;
            var i, n, take, txt;
            var count = function (t0, t1, total) {
              if (t <= t0) return 0;
              if (t >= t1) return total;
              return Math.floor(((t - t0) / (t1 - t0)) * total);
            };
            var paint = function (segs, n) {
              for (i = 0; i < segs.length; i++) {
                take = Math.max(0, Math.min(segs[i][1].length, n));
                n -= take;
                txt = segs[i][1].substring(0, take);
                if (segs[i][0].textContent !== txt) segs[i][0].textContent = txt;
              }
            };
            paint(WELL_SEGS, count(WELL_T0, WELL_T1, WELL_N));
            paint(STAMP_SEGS, count(STAMP_T0, STAMP_T1, STAMP_N));

            // well caret: solid while typing, deterministic square-wave blink when
            // idle, off once the stamp beat begins (Scene 3 ends dead still)
            var wOp;
            if (t > 5.2) wOp = 0;
            else if (t >= WELL_T0 && t <= WELL_T1 + 0.3) wOp = 1;
            else wOp = Math.sin((Math.PI * 2 * t) / 0.53) > 0 ? 1 : 0.15;
            wellCaret.style.opacity = wOp;

            // stamp caret: only while the stamp types, gone by the hold
            stampCaret.style.opacity = t >= STAMP_T0 && t <= STAMP_T1 + 0.3 ? 1 : 0;
          }
        },
        0
      );

      // Scene 2 — four blocks dock one per beat (12px drop + fade, power3)…
      var docks = [2.45, 3.1, 3.75, 4.42];
      for (var i = 0; i < docks.length; i++) {
        tl.fromTo(
          $('c06-b' + (i + 1)),
          { y: -12, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.5, ease: 'power3.out' },
          docks[i]
        );
      }
      // …and the 1px blue connectors draw as each pair completes.
      var links = [2.9, 3.55, 4.2];
      for (var j = 0; j < links.length; j++) {
        tl.fromTo(
          $('c06-l' + (j + 1)),
          { scaleX: 0, transformOrigin: '0% 50%' },
          { scaleX: 1, duration: 0.32, ease: 'power2.inOut' },
          links[j]
        );
      }

      // Scene 3 — caption rule fades in under the head block, then the stamp types.
      tl.fromTo(
        $('c06-stamprule'),
        { opacity: 0 },
        { opacity: 1, duration: 0.3, ease: 'power2.out' },
        5.2
      );

      tl.seek(0);
    })();
  </script>
