<template>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    /* ---- fonts (shipped with project, project-root relative) ---- */
    @font-face {
      font-family: "Barlow";
      src: url("assets/fonts/Barlow-900.woff2") format("woff2");
      font-weight: 900;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "IBM Plex Mono";
      src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: block;
    }

    /* ---- root (styled via #root only) ---- */
    #root {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
    }

    /* ---- full-bleed ground: clip layer on the lowest track ---- */
    [class~="01-hook-bg"] {
      position: absolute;
      inset: 0;
      background: #1a1a19; /* cream ground — dark register */
      container-type: size;
    }

    /* Crouwel-style vertical hairlines, stopped at the caption keep-out (83%) */
    [class~="01-hook-grid"] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 83%;
      background-image: linear-gradient(90deg, rgba(215, 216, 217, 0.07) 1px, transparent 1px);
      background-size: 16.6667% 100%;
    }

    /* ghost "5" watermark — center-left, behind type */
    [class~="01-hook-ghost-wrap"] {
      position: absolute;
      left: 25%;
      top: 45%; /* centered by GSAP xPercent/yPercent — no CSS transform here */
    }
    [class~="01-hook-ghost"] {
      font-family: "Barlow", sans-serif;
      font-weight: 900;
      font-size: 55cqw;
      line-height: 0.75;
      letter-spacing: -0.04em;
      color: #ffffff;
      opacity: 0; /* seated by GSAP to 0.06 */
      transform-origin: 50% 50%;
      user-select: none;
    }

    /* ---- content clip ---- */
    [class~="01-hook-stage"] {
      position: absolute;
      inset: 0;
      container-type: size;
    }

    /* statement — Broadside display: lowercase 900, negative-tracked */
    [class~="01-hook-line"] {
      position: absolute;
      top: 27cqh;
      left: 0;
      width: 100%;
      margin: 0;
      text-align: center;
      font-family: "Barlow", sans-serif;
      font-weight: 900;
      font-size: 13cqw;
      line-height: 0.95;
      letter-spacing: -0.04em;
      color: #ffffff; /* ink */
      white-space: nowrap;
    }
    [class~="01-hook-w1"],
    [class~="01-hook-w2"] {
      display: inline-block;
    }
    [class~="01-hook-w2"] {
      color: #afb3b7; /* cream-hint — muted, snapped to ink by GSAP */
    }

    /* five hairline slot rows — quiet promissory note */
    [class~="01-hook-slots"] {
      position: absolute;
      top: 48cqh;
      left: 50%;
      width: 64cqw;
      transform: translateX(-50%); /* static container, never GSAP-animated */
    }
    [class~="01-hook-slot"] {
      height: 6.7cqh;
      border-top: 1px solid rgba(215, 216, 217, 0.45);
      display: flex;
      align-items: center;
      padding: 0 0.8cqw;
      box-sizing: border-box;
    }
    [class~="01-hook-slot"]:last-child {
      border-bottom: 1px solid rgba(215, 216, 217, 0.45);
    }
    [class~="01-hook-num"] {
      font-family: "IBM Plex Mono", monospace;
      font-weight: 500;
      font-size: 1.15cqw;
      letter-spacing: 0.14em;
      color: #3987e5; /* fire-orange accent */
    }
  </style>

  <div
    id="root"
    data-composition-id="01-hook"
    data-start="0"
    data-duration="2.88"
    data-width="1920"
    data-height="1080"
  >
    <!-- track 0: ground + grid + ghost numeral -->
    <div class="clip 01-hook-bg" data-start="0" data-duration="2.88" data-track-index="0">
      <div class="01-hook-grid"></div>
      <div class="01-hook-ghost-wrap">
        <div class="01-hook-ghost">5</div>
      </div>
    </div>

    <!-- track 1: statement + slot stack -->
    <div class="clip 01-hook-stage" data-start="0" data-duration="2.88" data-track-index="1">
      <h1 class="01-hook-line" data-layout-allow-overlap=""><span class="01-hook-w1" data-layout-allow-overlap="">five</span> <span class="01-hook-w2" data-layout-allow-overlap="">checks.</span></h1>
      <div class="01-hook-slots">
        <div class="01-hook-slot"><span class="01-hook-num">01</span></div>
        <div class="01-hook-slot"><span class="01-hook-num">02</span></div>
        <div class="01-hook-slot"><span class="01-hook-num">03</span></div>
        <div class="01-hook-slot"><span class="01-hook-num">04</span></div>
        <div class="01-hook-slot"><span class="01-hook-num">05</span></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var root =
        (document.currentScript && document.currentScript.previousElementSibling) ||
        document.querySelector('[data-composition-id="01-hook"]');
      var q = function (c) {
        return root.querySelector('[class~="' + c + '"]');
      };
      var qa = function (c) {
        return root.querySelectorAll('[class~="' + c + '"]');
      };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

      // ---- Scene 1 (0.0–~0.6s): canvas + grid; ghost "5" seats center-left.
      // Grid hairlines fade up with the cut.
      tl.fromTo(q("01-hook-grid"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0);

      // Macro move underneath the whole shot: slow push on the ghost wrapper.
      tl.fromTo(
        q("01-hook-ghost-wrap"),
        { xPercent: -50, yPercent: -50, scale: 1 },
        { xPercent: -50, yPercent: -50, scale: 1.035, duration: 2.88, ease: "none" },
        0
      );

      // The numeral seats: drops from slightly oversized + faint to its watermark state.
      tl.fromTo(
        q("01-hook-ghost"),
        { opacity: 0, scale: 1.16 },
        { opacity: 0.06, scale: 1, duration: 0.8, ease: "power3.out" },
        0.05
      );

      // ---- Scene 2 (~0.14–1.3s): "five checks." builds word-by-word at optical center.
      // "five" lands ink; "checks." arrives muted, then snaps to ink.
      tl.fromTo(
        q("01-hook-w1"),
        { opacity: 0, y: 36, filter: "blur(12px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" },
        0.14
      );
      tl.fromTo(
        q("01-hook-w2"),
        { opacity: 0, y: 36, filter: "blur(12px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" },
        0.52
      );
      tl.fromTo(
        q("01-hook-w2"),
        { color: "#AFB3B7" },
        { color: "#FFFFFF", duration: 0.32, ease: "power2.inOut" },
        0.98
      );

      // ---- Scene 3 (1.25–2.24s): five hairline slot rows slide up stacked beneath;
      // settle and hold to the end (no exit — the root transition owns it).
      qa("01-hook-slot").forEach(function (row, i) {
        tl.fromTo(
          row,
          { y: 34, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
          1.25 + i * 0.11
        );
      });

      window.__timelines["01-hook"] = tl;
    })();
  </script>
</template>
