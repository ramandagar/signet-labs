    [id="07-bookend-phrase"] {
      position: absolute;

      display: flex;

    [id="07-bookend-lockup"] {

    [id="07-bookend-statement"] {

  <div
    id="root"
    data-composition-id="07-bookend"
    data-start="0"
    data-duration="5.077"
    data-width="1920"
    data-height="1080"
  >
    <!-- full-bleed ground (track 0) -->
    <div
      id="07-bookend-bg"
      class="clip"
      data-start="0"
      data-duration="5.077"
      data-track-index="0"
    ></div>

    <!-- content stage (track 1) -->
    <div
      id="07-bookend-stage"
      class="clip"
      data-start="0"
      data-duration="5.077"
      data-track-index="1"
    >
      <!-- end-card lockup (assembles from 2.8s) -->
      <div id="07-bookend-lockup">
        <div id="07-bookend-row">
          <svg
            id="07-bookend-mark"
            viewBox="0 0 100 100"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >

            ></path>
            <polygon
              id="07-bookend-mark-inner"
              points="50,31 69,50 50,69 31,50"
              fill="#3987E5"
            ></polygon>
          </svg>
          <div id="07-bookend-wordmark"
            ><span class="07-bookend-letter">v</span
            ><span class="07-bookend-letter">a</span
            ><span class="07-bookend-letter">r</span
            ><span class="07-bookend-letter">-</span
            ><span class="07-bookend-letter">r</span
            ><span class="07-bookend-letter">u</span
            ><span class="07-bookend-letter">n</span
            ><span class="07-bookend-letter">t</span

            ><span class="07-bookend-letter">e</span></div
          >
        </div>
        <div id="07-bookend-meta">OPEN SOURCE · github.com/signet-labs/var-runtime</div>
        <div id="07-bookend-statement" data-layout-allow-overlap=""><span id="07-bookend-proof" data-layout-allow-overlap="">proof</span>-or-stop.</div>
      </div>

      <!-- Scene 1 manifesto phrase (clears away at 2.44s) -->
      <div id="07-bookend-phrase">
        <div id="07-bookend-pline">
          <span class="07-bookend-word">no</span>
          <span class="07-bookend-word">evidence.</span>
        </div>
        <div id="07-bookend-pline2">
          <span class="07-bookend-word">no</span>
          <span class="07-bookend-word">advance.</span><svg
            id="07-bookend-tick"
            viewBox="0 0 64 64"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              id="07-bookend-tick-path"
              d="M10 34 L26 50 L54 16"
              stroke="#0CA30C"

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};

      /* exact meta line, split into per-char spans for a stepped type-on */
      var metaEl = document.getElementById("07-bookend-meta");
      var metaText = metaEl.textContent;
      metaEl.textContent = "";
      for (var i = 0; i < metaText.length; i++) {
        var c = document.createElement("span");
        c.className = "07-bookend-char";
        c.textContent = metaText[i];
        metaEl.appendChild(c);
      }

      var words = gsap.utils.toArray('[class="07-bookend-word"]');
      var letters = gsap.utils.toArray('[class="07-bookend-letter"]');
      var chars = gsap.utils.toArray('[class="07-bookend-char"]');

      var mkOuter = document.getElementById("07-bookend-mark-outer");
      var tkPath = document.getElementById("07-bookend-tick-path");
      var mkLen = mkOuter.getTotalLength();
      var tkLen = tkPath.getTotalLength();

      var tl = gsap.timeline({ paused: true });

      /* ---- Scene 1 (0.0-2.4): "no evidence. no advance." word-by-word,
                quiet fade-through-grey register; green tick draws after "advance" ---- */
      var IN = [0.15, 0.58, 1.05, 1.5];
      words.forEach(function (w, i) {
        tl.fromTo(
          w,
          { opacity: 0, y: 8, color: "#AFB3B7" },
          { opacity: 1, y: 0, color: "#FFFFFF", duration: 0.55, ease: "power2.out" },
          IN[i]
        );
      });
      tl.fromTo(
        '[id="07-bookend-tick"]',
        { opacity: 0 },
        { opacity: 1, duration: 0.06, ease: "none" },
        2.06
      );
      tl.fromTo(
        tkPath,
        { strokeDasharray: tkLen, strokeDashoffset: tkLen },
        { strokeDashoffset: 0, duration: 0.32, ease: "power2.inOut" },
        2.06
      );

      /* ---- Scene 2 (2.4-3.56): line settles away (left-first), lockup assembles ---- */
      tl.fromTo(
        words,
        { opacity: 1, y: 0 },
        { opacity: 0, y: -30, duration: 0.42, ease: "power2.in", stagger: 0.06, immediateRender: false },
        2.44
      );
      tl.fromTo(
        '[id="07-bookend-tick"]',
        { opacity: 1 },
        { opacity: 0, duration: 0.3, ease: "power1.in", immediateRender: false },
        2.6
      );

      /* mark: diamond stroke-draws on, inner facet pops */
      tl.fromTo(
        mkOuter,
        { strokeDasharray: mkLen, strokeDashoffset: mkLen },
        { strokeDashoffset: 0, duration: 0.32, ease: "power2.inOut" },
        2.8
      );
      tl.fromTo(
        '[id="07-bookend-mark-inner"]',
        { scale: 0, transformOrigin: "50% 50%", opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.2, ease: "back.out(2.2)" },
        3.06
      );

      /* mark settles left as the wordmark cascades in beside it */
      tl.fromTo(
        '[id="#07-bookend-row"]',
        { x: 22 },
        { x: 0, duration: 0.35, ease: "power2.out" },
        2.95
      );
      tl.fromTo(
        letters,
        { yPercent: 70, opacity: 0 },
        { yPercent: 0, opacity: 1, duration: 0.26, ease: "back.out(1.6)", stagger: 0.024 },
        2.95
      );

      /* meta line types on (stepped, seek-safe) */
      tl.fromTo(
        chars,
        { opacity: 0 },
        { opacity: 1, duration: 0.012, ease: "none", stagger: 0.0068 },
        3.1
      );

      /* statement: left-to-right wipe, "proof" in accent blue */
      tl.fromTo(
        '[id="07-bookend-statement"]',
        { clipPath: "inset(-2% 100% -2% -2%)" },
        { clipPath: "inset(-2% 0% -2% -2%)", duration: 0.32, ease: "power3.inOut" },
        3.24
      );

      /* ---- Scene 3 (3.56-5.077): DEAD STILL hold ~1.52s — no tweens past 3.56 ---- */

      window.__timelines["07-bookend"] = tl;
    })();
  </script>
