  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });

      // persistent chrome — one quiet fade, then holds across every hard cut
      tl.fromTo("#f05-chrome-inner", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.05);

      // titlecard-reveal card chain: five 2.6s cards, instant hard-cut seams.
      // Seams are the clip windows themselves (full-opacity instant swaps) — no exit tweens.
      var CARDS = [
        { n: 1, base: 0, win: 2.6, lead: true,
          code: "EVIDENCE_STALE",
          reason: "evidence age 847s exceeds max_age_seconds=300" },
        { n: 2, base: 2.6, win: 2.6,
          code: "EVIDENCE_UNBOUND",
          reason: "target='commit_def456' evidence='commit_old123'" },
        { n: 3, base: 5.2, win: 2.6, crack: true,
          code: "EVIDENCE_HASH_MISMATCH",
          reason: "content edited in transit" },
        { n: 4, base: 7.8, win: 2.6,
          code: "EVIDENCE_SIGNATURE_INVALID",
          reason: "signer not in trust anchor" },
        { n: 5, base: 10.4, win: 2.656,
          code: "EVIDENCE_NEGATIVE",
          reason: "evidence is present and valid but the result it proves is a failure" }
      ];

      CARDS.forEach(function (c) {
        var b = c.base;

        // card arrival — the one restrained slide-up move (voiceover names the attack)
        tl.fromTo("#f05-inner-" + c.n, { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, b + 0.04);
        tl.fromTo("#f05-kick-" + c.n, { x: -16, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, b + 0.1);
        tl.fromTo("#f05-word-" + c.n, { y: 34, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, b + 0.16);

        // verbatim output prints as the voiceover reads it (discrete-text-sequence, smooth slice)
        var t0 = b + (c.lead ? 0.95 : 0.55); // beat 1 waits out the "now watch what it stops" lead-in
        var idDur = Math.min(0.5, c.code.length * 0.028);
        var rStart = t0 + idDur * 0.7;
        var rDur = Math.min(0.62, Math.max(0.3, c.reason.length * 0.011));
        var cursorEnd = rStart + rDur + 0.08;
        var idN = c.code.length;
        var rsN = c.reason.length;
        var idEl = document.getElementById("f05-id-" + c.n);
        var rsEl = document.getElementById("f05-rs-" + c.n);
        var curEl = document.getElementById("f05-cur-" + c.n);
        var drv = { t: 0 };
        tl.to(drv, {
          t: b + c.win,
          duration: c.win,
          ease: "none",
          onUpdate: function () {
            var t = drv.t;
            var idCount = Math.max(0, Math.min(idN, Math.floor(((t - t0) / idDur) * idN)));
            idEl.textContent = c.code.substring(0, idCount);
            var rsCount = Math.max(0, Math.min(rsN, Math.floor(((t - rStart) / rDur) * rsN)));
            rsEl.textContent = c.reason.substring(0, rsCount);
            var on = t > t0 && t < cursorEnd && Math.sin(((t - t0) * Math.PI) / 0.31) > 0;
            curEl.style.opacity = on ? "1" : "0";
          }
        }, 0);

        // tampered bytes — the film's one red moment: crack draws over the evidence row
        if (c.crack) {
          document.querySelectorAll(".f05-crack path").forEach(function (p) {
            var len = p.getTotalLength() * 1.05; // measured, slight overestimate per rule
            p.style.strokeDasharray = String(len);
            p.style.strokeDashoffset = String(len);
          });
          tl.to("#f05-crack-main", { strokeDashoffset: 0, duration: 0.32, ease: "power2.out" }, b + 1.48);
          tl.to("#f05-crack-b1", { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" }, b + 1.62);
          tl.to("#f05-crack-b2", { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" }, b + 1.7);
        }

        // HALT band flips in as the voiceover says "halted"
        var haltAt = b + (c.crack ? 1.8 : c.lead ? 1.85 : 1.55);
        tl.fromTo("#f05-halt-fill-" + c.n, { scaleX: 0 }, { scaleX: 1, duration: 0.28, ease: "power3.inOut" }, haltAt);
        tl.fromTo("#f05-halt-row-" + c.n, { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.27, ease: "power3.out" }, haltAt + 0.1);

        // recovery chip closes the beat, then the allocated stillness to the hard cut
        var chipAt = b + (c.crack ? 2.16 : c.lead ? 2.28 : 2.0);
        tl.fromTo("#f05-chip-" + c.n, { x: -22, opacity: 0 }, { x: 0, opacity: 1, duration: 0.28, ease: "power2.out" }, chipAt);
      });

      window.__timelines["05-attacks"] = tl;
      tl.seek(0);
    })();
  </script>
