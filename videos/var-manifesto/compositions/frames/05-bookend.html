<template>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    /* ---- fonts (shipped with project, project-root relative) ---- */

      src: url("assets/fonts/Barlow-800.woff2") format("woff2");

    @font-face {
      font-family: "Barlow";
      src: url("assets/fonts/Barlow-900.woff2") format("woff2");
      font-weight: 900;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "IBM Plex Mono";
      src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: block;
    }

    /* ---- root (styled via #root only) ---- */
    #root {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
    }

    /* ---- full-bleed ground: clip layer on the lowest track ---- */
    [class~="05-bookend-bg"] {
      position: absolute;
      inset: 0;
      background: #0d0d0d; /* page ground — semantic law (matches film) */
      container-type: size;
    }

    /* ---- content clip ---- */
    [class~="05-bookend-stage"] {
      position: absolute;
      inset: 0;
      container-type: size;
    }

    /* the lockup column — centered inside the caption-safe top 83% */
    [class~="05-bookend-lockup"] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 83%; /* caption keep-out: nothing below y=896 */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* ---- ◈ mark: outer diamond stroke-draws blue, inner diamond fills — the mark draws ONCE ---- */
    [class~="05-bookend-mark"] {
      width: 6.7cqw; /* 128px */
      height: 6.7cqw;
      display: block;
      overflow: visible;
    }
    [class~="05-bookend-mark-outer"] {
      fill: none;
      stroke: #3987e5; /* accent blue */
      stroke-width: 6.5;
      stroke-linejoin: miter;
    }
    [class~="05-bookend-mark-inner"] {
      fill: #3987e5; /* accent blue */
      fill-opacity: 0; /* seated by GSAP (draw-then-fill) */
    }

    /* ---- wordmark: Broadside display, lowercase 800, negative-tracked ---- */
    [class~="05-bookend-wordmark"] {
      margin-top: 1.9cqw;
      font-family: "Barlow", sans-serif;
      font-weight: 800;
      font-size: 4.2cqw; /* 80px — clearly secondary to the statement */
      line-height: 1;
      letter-spacing: -0.03em;
      color: #ffffff; /* ink */
      white-space: nowrap;
    }

    /* ---- meta line: IBM Plex Mono chrome, uppercase label + lowercase URL verbatim ---- */
    [class~="05-bookend-meta"] {
      margin-top: 1.35cqw;
      font-family: "IBM Plex Mono", monospace;
      font-weight: 500;
      font-size: 1cqw; /* 19px — mono chrome */
      line-height: 1.4;
      letter-spacing: 0.14em;
      color: #afb3b7; /* muted */
      white-space: nowrap;
    }

    /* ---- statement row: the one display moment + the green tick after it ---- */
    [class~="05-bookend-statement-row"] {
      margin-top: 2.4cqw;
      display: flex;
      align-items: baseline;
      justify-content: center;
    }
    [class~="05-bookend-statement"] {
      font-family: "Barlow", sans-serif;
      font-weight: 900;
      font-size: 9.4cqw; /* 180px — THE display moment */
      line-height: 0.9;

      white-space: nowrap;

    [class~="05-bookend-proof"] {

    [class~="05-bookend-tick"] {
      width: 5.2cqw; /* 100px */
      height: 4.4cqw;

      display: inline-block;
      overflow: visible;
    }
    [class~="05-bookend-tick-path"] {
      fill: none;
      stroke: #0ca30c; /* GREEN — the film's only green */
      stroke-width: 13;

      stroke-linejoin: miter;

  <div
    id="root"
    data-composition-id="05-bookend"
    data-start="0"
    data-duration="6"
    data-width="1920"
    data-height="1080"
  >
    <!-- track 0: ground -->
    <div class="clip 05-bookend-bg" data-start="0" data-duration="6" data-track-index="0"></div>

    <!-- track 1: the series lockup -->
    <div class="clip 05-bookend-stage" data-start="0" data-duration="6" data-track-index="1">
      <div class="05-bookend-lockup" data-layout-allow-overlap="">
        <svg
          class="05-bookend-mark"
          viewBox="0 0 120 120"
          xmlns="http://www.w3.org/2000/svg"
          data-layout-allow-overlap=""
        >
          <path class="05-bookend-mark-outer" d="M 60 6 L 114 60 L 60 114 L 6 60 Z" />
          <path class="05-bookend-mark-inner" d="M 60 40 L 80 60 L 60 80 L 40 60 Z" />
        </svg>
        <div class="05-bookend-wordmark" data-layout-allow-overlap="">var-runtime</div>
        <div class="05-bookend-meta" data-layout-allow-overlap="">OPEN SOURCE · github.com/signet-labs/var-runtime</div>
        <div class="05-bookend-statement-row" data-layout-allow-overlap="">
          <span class="05-bookend-statement" data-layout-allow-overlap=""><span class="05-bookend-proof" data-layout-allow-overlap="">proof</span>-or-stop.</span>
          <svg
            class="05-bookend-tick"
            viewBox="0 0 100 84"
            xmlns="http://www.w3.org/2000/svg"
            data-layout-allow-overlap=""
          >
            <path class="05-bookend-tick-path" d="M 10 46 L 38 74 L 90 12" />
          </svg>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var root =
        (document.currentScript && document.currentScript.previousElementSibling) ||
        document.querySelector('[data-composition-id="05-bookend"]');
      var q = function (c) {
        return root.querySelector('[class~="' + c + '"]');
      };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out" } });

      // ---- svg-path-draw setup: measured geometry, never guessed ----
      var outer = q("05-bookend-mark-outer");
      var tick = q("05-bookend-tick-path");
      var outerLen = outer.getTotalLength();
      var tickLen = tick.getTotalLength();
      gsap.set(outer, { strokeDasharray: outerLen });
      gsap.set(tick, { strokeDasharray: tickLen });

      // ---- Scene 1 (0.12–1.1s): the ◈ mark draws once — outer diamond traces
      // in accent blue (power2.out, a hand lifting at the end of the stroke),
      // then the inner diamond fills (draw-then-fill).
      tl.fromTo(
        outer,
        { strokeDashoffset: outerLen },
        { strokeDashoffset: 0, duration: 0.72, ease: "power2.out" },
        0.12
      );
      tl.fromTo(
        q("05-bookend-mark-inner"),
        { fillOpacity: 0 },
        { fillOpacity: 1, duration: 0.26, ease: "power1.out" },
        0.84
      );

      // ---- Scene 2 (1.1–3.25s): the lockup assembles calmly, each piece on its
      // voiceover cue — wordmark ("var-runtime"), meta ("open source"), statement
      // ("Proof-or-Stop"). One restrained move each: gentle fade + subtle rise,
      // wordmark/settle scale per the blueprint's single-reveal register.
      tl.fromTo(
        q("05-bookend-wordmark"),
        { opacity: 0, y: 26, scale: 0.965 },
        { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power2.out" },
        1.1
      );
      tl.fromTo(
        q("05-bookend-meta"),
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" },
        1.72
      );
      tl.fromTo(
        q("05-bookend-statement-row"),
        { opacity: 0, y: 30 },
        { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" },
        2.55
      );

      // ---- Scene 2 close (3.35–3.75s): the green tick lands after the
      // statement — one stroke draw, the film's only green.
      tl.fromTo(
        tick,
        { strokeDashoffset: tickLen },
        { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
        3.35
      );

      // ---- Scene 3 (3.75–6.0s): DEAD STILL — the allocated stillness is the
      // deliverable (2.25s hold; no breathing, no drift, no exit).

      window.__timelines["05-bookend"] = tl;
    })();
  </script>
