<template>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    /* ---- fonts (shipped with project, project-root relative) ---- */
    @font-face {
      font-family: "Barlow";
      src: url("assets/fonts/Barlow-900.woff2") format("woff2");
      font-weight: 900;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "IBM Plex Mono";
      src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: block;
    }

    /* ---- root (styled via #root only) ---- */
    #root {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
    }

    /* ---- full-bleed ground: clip layer on the lowest track ---- */
    [class~="04-name-bg"] {
      position: absolute;
      inset: 0;
      background: #0d0d0d; /* page ground — semantic law */
      container-type: size;
    }

    /* ---- content clip ---- */
    [class~="04-name-stage"] {
      position: absolute;
      inset: 0;
      container-type: size;
    }

    /* lockup wrapper — GSAP-driven imperceptible settle only; no CSS transform */
    [class~="04-name-lockup"] {
      position: absolute;
      inset: 0;
    }

    /* ---- the ◈ mark — authored SVG, stroke draw-on, accent blue ---- */
    [class~="04-name-mark"] {
      position: absolute;
      top: 200px; /* centered upper third */
      left: 0;
      right: 0;
      margin: 0 auto; /* inset centering — no CSS transform (GSAP-safe) */
      width: 200px;
      height: 200px;
      display: block;
      overflow: visible;
    }
    [class~="04-name-mark"] path {
      fill: none; /* outline-only draw — a fill would appear immediately */
      stroke: #3987e5; /* accent blue — semantic law for the mark */
      stroke-width: 7;
      stroke-linecap: butt;
      stroke-linejoin: miter; /* sharp diamond apexes — flat system, 0 radius */
    }

    /* ---- "proof-or-stop." — Broadside display ramp: lowercase 900, negative-tracked ---- */
    [class~="04-name-word"] {
      position: absolute;
      top: 468px;
      left: 0;
      width: 100%;
      margin: 0;
      text-align: center;
      white-space: nowrap;
      font-family: "Barlow", sans-serif;
      font-weight: 900;
      font-size: 10.5cqw;
      line-height: 0.88;
      letter-spacing: -0.04em;
      color: #ffffff; /* ink — semantic law for statements */
    }

    /* ---- "var-runtime" — IBM Plex Mono chrome, uppercase, 0.14em ---- */
    [class~="04-name-meta"] {
      position: absolute;
      top: 700px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 28px;
    }
    [class~="04-name-meta-line"] {
      width: 88px;
      height: 1px; /* 1px hairline — the system's structure */
      background: rgba(255, 255, 255, 0.2);
    }
    [class~="04-name-meta-text"] {
      font-family: "IBM Plex Mono", monospace;
      font-weight: 500;
      font-size: 1.4cqw;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #afb3b7; /* muted chrome on dark */
      white-space: nowrap;
    }
  </style>

  <div
    id="root"
    data-composition-id="04-name"
    data-start="0"
    data-duration="6"
    data-width="1920"
    data-height="1080"
  >
    <!-- track 0: ground -->
    <div class="clip 04-name-bg" data-start="0" data-duration="6" data-track-index="0"></div>

    <!-- track 1: the lockup -->
    <div class="clip 04-name-stage" data-start="0" data-duration="6" data-track-index="1">
      <div class="04-name-lockup">
        <!-- ◈ mark: outer + inner diamond, drawn as two sequential pen strokes -->
        <svg
          class="04-name-mark"
          viewBox="0 0 200 200"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <path class="04-name-arc-outer" d="M100 14 L186 100 L100 186 L14 100 Z" />
          <path class="04-name-arc-inner" d="M100 62 L138 100 L100 138 L62 100 Z" />
        </svg>

        <!-- the law, set beneath the mark -->
        <h1 class="04-name-word">proof-or-stop.</h1>

        <!-- the name, in mono chrome -->
        <div class="04-name-meta">
          <div class="04-name-meta-line"></div>
          <div class="04-name-meta-text">var-runtime</div>
          <div class="04-name-meta-line"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var root =
        (document.currentScript && document.currentScript.previousElementSibling) ||
        document.querySelector('[data-composition-id="04-name"]');
      var q = function (c) {
        return root.querySelector('[class~="' + c + '"]');
      };
      var qa = function (c) {
        return root.querySelectorAll('[class~="' + c + '"]');
      };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ---- Setup: measure each diamond stroke and set the dash pattern
      // (measured geometry, never guessed — svg-path-draw).
      var outer = q("04-name-arc-outer");
      var inner = q("04-name-arc-inner");
      var lenO = outer.getTotalLength();
      var lenI = inner.getTotalLength();
      [outer, inner].forEach(function (p) {
        p.style.strokeDasharray = "" + p.getTotalLength();
        p.style.strokeDashoffset = "" + p.getTotalLength();
      });

      // ---- Scene 1 (0.2–1.4s): the ◈ mark draws ONCE — outer diamond first,
      // inner diamond staggered at ~75% (continuous pen motion, power2.out;
      // pens don't bounce). Centered upper third, blue, flat.
      tl.fromTo(
        outer,
        { strokeDashoffset: lenO },
        { strokeDashoffset: 0, duration: 0.85, ease: "power2.out" },
        0.2
      );
      tl.fromTo(
        inner,
        { strokeDashoffset: lenI },
        { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
        0.84
      );

      // ---- Scene 2 (1.55–2.4s): "proof-or-stop." sets beneath the mark as the
      // voice reaches it — one quiet rise-and-settle, display ramp, ink.
      tl.fromTo(
        q("04-name-word"),
        { opacity: 0, y: 36 },
        { opacity: 1, y: 0, duration: 0.85, ease: "power3.out" },
        1.55
      );

      // ---- Scene 3 (2.7–3.4s): "var-runtime" resolves under it in mono chrome;
      // the hairline flanks sweep out from the name's center.
      tl.fromTo(
        q("04-name-meta-text"),
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" },
        2.7
      );
      qa("04-name-meta-line").forEach(function (line, i) {
        tl.fromTo(
          line,
          { scaleX: 0, opacity: 0 },
          {
            scaleX: 1,
            opacity: 1,
            duration: 0.6,
            ease: "power2.out"
          },
          2.7 + i * 0.05
        );
      });

      // ---- Scene 4 (3.4–6.0s): the lockup HOLDS STILL — signature endcard
      // stillness is the payload; a near-imperceptible settle (1.2% over the
      // hold) keeps it alive without motion. No exit — the root transition owns it.
      tl.fromTo(
        q("04-name-lockup"),
        { scale: 1, transformOrigin: "50% 43%" },
        { scale: 1.012, duration: 2.6, ease: "none" },
        3.4
      );

      window.__timelines["04-name"] = tl;
    })();
  </script>
</template>
