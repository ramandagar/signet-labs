<template>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    /* ---- fonts (shipped with project, project-root relative) ---- */
    @font-face {
      font-family: "Barlow";
      src: url("assets/fonts/Barlow-900.woff2") format("woff2");
      font-weight: 900;
      font-style: normal;
      font-display: block;
    }

    /* ---- root (styled via #root only) ---- */
    #root {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
    }

    /* ---- full-bleed ground: clip layer on the lowest track ---- */
    [class~="02-selfreport-bg"] {
      position: absolute;
      inset: 0;
      background: #0d0d0d; /* page ground — semantic law */
      container-type: size;
    }

    /* ghost "self" watermark — huge, cropped at the caption keep-out (83%) */
    [class~="02-selfreport-ghost-stage"] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 83%;
      overflow: hidden;
    }
    [class~="02-selfreport-ghost-wrap"] {
      position: absolute;
      left: 50%;
      top: 37%; /* centered by GSAP xPercent/yPercent — no CSS transform here */
    }
    [class~="02-selfreport-ghost"] {
      font-family: "Barlow", sans-serif;
      font-weight: 900;
      font-size: 54cqw;
      line-height: 0.75;
      letter-spacing: -0.04em;
      color: #ffffff;
      opacity: 0; /* seated by GSAP to 0.055 */
      transform-origin: 50% 50%;
      user-select: none;
    }

    /* ---- content clip ---- */
    [class~="02-selfreport-stage"] {
      position: absolute;
      inset: 0;
      container-type: size;
    }

    /* statement — Broadside display: lowercase 900, negative-tracked, centered */
    [class~="02-selfreport-statement"] {
      position: absolute;
      top: 46%;
      left: 0;
      width: 100%;
      margin: 0;
      transform: translateY(-50%); /* static container, never GSAP-animated */
      text-align: center;
      font-family: "Barlow", sans-serif;
      font-weight: 900;
      font-size: 10cqw;
      line-height: 0.98;
      letter-spacing: -0.04em;

    }
    [class~="02-selfreport-line"] {
      display: block;
      white-space: nowrap;
    }
    [class~="02-selfreport-w"] {
      display: inline-block;
    }
    [class~="02-selfreport-key"] {
      color: #3987e5; /* accent blue — the one keyword pop: "fact." */
    }
  </style>

  <div
    id="root"
    data-composition-id="02-selfreport"
    data-start="0"
    data-duration="6.5"
    data-width="1920"
    data-height="1080"
  >
    <!-- track 0: ground + ghost watermark -->
    <div class="clip 02-selfreport-bg" data-start="0" data-duration="6.5" data-track-index="0">
      <div class="02-selfreport-ghost-stage">
        <div class="02-selfreport-ghost-wrap">
          <div class="02-selfreport-ghost">self</div>
        </div>
      </div>
    </div>

    <!-- track 1: the statement -->
    <div class="clip 02-selfreport-stage" data-start="0" data-duration="6.5" data-track-index="1">
      <h1 class="02-selfreport-statement" data-layout-allow-overlap="">
        <span class="02-selfreport-line" data-layout-allow-overlap=""><span class="02-selfreport-w" data-layout-allow-overlap="">a</span> <span class="02-selfreport-w" data-layout-allow-overlap="">self-report</span></span>
        <span class="02-selfreport-line" data-layout-allow-overlap=""><span class="02-selfreport-w" data-layout-allow-overlap="">is</span> <span class="02-selfreport-w" data-layout-allow-overlap="">not</span> <span class="02-selfreport-w" data-layout-allow-overlap="">a</span> <span class="02-selfreport-w 02-selfreport-key" data-layout-allow-overlap="">fact.</span></span>
      </h1>

  </div>

  <script>
    (function () {
      var root =
        (document.currentScript && document.currentScript.previousElementSibling) ||
        document.querySelector('[data-composition-id="02-selfreport"]');
      var q = function (c) {
        return root.querySelector('[class~="' + c + '"]');
      };
      var qa = function (c) {
        return root.querySelectorAll('[class~="' + c + '"]');
      };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out" } });

      // ---- Scene 1 (0.0–~1.3s): the ghost watermark "self" seats — rises from
      // slightly oversized + invisible to its 5.5% watermark state, slow settle.
      tl.fromTo(
        q("02-selfreport-ghost-wrap"),
        { xPercent: -50, yPercent: -50, scale: 1 },
        { xPercent: -50, yPercent: -50, scale: 1, duration: 6.5, ease: "none" },
        0
      );
      tl.fromTo(
        q("02-selfreport-ghost"),
        { opacity: 0, scale: 1.07 },
        { opacity: 0.055, scale: 1, duration: 1.2, ease: "power2.out" },
        0.05
      );

      // ---- Scene 1–2 (~0.3–2.5s): "a self-report is not a fact." builds
      // word-by-word at center, synced to the voice; "fact." lands blue.
      var words = [
        { el: qa("02-selfreport-w")[0], at: 0.3 },
        { el: qa("02-selfreport-w")[1], at: 0.6 },
        { el: qa("02-selfreport-w")[2], at: 1.24 },
        { el: qa("02-selfreport-w")[3], at: 1.56 },
        { el: qa("02-selfreport-w")[4], at: 1.8 },
        { el: q("02-selfreport-key"), at: 2.0, dur: 0.5, y: 38, blur: 12, ease: "power3.out" }
      ];
      words.forEach(function (w) {
        tl.fromTo(
          w.el,
          { opacity: 0, y: w.y || 34, filter: "blur(" + (w.blur || 10) + "px)" },
          {
            opacity: 1,
            y: 0,
            filter: "blur(0px)",
            duration: w.dur || 0.6,
            ease: w.ease || "power2.out"
          },
          w.at
        );
      });

      // ---- Scene 3 (2.5–6.5s): deliberate stillness — the line holds STILL
      // to the end (stillness is the payload; no exit, the root transition owns it).

      window.__timelines["02-selfreport"] = tl;
    })();
  </script>
