<template id="captions-template" data-composition-id="captions" data-width="1920" data-height="1080">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>


<style data-brand-tokens>
      @font-face { font-family: 'Barlow'; src: url('assets/fonts/Barlow-400.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
      @font-face { font-family: 'Barlow'; src: url('assets/fonts/Barlow-600.woff2') format('woff2'); font-weight: 600; font-style: normal; font-display: block; }
      @font-face { font-family: 'Barlow'; src: url('assets/fonts/Barlow-700.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: block; }
      @font-face { font-family: 'Barlow'; src: url('assets/fonts/Barlow-800.woff2') format('woff2'); font-weight: 800; font-style: normal; font-display: block; }
      @font-face { font-family: 'Barlow'; src: url('assets/fonts/Barlow-900.woff2') format('woff2'); font-weight: 900; font-style: normal; font-display: block; }
      :root {
      --ink-black: #FFFFFF;
      --ink-black-alt: #E5E6E7;
      --fire-orange: #3987E5;
      --cream: #1A1A19;
      --cream-muted: #0CA30C;
      --cream-hint: #AFB3B7;
      --border-dark: #D7D8D9;
      --ink-on-orange-muted: rgba(255,255,255,0.75);
      --ink-on-orange-hint: rgba(255,255,255,0.55);
      --ink-on-orange-faint: rgba(255,255,255,0.40);
      --ink-on-orange-border: rgba(255,255,255,0.20);
      --cap-ink: #FFFFFF;
      --cap-canvas: #1A1A19;
      --cap-accent: #3987E5;
      --cap-accent-2: #0CA30C;
      --font-display: "Barlow", system-ui, serif;
      --font-body: "Barlow", system-ui, sans-serif;
      --cap-band-top: 900px;
      --cap-band-height: 180px;
      }
    </style>

<style>
  #captions-root {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .caption-layer {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
  }
  /* the keep-out band, from captionBand(H) — frame content stays above it */
  .caption-stage {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--cap-band-top, 900px);
    height: var(--cap-band-height, 180px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .caption-group {
    /* every group is absolutely stacked over the SAME band — exactly one shown at a
       time via opacity. Must be absolute: in-flow groups would lay out side-by-side. */
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
  }

  /* THE ink-black plate — single 1px fire-orange hairline (broadside's lone accent),
     SHARP corners (0 radius), NO shadow (the plane is flat) */
  .caption-pill {
    max-width: 80%;
    padding: 18px 44px 22px;
    background: var(--cap-ink, #111111);
    border: 1px solid var(--cap-accent, #e85d26);
    border-radius: 0;
  }
  .caption-line {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.04em 0.3em;
    font-family: "Barlow", system-ui, sans-serif;
    font-weight: 900;
    font-size: clamp(38px, 4.2vw, 56px);
    line-height: 1.02;
    letter-spacing: -0.03em;
    text-transform: lowercase;
  }

  /* upcoming — faint cream, no block (massive lowercase Barlow 900 as graphic primitive) */
  .caption-word {
    display: inline-block;
    padding: 0 0.08em;
    color: color-mix(in srgb, var(--cap-canvas, #f0ece5) 42%, var(--cap-ink, #111111));
  }
  /* current word — THE register flip: a hard flat fire-orange block (box-shadow spread =
     a sharp rectangle w/o layout shift; no blur), ink reading on top — the lone accent */
  .caption-word.is-active {
    color: var(--cap-ink, #111111);
    background: var(--cap-accent, #e85d26);
    box-shadow: 0 0 0 0.06em var(--cap-accent, #e85d26);
  }
  /* already spoken — solid cream, the orange block cleared */
  .caption-word.is-spoken {
    color: var(--cap-canvas, #f0ece5);
    background: transparent;
    box-shadow: none;
  }

  /* optional per-word accents (dormant until a word-classer tags them) */
  /* brand / key term — fire-orange ink, the cream-on-ink register's only inflection */
  .caption-word.cap-brand {
    color: var(--cap-accent, #e85d26);
  }
  /* numerals / data — the IBM Plex Mono chrome voice, uppercase + tracked, recessed */
  .caption-word.cap-num {
    font-family: "Barlow", ui-monospace, monospace;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: color-mix(in srgb, var(--cap-canvas, #f0ece5) 72%, var(--cap-ink, #111111));
  }
  /* emphasis — a fire-orange hairline underline (no second hue; the lone accent again) */
  .caption-word.cap-cta {
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-decoration-color: var(--cap-accent-2, #e85d26);
    text-underline-offset: 0.1em;
  }

  @media (max-aspect-ratio: 9/16) {
    .caption-pill {
      max-width: 92%;
    }
    .caption-line {
      font-size: clamp(32px, 5.2vw, 46px);
    }
  }
</style>

<div
  id="captions-root"
  data-composition-id="captions"
  data-timeline-locked
  data-start="0"
  data-duration="32"
  data-fps="30"
  data-width="1920"
  data-height="1080"
>
  <div class="caption-layer" aria-hidden="true">
    <div id="caption-stage" class="caption-stage"></div>
  </div>
</div>

<script>
  // captions.mjs injects the engine's scene-aware groups + real duration here.
  var GROUPS = [{"id":"caption-group-0","frame":1,"start":0.09,"end":0.37,"text":"a log","words":[{"id":"caption-word-0-0","text":"a","start":0.09,"end":0.13},{"id":"caption-word-0-1","text":"log","start":0.13,"end":0.37}]},{"id":"caption-group-1","frame":1,"start":0.37,"end":0.93,"text":"line is","words":[{"id":"caption-word-1-0","text":"line","start":0.37,"end":0.75},{"id":"caption-word-1-1","text":"is","start":0.75,"end":0.93}]},{"id":"caption-group-2","frame":1,"start":0.93,"end":2.08,"text":"not evidence.","words":[{"id":"caption-word-2-0","text":"not","start":0.93,"end":1.22},{"id":"caption-word-2-1","text":"evidence.","start":1.22,"end":1.96}]},{"id":"caption-group-3","frame":2,"start":7.09,"end":8.26,"text":"a self-report is","words":[{"id":"caption-word-3-0","text":"a","start":7.09,"end":7.1},{"id":"caption-word-3-1","text":"self-report","start":7.1,"end":8.08},{"id":"caption-word-3-2","text":"is","start":8.08,"end":8.26}]},{"id":"caption-group-4","frame":2,"start":8.26,"end":9.12,"text":"not a fact.","words":[{"id":"caption-word-4-0","text":"not","start":8.26,"end":8.53},{"id":"caption-word-4-1","text":"a","start":8.53,"end":8.62},{"id":"caption-word-4-2","text":"fact.","start":8.62,"end":9}]},{"id":"caption-group-5","frame":3,"start":13.55,"end":14.59,"text":"No evidence,","words":[{"id":"caption-word-5-0","text":"No","start":13.55,"end":13.68},{"id":"caption-word-5-1","text":"evidence,","start":13.68,"end":14.59}]},{"id":"caption-group-6","frame":3,"start":14.59,"end":15.62,"text":"no advance.","words":[{"id":"caption-word-6-0","text":"no","start":14.59,"end":14.77},{"id":"caption-word-6-1","text":"advance.","start":14.77,"end":15.5}]},{"id":"caption-group-7","frame":4,"start":20.05,"end":21.97,"text":"proof-or-stop via runtime.","words":[{"id":"caption-word-7-0","text":"proof-or-stop","start":20.05,"end":21},{"id":"caption-word-7-1","text":"via","start":21,"end":21.24},{"id":"caption-word-7-2","text":"runtime.","start":21.24,"end":21.85}]},{"id":"caption-group-8","frame":5,"start":26.09,"end":28.03,"text":"VaRuntime open source,","words":[{"id":"caption-word-8-0","text":"VaRuntime","start":26.09,"end":26.83},{"id":"caption-word-8-1","text":"open","start":26.83,"end":27.22},{"id":"caption-word-8-2","text":"source,","start":27.22,"end":27.96}]},{"id":"caption-group-9","frame":5,"start":28.03,"end":29.16,"text":"proof or stop.","words":[{"id":"caption-word-9-0","text":"proof","start":28.03,"end":28.43},{"id":"caption-word-9-1","text":"or","start":28.43,"end":28.62},{"id":"caption-word-9-2","text":"stop.","start":28.62,"end":29.04}]}];
  var DURATION = 32;

  (function () {
    var stage = document.getElementById("caption-stage");

    // build DOM: one .caption-group per group, .caption-word per word
    GROUPS.forEach(function (group, g) {
      var groupEl = document.createElement("div");
      groupEl.className = "caption-group";
      groupEl.id = "caption-group-" + g;
      var pill = document.createElement("div");
      pill.className = "caption-pill";
      var line = document.createElement("div");
      line.className = "caption-line";
      (group.words || []).forEach(function (w, i) {
        var span = document.createElement("span");
        span.className = "caption-word";
        span.id = "caption-word-" + g + "-" + i;
        span.textContent = String(w.text);
        line.appendChild(span);
      });
      pill.appendChild(line);
      groupEl.appendChild(pill);
      stage.appendChild(groupEl);
    });

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    GROUPS.forEach(function (group, g) {
      var groupEl = document.getElementById("caption-group-" + g);
      var words = group.words || [];
      var next = GROUPS[g + 1];
      var isLast = g === GROUPS.length - 1;
      var start = Math.max(0, Number(group.start));
      var end = isLast ? DURATION : Math.min(Number(next.start), Number(group.end) + 0.3);
      if (end <= start) end = start + 0.01;

      // group on/off — exactly one group visible at a time
      tl.set(groupEl, { opacity: 1 }, start);
      tl.set(groupEl, { opacity: 0 }, end);

      // 3-state karaoke via className SETS — seek-safe (gsap.set applies on the
      // engine's frame-by-frame seek; .call callbacks would NOT fire).
      words.forEach(function (w, i) {
        var el = document.getElementById("caption-word-" + g + "-" + i);
        var at = Math.max(start, Number(w.start));
        tl.set(el, { className: "caption-word" }, start); // upcoming (also resets on reverse-seek)
        tl.set(el, { className: "caption-word is-active" }, at); // current
        tl.fromTo(el, { scale: 0.92 }, { scale: 1, duration: 0.1, ease: "power3.out" }, at);
        if (i + 1 < words.length) {
          var nextAt = Math.max(start, Number(words[i + 1].start));
          tl.set(el, { className: "caption-word is-spoken" }, nextAt); // demote when next activates
        }
      });
      if (words.length) {
        var lastEl = document.getElementById("caption-word-" + g + "-" + (words.length - 1));
        var lastSpoken = Math.min(end, Number(words[words.length - 1].end) + 0.1);
        tl.set(lastEl, { className: "caption-word is-spoken" }, lastSpoken);
      }
    });

    // full-span anchor so the sub-comp timeline spans the whole video
    tl.to({}, { duration: DURATION }, 0);
    window.__timelines["captions"] = tl;
  })();
</script>

<style>
  .caption-line { line-height: 1.1 !important; }
</style>
</template>
