<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #1A1A19;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="32"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-logline"
        class="scene"
        data-composition-id="01-logline"
        data-composition-src="compositions/frames/01-logline.html"
        data-start="0"
        data-duration="7"
        data-track-index="1"
      ></div>
      <audio
        id="el-01-logline-voice"
        src="assets/voice/01.wav"
        data-start="0"
        data-duration="7"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-02-selfreport"
        class="scene"
        data-composition-id="02-selfreport"
        data-composition-src="compositions/frames/02-selfreport.html"
        data-start="7"
        data-duration="6.5"
        data-track-index="1"
      ></div>
      <audio
        id="el-02-selfreport-voice"
        src="assets/voice/02.wav"
        data-start="7"
        data-duration="6.5"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-03-law"
        class="scene"
        data-composition-id="03-law"
        data-composition-src="compositions/frames/03-law.html"
        data-start="13.5"
        data-duration="6.5"
        data-track-index="1"
      ></div>
      <audio
        id="el-03-law-voice"
        src="assets/voice/03.wav"
        data-start="13.5"
        data-duration="6.5"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-04-name"
        class="scene"
        data-composition-id="04-name"
        data-composition-src="compositions/frames/04-name.html"
        data-start="20"
        data-duration="6"
        data-track-index="1"
      ></div>
      <audio
        id="el-04-name-voice"
        src="assets/voice/04.wav"
        data-start="20"
        data-duration="6"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-05-bookend"
        class="scene"
        data-composition-id="05-bookend"
        data-composition-src="compositions/frames/05-bookend.html"
        data-start="26"
        data-duration="6"
        data-track-index="1"
      ></div>
      <audio
        id="el-05-bookend-voice"
        src="assets/voice/05.wav"
        data-start="26"
        data-duration="6"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <!-- captions -->
      <div
        id="el-captions"
        class="scene"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="32"
        data-track-index="2"
      ></div>



      <!-- BGM: CC0 series bed — sub-drop aligned -->
      <audio id="el-bgm" src="assets/audio/ambient-bed.wav" data-start="0" data-duration="32.0" data-media-start="50.85" data-track-index="11" data-volume="0.12"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
