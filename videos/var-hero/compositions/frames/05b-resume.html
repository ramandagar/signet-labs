        <span>session · crash / resume</span>
        <span class="f05-counter" id="f05-counter">steps 6/9</span>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var D = 8.64;
        var GREEN = "#0ca30c";
        var ACCENT = "#3987e5";
        var DIM = "#afb3b7";

        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["05b-resume"] = tl;

        var $ = function (id) {
          return document.getElementById(id);
        };

        /* ── setup: stroke draws measured, never guessed ── */
        var ticks = [];
        document.querySelectorAll(".f05-tickp").forEach(function (p) {
          var len = p.getTotalLength() * 1.02;
          p.style.strokeDasharray = String(len);
          p.style.strokeDashoffset = String(len);
          ticks.push(p);
        });
        var meterTick = $("f05-metertick-p");
        var meterTickLen = meterTick.getTotalLength() * 1.02;
        meterTick.style.strokeDasharray = String(meterTickLen);
        meterTick.style.strokeDashoffset = String(meterTickLen);
        var meterBox = $("f05-meterbox-rect");
        var meterBoxLen = meterBox.getTotalLength() * 1.02;
        meterBox.style.strokeDasharray = String(meterBoxLen);
        meterBox.style.strokeDashoffset = String(meterBoxLen);
        var edgeRect = $("f05-edge-rect");
        var edgeLen = edgeRect.getTotalLength() * 1.02;
        edgeRect.style.strokeDasharray = String(edgeLen);
        edgeRect.style.strokeDashoffset = String(edgeLen);

        /* green discs (steps 7–9) hidden until their flip */
        [6, 7, 8].forEach(function (i) {
          gsap.set("#f05-disc-" + i, { opacity: 0 });
        });

        /* ── discrete text sequences (deterministic token streams) ── */
        function textAt(seq, t) {
          for (var i = seq.length - 1; i >= 0; i--) {
            if (t >= seq[i].t) return seq[i].s;
          }
          return "";
        }
        function typeSeq(str, t0, step) {
          return str.split("").map(function (c, i) {
            return { t: t0 + i * step, s: str.slice(0, i + 1) };
          });
        }
        var SEQ1 = typeSeq("session.run(", 0.45, 0.055);
        var SEQ2 = typeSeq('claim: "', 1.15, 0.05);
        var SEQ3 = typeSeq('"meter_intact"', 1.55, 0.04);
        var SEQ4 = [{ t: 2.08, s: ")" }];
        var METER = [
          { t: 0.72, s: "$1.38" },
          { t: 1.02, s: "$1.39" },
          { t: 1.32, s: "$1.40" },
          { t: 1.66, s: "$1.41" },
          { t: 1.98, s: "$1.42" },
        ];
        var EXIT = typeSeq("exit 1 · step 7 interrupted", 2.95, 0.032);
        var R1 = typeSeq("resumed at step ", 4.6, 0.05);
        var R2 = [{ t: 5.4, s: "7" }];
        var R3 = [{ t: 5.55, s: " · " }];
        var R4 = typeSeq("meter intact", 5.75, 0.055);
        var COUNTER = [
          { t: 5.55, s: 7 },
          { t: 6.2, s: 8 },
          { t: 6.85, s: 9 },
        ];

        var t1 = $("f05-t1"),
          t2 = $("f05-t2"),
          t3 = $("f05-t3"),
          t4 = $("f05-t4"),
          caret = $("f05-caret"),
          caret2 = $("f05-caret2"),
          amt = $("f05-amt"),
          exitTxt = $("f05-exit-txt"),
          counter = $("f05-counter");
        var r1e = $("f05-r1"),
          r2e = $("f05-r2"),
          r3e = $("f05-r3"),
          r4e = $("f05-r4");
        var arcs = [6, 7, 8].map(function (i) {
          return $("f05-arc-" + i).querySelector("circle");
        });
        /* rotation windows — the spinner runs only while its step is live */
        var WINS = [
          [
            [0.35, 2.2],
            [4.35, 5.42],
          ],
          [[5.45, 6.07]],
          [[6.1, 6.72]],
        ];

        /* one linear driver carries every discrete state — pure functions of t */
        var drv = { t: 0 };
        tl.to(
          drv,
          {
            t: D,
            duration: D,
            ease: "none",
            onUpdate: function () {
              var t = drv.t;
              t1.textContent = textAt(SEQ1, t);
              t2.textContent = textAt(SEQ2, t);
              t3.textContent = textAt(SEQ3, t);
              t4.textContent = textAt(SEQ4, t);
              caret.style.opacity =
                t >= 0.35 && t < 2.14 ? (Math.sin((t / 0.7) * Math.PI * 2) > 0 ? "1" : "0") : "0";
              amt.textContent = textAt(METER, t);
              exitTxt.textContent = textAt(EXIT, t);
              r1e.textContent = textAt(R1, t);
              r2e.textContent = textAt(R2, t);
              r3e.textContent = textAt(R3, t);
              r4e.textContent = textAt(R4, t);
              caret2.style.opacity =
                t >= 4.5 && t < 6.45 ? (Math.sin((t / 0.7) * Math.PI * 2) > 0 ? "1" : "0") : "0";
              var n = 6;
              for (var i = COUNTER.length - 1; i >= 0; i--) {
                if (t >= COUNTER[i].t) {
                  n = COUNTER[i].s;
                  break;
                }
              }
              counter.textContent = "steps " + n + "/9";
              counter.style.color = n >= 9 ? GREEN : "#ffffff";
              for (var a = 0; a < WINS.length; a++) {
                for (var w = 0; w < WINS[a].length; w++) {
                  var win = WINS[a][w];
                  if (t >= win[0] && t < win[1]) {
                    arcs[a].setAttribute("transform", "rotate(" + (((t - win[0]) * 300) % 360) + " 28 28)");
                    break;
                  }
                }
              }
            },
          },
          0
        );

        /* ── Scene 1 (0.0–2.2): card seats mid-work, header types, meter ticks up ── */
        tl.fromTo("#f05-chrome-top", { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.32, ease: "power3.out" }, 0);
        tl.fromTo("#f05-chrome-bot", { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.32, ease: "power3.out" }, 0.06);
        tl.fromTo("#f05-card", { y: -36, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.05);
        tl.fromTo("#f05-ghost", { opacity: 0 }, { opacity: 0.05, duration: 0.6, ease: "power1.out" }, 0.1);
        tl.fromTo("#f05-d1", { opacity: 0 }, { opacity: 0.8, duration: 0.3, ease: "power1.out" }, 0.18);
        tl.fromTo("#f05-d2", { opacity: 0 }, { opacity: 0.5, duration: 0.3, ease: "power1.out" }, 0.28);
        tl.fromTo("#f05-raillabel", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0.3);

        var cells = document.querySelectorAll(".f05-cell");
        cells.forEach(function (cell, i) {
          var land = 0.35 + i * 0.07;
          tl.fromTo(cell, { y: 18, opacity: 0 }, { y: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, land);
          if (i < 6) {
            /* pre-seated done steps: white discs, ticks drawn in behind the build */
            tl.to(ticks[i], { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" }, land + 0.18);
          }
        });
        tl.fromTo("#f05-meterrow", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.7);
        tl.fromTo("#f05-st-run", { opacity: 0, x: 10 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 1.0);

        /* the one shimmer pass of the working state */
        tl.fromTo("#f05-sheen", { x: -260 }, { x: 1330, duration: 0.8, ease: "none" }, 1.05);
        tl.fromTo("#f05-sheen", { opacity: 0 }, { opacity: 0.9, duration: 0.2, ease: "power1.out" }, 1.08);
        tl.to("#f05-sheen", { opacity: 0, duration: 0.22, ease: "power1.in" }, 1.63);

        /* ── Scene 2 (2.2–4.0): dies — flicker, dim to 20%, red X stamp, hard stop ── */
        tl.to("#f05-card", { opacity: 0.45, duration: 0.05, ease: "none" }, 2.2);
        tl.to("#f05-card", { opacity: 1, duration: 0.05, ease: "none" }, 2.25);
        tl.to("#f05-card", { opacity: 0.2, duration: 0.14, ease: "power2.in" }, 2.3);
        tl.to("#f05-st-run", { scale: 0.6, opacity: 0, duration: 0.18, ease: "power2.in" }, 2.42);

        /* the stamp slams in over the dimmed card */
        tl.fromTo("#f05-xwrap", { scale: 1.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.22, ease: "power4.in" }, 2.48);
        tl.to("#f05-card", { x: -3, duration: 0.05, ease: "none" }, 2.72);
        tl.to("#f05-card", { x: 2, duration: 0.05, ease: "none" }, 2.77);
        tl.to("#f05-card", { x: 0, duration: 0.09, ease: "power2.out" }, 2.82);
        tl.fromTo(
          "#f05-st-dead",
          { scale: 0.6, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.7)" },
          2.78
        );
        tl.fromTo("#f05-exit", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 2.88);
        /* 3.0–4.0: stillness — meter frozen at $1.42, spinner dead */

        /* ── Scene 3 (4.0–6.5): relight from checkpoint — bar sweeps, ticks 7–9 re-arm and complete ── */
        tl.to("#f05-card", { opacity: 0.6, duration: 0.07, ease: "none" }, 4.0);
        tl.to("#f05-card", { opacity: 1, duration: 0.12, ease: "power2.out" }, 4.07);
        tl.to("#f05-xwrap", { scale: 1.55, opacity: 0, duration: 0.24, ease: "power2.in" }, 4.0);
        tl.to("#f05-exit", { x: -18, opacity: 0, duration: 0.18, ease: "power2.in" }, 4.0);
        tl.to("#f05-st-dead", { scale: 0.6, opacity: 0, duration: 0.18, ease: "power2.in" }, 4.02);
        tl.fromTo(
          "#f05-st-live",
          { scale: 0.6, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.7)" },
          4.1
        );
        tl.fromTo("#f05-restorebar", { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power3.out" }, 4.15);
        tl.fromTo("#f05-meta-r", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 4.2);

        /* restore shimmer */
        tl.fromTo("#f05-sheen", { x: -260 }, { x: 1330, duration: 0.75, ease: "none" }, 4.35);
        tl.fromTo("#f05-sheen", { opacity: 0 }, { opacity: 0.9, duration: 0.18, ease: "power1.out" }, 4.38);
        tl.to("#f05-sheen", { opacity: 0, duration: 0.2, ease: "power1.in" }, 4.92);

        /* step 7 re-arms (its arc relights and spins again) */
        tl.fromTo("#f05-arc-6", { scale: 0.8 }, { scale: 1, duration: 0.3, ease: "back.out(1.6)" }, 4.35);

        /* badge flips: arc out → green disc + tick in, steps 7/8/9 */
        var flips = [
          { idx: 6, rearm: null, arcOut: 5.42, tick: 6, tickAt: 5.69 },
          { idx: 7, rearm: 5.45, arcOut: 6.07, tick: 7, tickAt: 6.34 },
          { idx: 8, rearm: 6.1, arcOut: 6.72, tick: 8, tickAt: 6.99 },
        ];
        flips.forEach(function (f) {
          var arc = "#f05-arc-" + f.idx;
          var disc = "#f05-disc-" + f.idx;
          var num = "#f05-cell-" + f.idx + " .f05-stepnum";
          if (f.rearm !== null) {
            tl.fromTo(arc, { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power3.out" }, f.rearm);
            tl.to(num, { color: ACCENT, duration: 0.25, ease: "power1.out" }, f.rearm);
          }
          tl.to(arc, { scale: 0.55, opacity: 0, duration: 0.22, ease: "power2.in" }, f.arcOut);
          tl.fromTo(
            disc,
            { scale: 0.55, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.38, ease: "back.out(1.7)" },
            f.arcOut + 0.12
          );
          tl.to(ticks[f.tick], { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, f.tickAt);
        });

        /* ── Scene 4 (6.5–8.5): completed card reads on — hold, jitter, meter intact ── */
        tl.to("#f05-st-live", { scale: 0.6, opacity: 0, duration: 0.18, ease: "power2.in" }, 6.95);
        tl.fromTo(
          "#f05-st-done",
          { scale: 0.6, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.7)" },
          7.03
        );

        /* the meter never moved — receipt draws around it */
        tl.to(meterBox, { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 7.15);
        tl.to("#f05-chiplabel", { color: GREEN, duration: 0.3, ease: "power1.out" }, 7.15);
        tl.fromTo("#f05-metertick", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, 7.3);
        tl.to(meterTick, { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" }, 7.33);

        /* subtle jitter — finite, discrete */
        tl.to("#f05-card", { x: 1.4, duration: 0.06, ease: "none" }, 7.55);
        tl.to("#f05-card", { x: -1, duration: 0.06, ease: "none" }, 7.61);
        tl.to("#f05-card", { x: 0.6, duration: 0.06, ease: "none" }, 7.67);
        tl.to("#f05-card", { x: 0, duration: 0.08, ease: "power2.out" }, 7.73);
        tl.to("#f05-card", { x: -1.2, duration: 0.06, ease: "none" }, 8.05);
        tl.to("#f05-card", { x: 0.8, duration: 0.06, ease: "none" }, 8.11);
        tl.to("#f05-card", { x: 0, duration: 0.08, ease: "power2.out" }, 8.17);

        /* family resolve: accent edge trace draws, ghost lifts */
        tl.to(edgeRect, { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, 7.7);
        tl.to("#f05-ghost", { opacity: 0.1, y: -10, duration: 0.7, ease: "power2.out" }, 7.95);
        var discEls = ["#f05-disc-6", "#f05-disc-7", "#f05-disc-8"];
        tl.to(discEls, { scale: 1.1, duration: 0.16, ease: "power2.out" }, 8.2);
        tl.to(discEls, { scale: 1, duration: 0.3, ease: "power2.inOut" }, 8.36);
      })();
    </script>
  </div>
</template>
