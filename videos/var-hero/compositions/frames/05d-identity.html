        /* glow breathes — bounded, staggered periods, end at rest */

        tl.to(

            p: Math.PI * 3,
            duration: 3.9,

            onUpdate: function () {
              var s = Math.sin(b1.p);
              gsap.set(g1, { opacity: 0.46 + s * 0.03, scale: 1 + s * 0.012 });

          1.15

        var g2 = $("f05-glow-r");

            p: Math.PI * 3,
            duration: 3.9,

            onUpdate: function () {

      })();
