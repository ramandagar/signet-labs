    <script>
      (function () {
        var D = 9.067;
        var GREEN = "#0ca30c";
        var AMBER = "#fab219";

        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["03-thirtyone"] = tl;

        var $ = function (id) {
          return document.getElementById(id);
        };

        /* ── deterministic tick field: fixed loop, index-based offsets, no randomness ── */
        var COLS = 90,
          ROWS = 20,
          N = COLS * ROWS; /* 1,800 */
        var field = $("f03-field");

        /* the 31 hidden failures — fixed scatter across the wall */
        var badIdx = [];
        for (var k = 0; k < 31; k++) badIdx[(k * 61 + 17) % N] = true;

        for (var r = 0; r < ROWS; r++) {
          for (var c = 0; c < COLS; c++) {
            var i = r * COLS + c;
            var h = 9 + ((r * 7 + c * 3) % 3) * 3.5; /* 9 / 12.5 / 16 px */
            var j = ((c * 17 + r * 23) % 7) - 3; /* -3..2 px jitter */
            var el = document.createElement("div");
            el.className = "f03-t" + (badIdx[i] ? " f03-bad" : "");
            el.style.cssText =
              "left:" + (c * 18 + 8 + j) + "px;top:" + (r * 30.5 + (30.5 - h) / 2) + "px;height:" + h + "px;";
            field.appendChild(el);
          }
        }
        var ticks = field.querySelectorAll(".f03-t");
        var bads = field.querySelectorAll(".f03-bad"); /* exactly 31 */

        /* ── discrete text sequences — pure functions of t ── */
        function textAt(seq, t) {
          for (var i = seq.length - 1; i >= 0; i--) {
            if (t >= seq[i].t) return seq[i].s;
          }
          return "";
        }
        function typeSeq(str, t0, per) {
          var seq = [];
          for (var i = 1; i <= str.length; i++) seq.push({ t: t0 + i * per, s: str.slice(0, i) });
          return seq;
        }
        var SEQ_LA = typeSeq("1,800 steps · unattended loop", 0.78, 0.03);
        var SEQ_SP = typeSeq("visible-pass", 5.72, 0.032);
        var SEQ_SS = [{ t: 6.16, s: " / " }];
        var SEQ_SF = typeSeq("hidden-fail", 6.24, 0.03);

        var label = $("f03-label"),
          subP = $("f03-sub-p"),
          subS = $("f03-sub-s"),
          subF = $("f03-sub-f"),
          caret = $("f03-caret"),
          num = $("f03-num");

        /* one linear driver carries every discrete state */
        var drv = { t: 0 };
        tl.to(
          drv,
          {
            t: D,
            duration: D,
            ease: "none",
            onUpdate: function () {
              var t = drv.t;
              label.textContent = textAt(SEQ_LA, t);
              subP.textContent = textAt(SEQ_SP, t);
              subS.textContent = textAt(SEQ_SS, t);
              subF.textContent = textAt(SEQ_SF, t);
              caret.style.opacity = t >= 5.64 && Math.sin((t / 0.55) * Math.PI * 2) > 0 ? "1" : "0";
            },
          },
          0
        );

        /* ── Scene 1 (0.0–2.0): chrome seats, wall populates, label types ── */
        tl.fromTo("#f03-chrome-top", { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.32, ease: "power3.out" }, 0);
        tl.fromTo("#f03-chrome-bot", { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.32, ease: "power3.out" }, 0.06);
        tl.fromTo(
          ticks,
          { opacity: 0, scaleY: 0.2 },
          { opacity: 0.5, scaleY: 1, duration: 0.14, ease: "power2.out", stagger: 0.0008 },
          0.28
        );

        /* slow camera push begins as the wrongness starts */
        tl.fromTo("#f03-cam", { scale: 1 }, { scale: 1.05, duration: 2.9, ease: "sine.inOut" }, 1.6);

        /* ── Scene 2 (2.0–4.5): exactly 31 ticks flip amber; report still reads green ── */
        tl.fromTo("#f03-report", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.32, ease: "power3.out" }, 2.35);
        for (var b = 0; b < bads.length; b++) {
          var at = 2.12 + b * 0.058;
          tl.fromTo(
            bads[b],
            { backgroundColor: GREEN },
            { backgroundColor: AMBER, opacity: 1, duration: 0.3, ease: "power2.out" },
            at
          );
          tl.fromTo(
            bads[b],
            { scaleX: 1, scaleY: 1 },
            { scaleX: 1.8, scaleY: 1.4, duration: 0.36, ease: "back.out(2.2)" },
            at
          );
        }

        /* ── Scene 3 (4.5–7.0): push THROUGH — wall implodes, 31 count-up lands ── */
        tl.fromTo("#f03-cam", { scale: 1.05 }, { scale: 1.45, duration: 0.68, ease: "power3.in" }, 4.5);
        tl.fromTo(
          field,
          { scale: 1, opacity: 1 },
          { scale: 0.13, opacity: 0, duration: 0.64, ease: "power3.in" },
          4.52
        );
        tl.fromTo(label, { opacity: 1, y: 0 }, { opacity: 0, y: -12, duration: 0.3, ease: "power2.in" }, 4.5);

        tl.fromTo(num, { opacity: 0 }, { opacity: 1, duration: 0.28, ease: "power1.out" }, 4.8);
        tl.fromTo(num, { scale: 0.58 }, { scale: 1, duration: 0.92, ease: "power3.out" }, 4.8);
        var cnt = { v: 0 };
        tl.fromTo(
          cnt,
          { v: 0 },
          {
            v: 31,
            duration: 0.74,
            ease: "power1.inOut",
            onUpdate: function () {
              num.textContent = String(Math.round(cnt.v));
            },
          },
          4.84
        );
        tl.fromTo("#f03-halo", { opacity: 0 }, { opacity: 1, duration: 1.1, ease: "sine.out" }, 5.0);
        tl.fromTo("#f03-per", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 5.55);
        tl.fromTo("#f03-sub", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 5.6);

        tl.fromTo("#f03-stub", { scaleX: 0 }, { scaleX: 1, duration: 0.42, ease: "power3.out" }, 7.02);

          7.05
        );
      })();
