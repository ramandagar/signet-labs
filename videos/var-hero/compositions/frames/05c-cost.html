    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var D = 9.6;
        var AMBER = "#fab219";

        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["05c-cost"] = tl;

        var $ = function (id) {
          return document.getElementById(id);
        };
        var val = $("f05c-val"),
          counter = $("f05c-counter"),
          fill = $("f05c-fill"),
          line = $("f05c-line"),
          dots = document.querySelectorAll(".f05c-dot");

        /* sparkline path — measured, never guessed */
        var lineLen = line.getTotalLength() * 1.02;
        line.style.strokeDasharray = String(lineLen);
        line.style.strokeDashoffset = String(lineLen);

        /* one live proxy drives numeral + chrome counter — pure function of t */
        var pct = { v: 62 };
        function paint() {
          var n = Math.round(pct.v);
          val.textContent = String(n);
          counter.textContent = "budget " + n + "%";
          counter.style.color = n >= 100 ? AMBER : "#ffffff";
        }

        /* ── Scene 1 (0.0–2.5): chrome seats, gauge fills to 62, count 62→79 on "enforced" ── */
        tl.fromTo("#f05c-chrome-top", { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.32, ease: "power3.out" }, 0);
        tl.fromTo("#f05c-chrome-bot", { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.32, ease: "power3.out" }, 0.06);
        tl.fromTo("#f05c-ghost", { opacity: 0 }, { opacity: 0.05, duration: 0.6, ease: "power1.out" }, 0.1);
        tl.fromTo("#f05c-count", { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.42, ease: "power3.out" }, 0.08);
        tl.fromTo("#f05c-eyebrow", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.32, ease: "power3.out" }, 0.18);
        tl.fromTo("#f05c-pct", { opacity: 0 }, { opacity: 0.9, duration: 0.4, ease: "power1.out" }, 0.3);

        tl.fromTo("#f05c-rail", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.1);
        tl.fromTo(
          ".f05c-tick, .f05c-tlab, .f05c-tsub",
          { opacity: 0 },
          { opacity: 1, duration: 0.3, ease: "power1.out", stagger: 0.06 },
          0.24
        );
        tl.fromTo(fill, { scaleX: 0 }, { scaleX: 0.62, duration: 0.65, ease: "power3.out" }, 0.1);

        /* count-up with dynamic scale — value + transform share ease and position */
        tl.to(pct, { v: 79, duration: 1.3, ease: "power3.out", onUpdate: paint }, 0.75);
        tl.fromTo(val, { scale: 0.72 }, { scale: 1, duration: 1.3, ease: "power3.out" }, 0.75);
        tl.to(fill, { scaleX: 0.79, duration: 1.3, ease: "power3.out" }, 0.75);

        tl.fromTo("#f05c-route", { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 1.35);

        /* ── Scene 2 (2.5–5.0): gauge passes 80%, chip badge-flips flagship→fast, sparkline ticks ── */
        tl.to(pct, { v: 84, duration: 0.8, ease: "power1.inOut", onUpdate: paint }, 2.7);
        tl.to(fill, { scaleX: 0.84, duration: 0.8, ease: "power1.inOut" }, 2.7);

        tl.to("#f05c-chip-a", { scale: 0.55, opacity: 0, duration: 0.22, ease: "power2.in" }, 2.95);
        tl.fromTo(
          "#f05c-chip-b",
          { scale: 0.55, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.38, ease: "back.out(1.7)" },
          3.07
        );

        tl.fromTo("#f05c-spark-label", { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 2.7);
        tl.fromTo(line, { strokeDashoffset: lineLen }, { strokeDashoffset: 0, duration: 2.0, ease: "power1.inOut" }, 2.85);
        tl.fromTo(
          dots,
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.32, ease: "back.out(2.2)", stagger: 0.34 },
          3.0
        );

        /* ── Scene 3 (5.0–8.0): run to the line, amber HALT, stop card slides up; hold ── */
        tl.to(pct, { v: 100, duration: 0.95, ease: "power2.in", onUpdate: paint }, 5.35);
        tl.to(fill, { scaleX: 1, duration: 0.95, ease: "power2.in" }, 5.35);

        tl.to(fill, { backgroundColor: AMBER, duration: 0.25, ease: "power1.out" }, 6.3);
        tl.to("#f05c-tlimit", { backgroundColor: AMBER, duration: 0.25, ease: "power1.out" }, 6.3);
        tl.to("#f05c-llimit", { color: AMBER, duration: 0.25, ease: "power1.out" }, 6.3);
        tl.to(val, { color: AMBER, duration: 0.35, ease: "power1.out" }, 6.32);
        tl.to("#f05c-ghost", { opacity: 0.09, y: -10, duration: 0.7, ease: "power2.out" }, 6.4);

        tl.fromTo("#f05c-card", { y: 84, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 6.38);
        tl.fromTo("#f05c-code", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 6.52);
        tl.fromTo("#f05c-stub", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, 6.62);
        tl.fromTo("#f05c-sub", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 6.64);
        tl.fromTo("#f05c-meta", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 6.78);

        /* slow continuous camera push — the through-line across the instruments */
        tl.fromTo(
          "#f05c-cam",
          { scale: 1, transformOrigin: "50% 42%" },
          { scale: 1.042, duration: D, ease: "none" },
          0
        );
      })();
