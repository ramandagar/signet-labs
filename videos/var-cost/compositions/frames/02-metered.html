<style>

  .m02-chrome {

  .ch { opacity: 0; }

  .m02-caret {

  /* ---- the machine's answer: three top-border-only meter chips ---- */
  .m02-chips {

</style>

<div
  id="root"
  data-composition-id="02-metered"
  data-start="0"
  data-duration="7.403"
  data-fps="30"
  data-width="1920"
  data-height="1080"
>
  <div class="clip m02-bg" data-start="0" data-duration="7.403" data-track-index="0"></div>

  <div class="clip m02-scene" data-start="0" data-duration="7.403" data-track-index="1">
    <div class="m02-camera" id="m02-camera">
      <div class="m02-chrome">
        <div class="m02-chrome-label">usage.dict</div>
        <div class="m02-chrome-label">no. 02</div>
      </div>
      <div class="m02-chrome-line" id="m02-chrome-line"></div>

      <div class="m02-well" id="m02-well">
        <div class="m02-wellhead">
          <div class="m02-welltitle">session/usage</div>
          <div class="m02-sqrow">
            <div class="m02-sq"></div>
            <div class="m02-sq"></div>
            <div class="m02-sq m02-sq-accent"></div>
          </div>
        </div>
        <div class="m02-wellrule" id="m02-wellrule"></div>
        <div class="m02-code" id="m02-code"></div>
      </div>

      <div class="m02-chips">
        <div class="m02-chip" id="m02-chip-0">
          <div class="m02-chip-num">75500</div>
          <div class="m02-chip-label">TOKENS</div>
        </div>
        <div class="m02-chip" id="m02-chip-1">
          <div class="m02-chip-num">0.1854</div>
          <div class="m02-chip-label">USD</div>
        </div>
        <div class="m02-chip" id="m02-chip-2">
          <div class="m02-chip-num">0.012</div>
          <div class="m02-chip-label">WALL-CLOCK</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  (function () {
    var DUR = 7.403;

    /* ================= build the verbatim usage dict, char by char =================
       The well types `usage : {'tokens': 75500, 'usd': 0.1854, 'wall_clock_seconds':
       0.012} (15.1% of budget)` — segments colored per the semantic color law
       (accent blue on dict keys only; no green, no amber, no red).                    */
    var SEGMENTS = [
      { text: "usage",                  cls: "w" },
      { text: " : ",                    cls: "p" },
      { text: "{",                      cls: "p" },
      { text: "'tokens'",               cls: "k" },
      { text: ": ",                     cls: "p" },
      { text: "75500",                  cls: "v" },
      { text: ", ",                     cls: "p" },
      { text: "'usd'",                  cls: "k" },
      { text: ": ",                     cls: "p" },
      { text: "0.1854",                 cls: "v" },
      { text: ", ",                     cls: "p" },
      { text: "'wall_clock_seconds'",   cls: "k" },
      { text: ": ",                     cls: "p" },
      { text: "0.012",                  cls: "v" },
      { text: "} ",                     cls: "p" },
      { text: "(",                      cls: "p" },
      { text: "15.1%",                  cls: "w" },
      { text: " of budget",             cls: "p" },
      { text: ")",                      cls: "p" }
    ];

    var codeEl = document.getElementById("m02-code");
    var chars = [];       // char spans, document order
    var charTimes = [];   // appearance time per char (baked schedule)
    var charCls = [];     // segment class per char (drives cursor color)
    var changeTimes = []; // every typing event (for the seek-safe typing grace)

    // deterministic per-keystroke gap — no Math.random, pure of runtime state
    function hash01(i) {
      var s = Math.sin(i * 12.9898) * 43758.5453;
      return s - Math.floor(s);
    }

    var caret = document.createElement("span");
    caret.className = "m02-caret";
    caret.id = "m02-caret";

    var TYPE_START = 0.4;
    var t = TYPE_START;
    for (var s = 0; s < SEGMENTS.length; s++) {
      var seg = document.createElement("span");
      seg.className = "seg-" + SEGMENTS[s].cls;
      if (SEGMENTS[s].text === "15.1%") seg.id = "m02-budget";
      for (var c = 0; c < SEGMENTS[s].text.length; c++) {
        var chEl = document.createElement("span");
        chEl.className = "ch";
        chEl.textContent = SEGMENTS[s].text.charAt(c);
        seg.appendChild(chEl);
        t += 0.03 + 0.02 * hash01(chars.length);            // keystroke spacing
        if (c === 0 && SEGMENTS[s].cls === "k") t += 0.09;  // pause before each key
        chars.push(chEl);
        charTimes.push(t);
        charCls.push(SEGMENTS[s].cls);
        changeTimes.push(t);
      }
      codeEl.appendChild(seg);
    }
    chars[0].parentNode.insertBefore(caret, chars[0]);
    changeTimes.push(TYPE_START); // caret appears at typing start

    var CURSOR_COLORS = { k: "#3987E5", w: "#3987E5", v: "#FFFFFF", p: "#AFB3B7" };
    var TYPING_GRACE = 0.2;   // < smallest inter-keystroke dwell pattern … solid while typing
    var BLINK_CYCLES = 10;    // whole number over DUR — period 0.7403s
    var PERIOD = DUR / BLINK_CYCLES;

    /* ================= one paused timeline, registered ================= */
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    // full-span anchor
    tl.to({}, { duration: DUR }, 0);

    /* ---- THE ENGINE: typing writer — pure function of driver.t (seek-safe).
       Discrete jumps, no transitions; block caret rides the text flow, its
       color follows the segment (context-sensitive cursor); blink is a
       deterministic sin square wave, solid under the baked typing grace.     */
    var driver = { t: 0 };
    tl.to(
      driver,
      {
        t: DUR,
        duration: DUR,
        ease: "none",
        onUpdate: function () {
          var time = driver.t;
          var idx = 0;
          while (idx < charTimes.length && time >= charTimes[idx]) idx++;
          for (var i = 0; i < chars.length; i++) {
            if (i < idx) { chars[i].classList.add("on"); } else { chars[i].classList.remove("on"); }
          }
          // caret at the reveal frontier
          if (idx < chars.length) { chars[idx].parentNode.insertBefore(caret, chars[idx]); } else { codeEl.appendChild(caret); }
          caret.style.background = CURSOR_COLORS[idx > 0 ? charCls[idx - 1] : charCls[0]];
          // typing grace (baked times — reverse-seek identical) + sin blink
          var typing = false;
          for (var j = 0; j < changeTimes.length; j++) {
            var ct = changeTimes[j];
            if (ct <= time && time - ct < TYPING_GRACE) { typing = true; break; }
          }
          var blinkOn = Math.sin((time / PERIOD) * Math.PI * 2) > 0;
          caret.style.opacity = typing || blinkOn ? "1" : "0";
        },
      },
      0
    );

    /* ---- CAMERA: one slow continuous push-in, decelerating to a near-hold,
       plus sine micro-drift — a single writer of camera.style.transform. ---- */
    var camera = document.getElementById("m02-camera");
    var phase = { scale: 1.0 };
    tl.to(phase, { scale: 1.02, duration: 1.8, ease: "power2.out" }, 0.3);
    tl.to(phase, { scale: 1.055, duration: 4.6, ease: "power2.out" }, 2.4);
    var drift = { p: 0 };
    tl.to(
      drift,
      {
        p: Math.PI * 2,
        duration: DUR,
        ease: "none",
        onUpdate: function () {
          var dx = Math.sin(drift.p) * 5;
          var dy = Math.sin(drift.p * 1.3) * 3;
          camera.style.transform = "scale(" + phase.scale + ") translate(" + dx + "px, " + dy + "px)";
        },
      },
      0
    );

    /* ---- Scene 1 — the input takes focus: chrome draws, the well springs in.
       Hero (the well + caret) is on screen by ~0.4s. ---- */
    tl.fromTo("#m02-chrome-line", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 0.05);
    tl.fromTo(
      ".m02-chrome-label",
      { opacity: 0, y: -10 },
      { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.06 },
      0.15
    );
    tl.fromTo(
      "#m02-well",
      { opacity: 0, y: 22, scale: 0.985 },
      { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" },
      0
    );
    tl.fromTo("#m02-wellrule", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 0.22);

    /* ---- Scene 2 — the dict types (the engine), 0.4s to ~4.4s, paced on the
       voice: tokens → dollars → wall-clock keys echo the narration, the
       `(15.1% of budget)` tail lands across "every call metered / per session". ---- */

    /* ---- Scene 4 — the answer arrives: the meter readout springs in on
       "Nothing estimated, nothing" — exact values, nothing rounded. ---- */
    tl.fromTo(
      "#m02-budget",
      { opacity: 0.5 },
      { opacity: 1, duration: 0.6, ease: "power2.out" },
      4.8
    );
    for (var k = 0; k < 3; k++) {
      tl.fromTo(
        "#m02-chip-" + k,
        { scale: 0, opacity: 0, y: 26 },
        { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        4.95 + k * 0.4
      );
    }

    /* ---- Scene 5 — resolve: HOLD on the completed output; the blinking
       caret + camera drift are the only residual motion. No exit. ---- */

    window.__timelines["02-metered"] = tl;
  })();
</script>
