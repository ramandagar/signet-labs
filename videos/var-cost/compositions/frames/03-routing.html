    // — held spread · phase-opposed idle (left sin t, right −sin t — never synchronized) —

    var floatL = document.getElementById("fr03-float-l");
    var floatR = document.getElementById("fr03-float-r");
    var glowL = document.getElementById("fr03-glow-l");
    var glowR = document.getElementById("fr03-glow-r");
    var TWO_PI = Math.PI * 2;

    var IDLE_START = 2.55;

        duration: IDLE_DUR,
        ease: "none",
