      height: 100%;

    .enforced06-bg {
      position: absolute;
      inset: 0;
      background: #1A1A19;
    }

    /* content stage — hard stop above the caption band (bottom 184px keep-out) */
    .enforced06-stage {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      bottom: 184px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* broadside statement: massive lowercase Barlow 900, negative-tracked, dead-center */
    .enforced06-statement {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.4cqw;
      font-family: "Barlow", sans-serif;
      font-weight: 900;

      align-items: baseline;
      justify-content: center;
      gap: 0.26em;

    .enforced06-line1 { font-size: 8.4cqw; color: #FFFFFF; }
    .enforced06-line2 { font-size: 6.2cqw; color: #AFB3B7; }

    .enforced06-word { display: inline-block; }

    .enforced06-struck { position: relative; }

    /* thin blue strikethrough — positioned with top/margin only (no CSS transform:
       GSAP animates scaleX on it); lone accent of the frame */
    .enforced06-strike {
      position: absolute;
      left: -0.05em;
      right: -0.05em;
      top: 50%;
      height: 0.055em;

      <div class="enforced06-statement">
        <div class="enforced06-line enforced06-line1">
          <span class="enforced06-word enforced06-w1">budgets</span>
          <span class="enforced06-word enforced06-w2">enforced</span>
        </div>
        <div class="enforced06-line enforced06-line2">

  <script>
    window.__timelines = window.__timelines || {};
    (function () {
      var tl = gsap.timeline({ paused: true });

      // "budgets enforced — not suggested." builds word-by-word dead-center on the
      // voiceover: per-word staggered fade/blur + spring-scale pop (kinetic-type-beats).
      // Cues track the VO: budgets ~0.0s, enforced ~0.35s, dash beat ~0.9s,
      // not ~1.1s, suggested ~1.2s.
      var words = [
        { sel: ".enforced06-w1", at: 0.06, y: 28, s: 0.94, d: 0.34, ease: "back.out(1.6)" },
        { sel: ".enforced06-w2", at: 0.44, y: 34, s: 0.90, d: 0.36, ease: "back.out(1.8)" },
        { sel: ".enforced06-w3", at: 0.92, y: 24, s: 0.94, d: 0.30, ease: "back.out(1.5)" },
        { sel: ".enforced06-w4", at: 1.10, y: 24, s: 0.94, d: 0.30, ease: "back.out(1.5)" },
        { sel: ".enforced06-w5", at: 1.30, y: 28, s: 0.94, d: 0.34, ease: "back.out(1.6)" }
      ];
      words.forEach(function (w) {
        tl.fromTo(w.sel,
          { opacity: 0, y: w.y, scale: w.s, filter: "blur(8px)" },
          { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: w.d, ease: w.ease },
          w.at);
      });

      // thin blue strike draws left-to-right through "suggested" after it lands;
      // then the frame holds completely still to the end (deliberate stillness tail)
      tl.fromTo(".enforced06-strike",
        { scaleX: 0, transformOrigin: "left center" },
        { scaleX: 1, duration: 0.5, ease: "power2.inOut" },
        1.84);

      // full-span anchor so the sub-comp timeline spans the whole frame window
      tl.to({}, { duration: 2.347 }, 0);

      window.__timelines["06-enforced"] = tl;
    })();
  </script>
