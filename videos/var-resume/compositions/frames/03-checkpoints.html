  <div id="root" data-composition-id="03-checkpoints" data-width="1920" data-height="1080" data-duration="9.003">
    <!-- track 0: full-bleed ground -->
    <div class="clip f03-bg" data-start="0" data-duration="9.003" data-track-index="0"></div>

    <!-- track 1: top chrome -->
    <div class="clip f03-chrome" data-start="0" data-duration="9.003" data-track-index="1">
      <div class="f03-topline"></div>
      <div class="f03-tlab f03-tl-l">var resume — run ledger</div>
      <div class="f03-tlab f03-tl-r">no. 03</div>
    </div>

    <!-- track 2: stage -->
    <div class="clip f03-stage" data-start="0" data-duration="9.003" data-track-index="2">
      <div class="f03-cam">
        <div class="f03-kickrow">
          <div class="f03-kickrule"></div>
          <div class="f03-kicktext">what was saved</div>
        </div>

        <div class="f03-list">
          <div class="f03-rowline" style="top: 0px;"></div>
          <div class="f03-row" style="top: 1px;">
            <span class="f03-chip"><span class="f03-chiptxt">#A41C</span></span>
            <span class="f03-name">messages</span>
          </div>
          <div class="f03-rowline" style="top: 128px;"></div>
          <div class="f03-row" style="top: 129px;">
            <span class="f03-chip"><span class="f03-chiptxt">#7F03</span></span>
            <span class="f03-name">tool results</span>
            <span class="f03-val"><span class="f03-mul">×</span>7</span>
          </div>
          <div class="f03-rowline" style="top: 256px;"></div>
          <div class="f03-row" style="top: 257px;">
            <span class="f03-chip"><span class="f03-chiptxt">#B9E2</span></span>
            <span class="f03-name">approvals</span>

          <div class="f03-rowline" style="top: 384px;"></div>
          <div class="f03-row" style="top: 385px;">
            <span class="f03-chip"><span class="f03-chiptxt">#0D55</span></span>
            <span class="f03-name">meter</span>
            <span class="f03-val f03-vmeter">$0.1854</span>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var scope = document.querySelector('div[data-composition-id="03-checkpoints"]') || document;
      function all(s) {
        return scope.querySelectorAll(s);
      }

      var tl = gsap.timeline({ paused: true });
      var DUR = 9.003;

      /* ---- open (0-0.6s): chrome + kicker establish the empty ledger ---- */
      tl.fromTo(all(".f03-topline"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 0.02);
      tl.fromTo(all(".f03-tlab"), { opacity: 0, y: -6 }, { opacity: 1, y: 0, duration: 0.4, ease: "power1.out" }, 0.1);
      tl.fromTo(all(".f03-kickrule"), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power2.out" }, 0.1);
      tl.fromTo(all(".f03-kicktext"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.18);

      /* ---- Scene 1 (0-6.0s): four rows land one per spoken cue;
         each hairline draws, the row slides into its ledger slot,
         the blue hash chip pops and its hash types ---- */
      var lines = all(".f03-rowline");
      var rows = all(".f03-row");
      var chips = all(".f03-chip");
      var chipTxts = all(".f03-chiptxt");
      var names = all(".f03-name");
      var cues = [0.32, 2.3, 3.5, 4.55]; /* messages / tool results / approvals / the meter */

      for (var i = 0; i < 4; i++) {
        tl.fromTo(lines[i], { scaleX: 0 }, { scaleX: 1, duration: 0.42, ease: "power2.out" }, cues[i]);
        tl.fromTo(rows[i], { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, cues[i] + 0.06);
        tl.fromTo(names[i], { clipPath: "inset(-12% 100% -12% -2%)" }, { clipPath: "inset(-12% -2% -12% -2%)", duration: 0.45, ease: "power2.out" }, cues[i] + 0.1);
        tl.fromTo(chips[i], { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.34, ease: "back.out(1.7)", transformOrigin: "0% 50%" }, cues[i] + 0.14);
        tl.fromTo(chipTxts[i], { clipPath: "inset(-20% 100% -20% -2%)" }, { clipPath: "inset(-20% -2% -20% -2%)", duration: 0.26, ease: "steps(5)" }, cues[i] + 0.22);
      }

      /* row 2 value — "x7" snaps in with a spring overshoot (accent marker) */
      tl.fromTo(
        all(".f03-val:not(.f03-vmeter)"),
        { opacity: 0, scale: 0.72 },
        { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.8)", transformOrigin: "100% 50%" },
        cues[1] + 0.42
      );

      /* row 4 value — "$0.1854" snap-build types with a split-second partial state */
      tl.fromTo(
        all(".f03-vmeter"),
        { clipPath: "inset(-15% 100% -15% -2%)" },
        { clipPath: "inset(-15% -2% -15% -2%)", duration: 0.5, ease: "steps(8)" },
        cues[3] + 0.38
      );

      /* ---- Scene 2 (6.0-7.0s): footer chip types under the rows ---- */
      tl.fromTo(all(".f03-foot"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 5.98);
      tl.fromTo(
        all(".f03-footxt"),
        { clipPath: "inset(-20% 100% -20% -2%)" },
        { clipPath: "inset(-20% -2% -20% -2%)", duration: 0.86, ease: "steps(28)" },
        6.08
      );

      /* ---- settle (7.0-7.8s): one commit blip travels down the hash chips,
         the footer chip pops once — then the ledger holds ---- */
      for (var j = 0; j < 4; j++) {
        var t = 7.14 + j * 0.085;
        tl.to(chips[j], { y: -5, duration: 0.12, ease: "power2.out" }, t);
        tl.to(chips[j], { y: 0, duration: 0.24, ease: "power2.inOut" }, t + 0.12);
      }
      tl.to(all(".f03-foot"), { scale: 1.03, duration: 0.12, ease: "power2.out", transformOrigin: "0% 50%" }, 7.05);
      tl.to(all(".f03-foot"), { scale: 1, duration: 0.26, ease: "power2.inOut" }, 7.17);

      /* camera modifier — one slow push-in under the whole shot */
      tl.fromTo(all(".f03-cam"), { scale: 1 }, { scale: 1.03, duration: DUR, ease: "none", transformOrigin: "50% 42%" }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines["03-checkpoints"] = tl;
      tl.seek(0);
    })();
  </script>
