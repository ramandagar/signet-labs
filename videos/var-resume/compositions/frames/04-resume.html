  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var scope = document.querySelector('div[data-composition-id="04-resume"]') || document;
      function all(s) {
        return scope.querySelectorAll(s);
      }
      function q(s) {
        return scope.querySelector(s);
      }

      var tl = gsap.timeline({ paused: true });
      var DUR = 6.208;

      /* ---- open (0-0.9s): chrome + the display-scale counter assemble over the
         cut-in card; the card itself is already on screen (continuity from 02-death) ---- */
      tl.fromTo(all(".f04-topline"), { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power2.out" }, 0.02);
      tl.fromTo(all(".f04-tlab"), { opacity: 0, y: -6 }, { opacity: 1, y: 0, duration: 0.4, ease: "power1.out" }, 0.08);
      tl.fromTo(all(".f04-stattop"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 0.2);
      tl.fromTo(all(".f04-statlabel"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.3);
      tl.fromTo(all(".f04-n6"), { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.34);
      tl.fromTo(all(".f04-den"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.55);

      /* ---- Scene 1 (0.3-1.6s): the well types resume(s_f3c9…); the blue restore
         bar sweeps left-to-right under the card once; the card's shell re-lights ---- */
      var caret = q(".f04-caret");
      var chars = all(".f04-ch");
      var N = chars.length; /* 15 chars */
      var T0 = 0.35;
      var DT = 0.066;
      tl.fromTo(caret, { opacity: 0, x: (-0.6 * N) + "em" }, { opacity: 1, x: (-0.6 * N) + "em", duration: 0.05, ease: "none" }, 0.3);
      for (var c = 1; c <= N; c++) {
        var tt = T0 + (c - 1) * DT;
        tl.fromTo(chars[c - 1], { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, tt);
        tl.to(caret, { x: (-0.6 * (N - c)) + "em", duration: 0.001, ease: "none" }, tt);
      }
      tl.fromTo(q(".f04-restorebar"), { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.inOut", transformOrigin: "0% 50%" }, 0.92);
      tl.fromTo(q(".f04-chip"), { opacity: 0.6 }, { opacity: 1, duration: 0.5, ease: "power1.inOut" }, 0.95);
      tl.fromTo(q(".f04-meterfill"), { backgroundColor: "#5f6468" }, { backgroundColor: "#3987e5", duration: 0.5, ease: "power2.inOut" }, 0.95);

      /* caret blinks (finite, discrete) while the machine replays */
      for (var k = 0, bt = 1.9; bt < 4.85; k++, bt += 0.4) {
        tl.to(caret, { opacity: k % 2 === 0 ? 0 : 1, duration: 0.001, ease: "none" }, bt);
      }

      /* ---- Scene 2 (1.9-4.6s): the six dead ticks re-arm, one per 0.5s beat;
         the well log echoes each restore ---- */
      var dead = all(".f04-tick.f04-dead");
      var logs = all(".f04-logline");
      var T = [1.9, 2.4, 2.9, 3.4, 3.9, 4.4];
      for (var i = 0; i < 6; i++) {
        tl.fromTo(dead[i], { backgroundColor: "#6b7075" }, { backgroundColor: "#3987e5", duration: 0.2, ease: "power1.inOut" }, T[i]);
        tl.to(dead[i], { y: -4, duration: 0.08, ease: "power2.out" }, T[i]);
        tl.to(dead[i], { y: 0, duration: 0.22, ease: "power2.inOut" }, T[i] + 0.08);
        tl.fromTo(logs[i], { opacity: 0, y: 7 }, { opacity: 0.85, y: 0, duration: 0.26, ease: "power2.out" }, T[i] + 0.05);
      }

      /* ---- Scene 3 (4.8-6.2s): the 7th tick (the half tick) completes; both counters
         snap to step 7 / 9 in the same beat; then a true hold ---- */
      var half = q(".f04-halffill");
      tl.fromTo(half, { scaleX: 0.55 }, { scaleX: 1, duration: 0.2, ease: "power3.inOut", transformOrigin: "0% 50%" }, 4.82);
      tl.fromTo(half, { backgroundColor: "#6b7075" }, { backgroundColor: "#3987e5", duration: 0.2, ease: "power1.inOut" }, 4.82);

      tl.to(caret, { opacity: 0, duration: 0.001, ease: "none" }, 4.9);

      tl.to(q(".f04-s6"), { opacity: 0, duration: 0.06, ease: "none" }, 4.88);
      tl.fromTo(q(".f04-s7"), { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, 4.88);
      tl.to(q(".f04-stepwrap"), { scale: 1.12, duration: 0.1, ease: "power2.out", transformOrigin: "0% 50%" }, 4.88);
      tl.to(q(".f04-stepwrap"), { scale: 1, duration: 0.24, ease: "power2.inOut" }, 4.98);

      tl.to(q(".f04-n6"), { opacity: 0, duration: 0.001, ease: "none" }, 4.9);
      tl.fromTo(q(".f04-n7"), { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(1.9)", transformOrigin: "45% 70%" }, 4.9);
      tl.fromTo(q(".f04-statrule"), { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out", transformOrigin: "0% 50%" }, 4.96);

      /* camera modifier — one slow push-in under the whole shot */
      tl.fromTo(all(".f04-cam"), { scale: 1 }, { scale: 1.03, duration: DUR, ease: "none", transformOrigin: "50% 42%" }, 0);

      /* true stillness: nothing tweens from ~5.4s to the end of the slot */
      tl.to({}, { duration: 0.018, ease: "none" }, 6.19);

      window.__timelines = window.__timelines || {};
      window.__timelines["04-resume"] = tl;
      tl.seek(0);
    })();
  </script>
