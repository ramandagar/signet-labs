  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });

      /* bursty keystroke schedule — char c appears at 1.50 + T[c] (discrete-text-sequence) */
      var FULL_LEN = 45;
      var TS = [0.05, 0.11, 0.16, 0.22, 0.27, 0.33, 0.44, 0.5, 0.58, 0.72, 0.78, 0.84];
      var CUTS = [4, 9, 10, 17, 18, 25, 26, 30, 34, 41, 42, 45];
      var chars = gsap.utils.toArray(".f02-death-ch");

      /* ---- Scene 1 (0.0–1.4s): the X stamps; the rail desaturates ---- */
      tl.fromTo(
        "#f02-death-stamp",
        { opacity: 0, scale: 2.6, rotation: -8 },
        { opacity: 0.97, scale: 1, rotation: -8, duration: 0.32, ease: "power4.in" },
        0.1
      );
      tl.to("#f02-death-stamp", { scale: 1.05, duration: 0.07, ease: "power2.out" }, 0.42);
      tl.to("#f02-death-stamp", { scale: 1, duration: 0.09, ease: "power2.in" }, 0.49);
      /* card takes the impact */
      tl.to("#f02-death-card", { x: 3, duration: 0.05, ease: "none" }, 0.42)
        .to("#f02-death-card", { x: -2, duration: 0.05, ease: "none" }, 0.47)
        .to("#f02-death-card", { x: 0, duration: 0.06, ease: "none" }, 0.52);
      /* the working accent drains to ink/muted */
      tl.to(
        ".f02-death-lit",
        { backgroundColor: "#6b7075", duration: 0.42, ease: "power2.inOut", stagger: 0.055 },
        0.58
      );
      tl.to("#f02-death-halffill", { backgroundColor: "#6b7075", duration: 0.42, ease: "power2.inOut" }, 0.82);
      tl.to("#f02-death-meterfill", { backgroundColor: "#5f6468", duration: 0.45, ease: "power2.inOut" }, 0.78);
      tl.to("#f02-death-chip", { opacity: 0.6, duration: 0.4, ease: "power1.inOut" }, 0.8);

      /* ---- Scene 2 (1.4–2.8s): the crash line types; `exit 1` prints ---- */
      /* caret starts at the line front (hidden chars keep their width, so it rides a negative x) */
      tl.fromTo(
        "#f02-death-caret",
        { opacity: 0, x: (-0.61 * FULL_LEN) + "em" },
        { opacity: 1, duration: 0.05, ease: "none" },
        1.48
      );
      for (var c = 1; c <= FULL_LEN; c++) {
        var tt = TS[0];
        for (var i = 0; i < CUTS.length; i++) {
          if (c <= CUTS[i]) { tt = TS[i]; break; }
        }
        tl.fromTo(chars[c - 1], { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, 1.5 + tt);
        tl.to("#f02-death-caret", { x: (-0.61 * (FULL_LEN - c)) + "em", duration: 0.001, ease: "none" }, 1.5 + tt);
      }
      tl.fromTo(
        "#f02-death-exit",
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.2, ease: "power2.out" },
        2.58
      );
      tl.to("#f02-death-caret", { opacity: 0, duration: 0.1, ease: "none" }, 2.58);

      /* ---- Scene 3 (2.8s–end): the cost sits muted beside the card; then ONE still beat ---- */
      tl.fromTo("#f02-death-w1", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 2.98);

      window.__timelines["02-death"] = tl;
