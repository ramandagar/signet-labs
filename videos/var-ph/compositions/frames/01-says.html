  <script>
    (function () {
      var DUR = 5.163;
      var DIM = "#9aa1a8";

      var $ = function (id) {
        return document.getElementById(id);
      };

      /* measured slot step — one label's rendered line box (descender-safe) */
      var roles = [$("f01-role0"), $("f01-role1"), $("f01-role2")];
      var H = roles[0].getBoundingClientRect().height;

      var tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["01-says"] = tl;

      /* ── discrete-text-sequence: hard-cut claim tail at VO cues (seek-safe driver) ── */
      var SEQ = [
        { t: 0.0, tok: -1, chk: false },
        { t: 1.02, tok: 0, chk: true }, // "tests passed"
        { t: 1.86, tok: 1, chk: true }, // "payments sent"
        { t: 2.66, tok: 2, chk: true }, // "shipped"
        { t: 3.22, tok: -1, chk: false }, // line collapses
      ];
      var toks = [$("f01-tok0"), $("f01-tok1"), $("f01-tok2")];
      var chk = $("f01-chk");
      var stateAt = function (time) {
        for (var i = SEQ.length - 1; i >= 0; i--) if (time >= SEQ[i].t) return SEQ[i];
        return SEQ[0];
      };
      var drv = { t: 0 };
      tl.to(
        drv,
        {
          t: DUR,
          duration: DUR,
          ease: "none",
          onUpdate: function () {
            var s = stateAt(drv.t);
            for (var i = 0; i < toks.length; i++)
              toks[i].style.opacity = i === s.tok ? "1" : "0";
            chk.style.opacity = s.chk && s.tok >= 0 ? "1" : "0";
          },
        },
        0
      );

      /* macro camera — the watermark breathes under the whole shot */
      tl.fromTo(
        "#f01-ghostcam",
        { scale: 1.03 },
        { scale: 1.09, duration: DUR, ease: "none", transformOrigin: "50% 50%" },
        0
      );

      /* ── Scene 1 (0.0–1.0): ghost seats, "your" + glass pill enter word-by-word ── */
      tl.fromTo("#f01-ghost", { opacity: 0 }, { opacity: 0.06, duration: 0.7, ease: "power1.out" }, 0.06);
      tl.fromTo(
        "#f01-your",
        { opacity: 0, y: 30, filter: "blur(14px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power2.out" },
        0.1
      );
      tl.fromTo(
        "#f01-pill",
        { opacity: 0, scale: 0.9, filter: "blur(10px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.55, ease: "power3.out" },
        0.34
      );
      /* one glass sheen pass */
      tl.fromTo(
        "#f01-sheen",
        { xPercent: 0 },
        { xPercent: 480, duration: 0.6, ease: "power1.inOut" },
        0.82
      );

      /* ── Scene 2 (1.0–3.2): the rotating slot — active brightens, others dim ── */
      tl.fromTo("#f01-stack", { y: 0 }, { y: -H, duration: 0.36, ease: "power2.inOut" }, 1.8);
      tl.to(roles[0], { opacity: 0.1, color: DIM, duration: 0.3, ease: "power2.out" }, 1.8);
      tl.fromTo(
        roles[1],
        { opacity: 0.1, color: DIM },
        { opacity: 1, color: "#ffffff", duration: 0.3, ease: "power2.out" },
        1.8
      );

      tl.fromTo(
        "#f01-stack",
        { y: -H },
        { y: -2 * H, duration: 0.36, ease: "power2.inOut", immediateRender: false },
        2.6
      );
      tl.to(roles[1], { opacity: 0.1, color: DIM, duration: 0.3, ease: "power2.out" }, 2.6);
      tl.fromTo(
        roles[2],
        { opacity: 0.1, color: DIM },
        { opacity: 1, color: "#ffffff", duration: 0.3, ease: "power2.out" },
        2.6
      );

      /* ✓ punctuation pops — the swap itself is the instant driver cut */
      [1.06, 1.9, 2.7].forEach(function (t) {
        tl.fromTo(
          "#f01-g",
          { scale: 0 },
          { scale: 1, duration: 0.28, ease: "back.out(2.4)" },
          t
        );
      });

      /* ── Scene 3 (3.2–5.163): collapse, SAYS. slams amber over the ghost, holds ── */
      tl.to(
        "#f01-cluster",
        { opacity: 0, scale: 0.93, filter: "blur(9px)", duration: 0.22, ease: "power2.in" },
        3.22
      );
      tl.to("#f01-ghost", { opacity: 0.11, duration: 0.8, ease: "power1.out" }, 3.5);
      tl.fromTo(
        "#f01-says",
        { opacity: 0, scale: 1.5, filter: "blur(10px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.38, ease: "power3.out" },
        3.3
      );
      /* final-token punctuation snap — the period lands a beat late */
      tl.fromTo(
        "#f01-dot",
        { opacity: 0, scale: 0 },
        { opacity: 1, scale: 1, duration: 0.26, ease: "back.out(2.6)", transformOrigin: "30% 70%" },
        3.92
