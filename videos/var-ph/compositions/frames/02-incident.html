  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var D = 9.131;
      var RED = "#d03b3b";

      var tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["02-incident"] = tl;
      var $ = function (id) {
        return document.getElementById(id);
      };

      /* ── measured stroke setup ── */
      var rail = $("f02-rail");
      var railLen = rail.getTotalLength() * 1.02;
      rail.style.strokeDasharray = String(railLen);
      rail.style.strokeDashoffset = String(railLen);

      var ticks = [];
      document.querySelectorAll(".f02-tick").forEach(function (p) {
        var l = p.getTotalLength() * 1.02;
        p.style.strokeDasharray = String(l);
        p.style.strokeDashoffset = String(l);
        ticks.push({ el: p, len: l });
      });

      var bellPaths = [];
      document.querySelectorAll(".f02-bp").forEach(function (p) {
        var l = p.getTotalLength() * 1.02;
        p.style.strokeDasharray = String(l);
        p.style.strokeDashoffset = String(l);
        bellPaths.push({ el: p, len: l });
      });

      /* ── virtual camera: one writer, pan mode + organic drift ── */
      var world = $("f02-world");
      var cam = { x: 90, y: 0 };
      var ddx = 0,
        ddy = 0;
      function applyCam() {
        world.style.transform = "translate(" + (cam.x + ddx) + "px," + (cam.y + ddy) + "px)";
      }
      var drift = { p: 0 };
      tl.to(
        drift,
        {
          p: Math.PI * 2 * 1.15,
          duration: D,
          ease: "none",
          onUpdate: function () {
            ddx = Math.sin(drift.p) * 4;
            ddy = Math.sin(drift.p * 1.3) * 2.5;
            applyCam();
          },
        },
        0
      );
      applyCam(); // seed frame 0

      /* seated micro-pans — camera drifts left-to-right as cards light in sequence */
      tl.fromTo(cam, { x: 90 }, { x: 30, duration: 1.4, ease: "power2.inOut", onUpdate: applyCam, immediateRender: false }, 1.15);
      tl.fromTo(cam, { x: 30 }, { x: -45, duration: 1.3, ease: "power2.inOut", onUpdate: applyCam, immediateRender: false }, 3.25);
      tl.fromTo(cam, { x: -45 }, { x: -125, duration: 1.0, ease: "power2.inOut", onUpdate: applyCam, immediateRender: false }, 4.5);
      tl.fromTo(cam, { x: -125 }, { x: -150, duration: 1.2, ease: "power2.inOut", onUpdate: applyCam, immediateRender: false }, 6.8);
      /* impact jolt when the red card lands */
      tl.fromTo(cam, { y: 9 }, { y: 0, duration: 0.22, ease: "power2.out", onUpdate: applyCam, immediateRender: false }, 4.99);

      /* ── discrete text driver: card-4 typing + caret + counter ── */
      var L1 = [
        { t: 6.95, s: "4h" },
        { t: 7.04, s: "4h incident" },
        { t: 7.13, s: "4h incident · 3" },
        { t: 7.23, s: "4h incident · 3 engineers" },
      ];
      var L2 = [
        { t: 7.45, s: "cause" },
        { t: 7.53, s: "cause:" },
        { t: 7.62, s: "cause: stale" },
        { t: 7.74, s: "cause: stale test" },
        { t: 7.87, s: "cause: stale test ev" },
        { t: 8.02, s: "cause: stale test evidence" },
      ];
      function textAt(seq, t) {
        for (var i = seq.length - 1; i >= 0; i--) {
          if (t >= seq[i].t) return seq[i].s;
        }
        return "";
      }
      var l1 = $("f02-l1"),
        l2 = $("f02-l2"),
        caret = $("f02-caret"),
        counter = $("f02-counter");
      var drv = { t: 0 };
      tl.to(
        drv,
        {
          t: D,
          duration: D,
          ease: "none",
          onUpdate: function () {
            var t = drv.t;
            l1.textContent = textAt(L1, t);
            l2.textContent = textAt(L2, t);
            caret.style.opacity =
              t > 6.9 && t < 8.12 ? (Math.sin((t / 0.6) * Math.PI * 2) > 0 ? "1" : "0") : "0";
            if (t >= 6.9) {
              counter.textContent = "elapsed +4h";
              counter.style.color = RED;
            } else {
              counter.textContent = "elapsed 0h";
              counter.style.color = "#ffffff";
            }
          },
        },
        0
      );

      /* ── Scene 1 (0.0–2.2): ghost seats, rail draws, first card lands ── */
      tl.fromTo("#f02-chrome-top", { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.32, ease: "power3.out" }, 0.08);
      tl.fromTo("#f02-chrome-bot", { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.32, ease: "power3.out" }, 0.14);
      tl.fromTo("#f02-ghost", { opacity: 0, scale: 1.04 }, { opacity: 0.06, scale: 1, duration: 0.7, ease: "power2.out" }, 0.2);
      tl.fromTo(rail, { strokeDashoffset: railLen }, { strokeDashoffset: 0, duration: 1.25, ease: "power2.out" }, 0.5);

      tl.fromTo("#f02-c1", { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.85);
      tl.fromTo("#f02-stem1", { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: "power2.out" }, 0.9);
      tl.fromTo("#f02-node1", { scale: 0 }, { scale: 1, duration: 0.3, ease: "power3.out" }, 0.95);
      tl.fromTo(ticks[0].el, { strokeDashoffset: ticks[0].len }, { strokeDashoffset: 0, duration: 0.28, ease: "power2.out" }, 1.08);
      tl.fromTo("#f02-c1-sub", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 1.45);

      /* ── Scene 2 (2.2–4.4): agent claims green, confidence chip ── */
      tl.fromTo("#f02-c2", { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 2.55);
      tl.fromTo("#f02-stem2", { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: "power2.out" }, 2.6);
      tl.fromTo("#f02-node2", { scale: 0 }, { scale: 1, duration: 0.3, ease: "power3.out" }, 2.65);
      tl.fromTo(ticks[1].el, { strokeDashoffset: ticks[1].len }, { strokeDashoffset: 0, duration: 0.28, ease: "power2.out" }, 2.78);
      tl.fromTo("#f02-chip", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, 3.4);

      /* ── Scene 3 (4.4–6.6): rail desaturates, red card slams, pager pulses ×2 ── */
      tl.fromTo("#f02-railsvg", { opacity: 1 }, { opacity: 0.55, duration: 0.55, ease: "power2.out", immediateRender: false }, 4.45);
      tl.fromTo("#f02-c3", { scale: 1.26, opacity: 0, y: -16 }, { scale: 1, opacity: 1, y: 0, duration: 0.34, ease: "power4.out" }, 4.65);
      tl.fromTo("#f02-stem3", { scaleY: 0 }, { scaleY: 1, duration: 0.26, ease: "power2.out" }, 4.7);
      tl.fromTo("#f02-node3", { scale: 0 }, { scale: 1, duration: 0.3, ease: "power3.out" }, 4.72);
      tl.fromTo("#f02-ghost", { opacity: 0.06 }, { opacity: 0.09, duration: 0.3, ease: "power1.out", immediateRender: false }, 4.72);
      tl.fromTo(bellPaths[0].el, { strokeDashoffset: bellPaths[0].len }, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 4.78);
      tl.fromTo(bellPaths[1].el, { strokeDashoffset: bellPaths[1].len }, { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" }, 5.02);

      [5.3, 5.9].forEach(function (t0) {
        tl.fromTo("#f02-ring", { scale: 0.5, opacity: 0.55 }, { scale: 1.55, opacity: 0, duration: 0.55, ease: "power2.out", immediateRender: false }, t0);
        tl.fromTo("#f02-bellg", { scale: 1 }, { scale: 1.18, duration: 0.12, ease: "power2.out", immediateRender: false }, t0);
        tl.fromTo("#f02-bellg", { scale: 1.18 }, { scale: 1, duration: 0.18, ease: "power2.inOut", immediateRender: false }, t0 + 0.12);
      });

      /* ── Scene 4 (6.6–9.0): aftermath types, rail dims except the red card ── */
      tl.fromTo("#f02-c4", { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 6.7);
      tl.fromTo("#f02-railsvg", { opacity: 0.55 }, { opacity: 0.32, duration: 0.6, ease: "power2.out", immediateRender: false }, 6.85);
      tl.fromTo("#f02-ghost", { opacity: 0.09 }, { opacity: 0.045, duration: 0.6, ease: "power2.out", immediateRender: false }, 6.9);
      ["#f02-c1", "#f02-c2"].forEach(function (sel) {
        tl.fromTo(sel, { opacity: 1 }, { opacity: 0.3, duration: 0.6, ease: "power2.out", immediateRender: false }, 6.85);
      });
      ["#f02-node1", "#f02-node2", "#f02-stem1", "#f02-stem2"].forEach(function (sel) {
        tl.fromTo(sel, { opacity: 1 }, { opacity: 0.3, duration: 0.6, ease: "power2.out", immediateRender: false }, 6.85);
      });
      tl.fromTo("#f02-c3", { scale: 1 }, { scale: 1.015, duration: 0.5, ease: "power2.out", immediateRender: false }, 7.05);
      /* hold — the red card and its aftermath carry the frame to the end */
    })();
  </script>
