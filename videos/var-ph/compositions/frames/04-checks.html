        var tl = gsap.timeline({ paused: true });

        var $ = function (id) {

            if (t >= seq[i].t) return seq[i].s;

        var SEQ1 = [

          { t: 5.75, s: 4 },

        var drv = { t: 0 };

        var rows = [

          { land: 3.85, check: 4.5 },
          { land: 4.95, check: 5.5 },

        var rowEls = document.querySelectorAll("#f04-rows .f04-row");
        rows.forEach(function (r, i) {
          var row = rowEls[i];

          var val = row.querySelector(".f04-val");

          tl.fromTo(key, { x: -14, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, r.land + 0.08);
          tl.fromTo(sep, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, r.land + 0.16);
          tl.fromTo(val, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, r.land + 0.2);
