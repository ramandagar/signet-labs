  <div id="root" data-composition-id="04-sign" data-width="1920" data-height="1080">

    <div class="clip f04-sign-stageclip" data-start="0" data-duration="6.08" data-track-index="1">
      <div class="f04-sign-world" id="f04-sign-world">
        <div class="f04-sign-card" id="f04-sign-card">
          <div class="f04-sign-hdstack">
            <span class="f04-sign-hd" id="f04-sign-hd-old">approval requested</span>
            <span class="f04-sign-hd" id="f04-sign-hd-new"><span class="f04-sign-hddot" id="f04-sign-hddot"></span>approved</span>

  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });

      /* the card is the cut-continuation of 03 — present and settled at t=0, no entrance.
         Scene 1 (0–1.7s) "A senior engineer reviews.": the role the VO names gets its
         blue review mark, then a pale hover tint blooms on approve (cursor-less). */
      tl.fromTo('#f04-sign-roleul', { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: 'power2.out' }, 0.55);
      tl.fromTo('#f04-sign-tint', { opacity: 0 }, { opacity: 1, duration: 0.35, ease: 'power2.out' }, 1.15);

      /* the shot's one camera move — receipt zoom: slow push decelerating into the stamp */
      tl.fromTo('#f04-sign-world', { scale: 1 }, { scale: 1.04, duration: 5.72, ease: 'power2.out' }, 0);

      /* Scene 2 (~1.7–2.7s) "Approves.": press-release spring, ink fills ONCE left→right,
         label flips white, deny goes inert, header tense-flips to approved. */
      tl.to('#f04-sign-btna', { scale: 0.94, duration: 0.09, ease: 'power2.in' }, 1.78);
      tl.to('#f04-sign-btna', { scale: 1.05, duration: 0.16, ease: 'power2.out' }, 1.87);
      tl.to('#f04-sign-btna', { scale: 1, duration: 0.14, ease: 'power2.out' }, 2.03);
      tl.fromTo('#f04-sign-fill', { scaleX: 0 }, { scaleX: 1, duration: 0.28, ease: 'power2.inOut' }, 1.9);
      tl.fromTo('#f04-sign-btna-label', { color: '#1A1A19' }, { color: '#FFFFFF', duration: 0.16, ease: 'power2.out' }, 1.98);
      tl.to('#f04-sign-btnd', { opacity: 0.38, duration: 0.3, ease: 'power2.out' }, 2.3);
      tl.to('#f04-sign-hd-old', { y: -12, opacity: 0, duration: 0.26, ease: 'power2.in' }, 2.35);
      tl.fromTo('#f04-sign-hd-new', { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: 'power2.out' }, 2.44);
      tl.fromTo('#f04-sign-hddot', { scale: 0 }, { scale: 1, duration: 0.3, ease: 'back.out(2.2)' }, 2.52);

      /* working-state theater: three blue dots pulse under the card — finite, phase-offset,
         killed the exact frame the payload starts printing (2.72s). */
      tl.fromTo('#f04-sign-d0', { opacity: 0 }, { opacity: 1, duration: 0.12, ease: 'power1.out' }, 2.18);
      tl.fromTo('#f04-sign-d1', { opacity: 0 }, { opacity: 1, duration: 0.12, ease: 'power1.out' }, 2.24);
      tl.fromTo('#f04-sign-d2', { opacity: 0 }, { opacity: 1, duration: 0.12, ease: 'power1.out' }, 2.3);
      for (let i = 0; i < 3; i++) {
        const b = 2.24 + i * 0.07;
        for (let k = 0; k < 2; k++) {
          tl.to('#f04-sign-d' + i, { y: -5, duration: 0.085, ease: 'sine.inOut' }, b + k * 0.17);
          tl.to('#f04-sign-d' + i, { y: 0, duration: 0.085, ease: 'sine.inOut' }, b + k * 0.17 + 0.085);
        }
        tl.set('#f04-sign-d' + i, { opacity: 0, immediateRender: false }, 2.72);
      }

      /* Scene 3 (2.7–5.5s) "The signature is real, scoped, and expiring." — the payload
         prints in three VO-synced chunks: discrete-text-sequence via zero-duration
         per-character sets (seek-safe, pure function of the playhead). */
      const typeSeg = (el, text, t0, per) => {
        for (let i = 1; i <= text.length; i++) {
          tl.set(el, { textContent: text.slice(0, i), immediateRender: false }, t0 + i * per);
        }
        return t0 + text.length * per;
      };
      const PER = 0.03;
      const SEGS = [
        ['k1', 'approved_by: ', 2.72],
        ['v1', 'e.encalada', 0],
        ['s1', ' \u00B7 ', 3.82],
        ['k2', 'role: ', 0],
        ['v2', 'senior_engineer', 0],
        ['s2', ' \u00B7 ', 4.96],
        ['k3', 'expires ', 0],
        ['v3', '+3600s', 0],
      ];
      let t = 2.72;
      const marks = [];
      for (const [id, text, at] of SEGS) {
        if (at) t = at;
        marks.push([id, t]);
        t = typeSeg($('f04-sign-' + id), text, t, PER);
      }
      for (let i = 0; i < marks.length; i++) {
        const [id, on] = marks[i];
        const caret = '#f04-sign-caret-' + id;
        tl.set(caret, { opacity: 1, immediateRender: false }, on);
        if (i < marks.length - 1) {
          tl.set(caret, { opacity: 0, immediateRender: false }, marks[i + 1][1]);
        }
      }
      /* the trailing caret blinks twice on the finished line, then dies — hold is clean */
      tl.set('#f04-sign-caret-v3', { opacity: 0, immediateRender: false }, 5.6);
      tl.set('#f04-sign-caret-v3', { opacity: 1, immediateRender: false }, 5.73);
      tl.set('#f04-sign-caret-v3', { opacity: 0, immediateRender: false }, 5.86);

      /* Scene 4 (5.5s→end) — the small blue seal stamps the card corner; then the frame
         holds still to the end (no exit — the root transition owns it). */
      tl.fromTo('#f04-sign-seal',
        { opacity: 0, scale: 2.3, rotation: -14 },
        { opacity: 1, scale: 1, rotation: 0, duration: 0.22, ease: 'power3.in', transformOrigin: '50% 50%' },
        5.5
      );

      window.__timelines['04-sign'] = tl;
    })();
  </script>
