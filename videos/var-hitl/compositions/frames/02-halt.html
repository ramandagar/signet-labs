<template>
<style>

  @font-face {

  @font-face {

  /* Frame root — styled via #root only (never a class on the composition root) */
  #root {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    container-type: size;
    font-family: 'Barlow', sans-serif;
  }

  /* Full-bleed ground on a dedicated clip layer, never on #root (dark register) */
  .v02-bg {
    position: absolute;
    inset: 0;
    background: #1A1A19;
  }

  .v02-stage {
    position: absolute;
    inset: 0;
  }
  .v02-world {
    position: absolute;
    inset: 0;

  /* ---- top chrome bar (mono, hairline) ---- */
  .v02-chrome {
    position: absolute;
    left: 106px;

    height: 92px;
    display: flex;

  .v02-cardhead-id {

  /* ---- field rows: mono key column + value column ---- */
  .v02-row {

  .v02-claimrow {
    border-bottom: 1px solid rgba(215, 216, 217, 0.14);

  .v02-key {
    width: 330px;

  .v02-val {

  .v02-ch {

  .v02-caret {

  /* sheen sweep — masked to the claim value line */
  .v02-sheen {
    position: absolute;
    top: -30%;
    bottom: -30%;
    left: -110px;

    background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.38) 50%, rgba(255,255,255,0) 100%);

    pointer-events: none;

  /* ---- working-state row: spinner + status + pulsing dots ---- */
  .v02-status {
    flex: 0 0 auto;
    margin: 0 48px;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 20px;
    padding-left: 330px;
  }
  .v02-spin {
    width: 30px;
    height: 30px;
    flex: 0 0 auto;
  }
  .v02-statuslabel {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 22px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #AFB3B7;
  }
  .v02-dots {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-left: 4px;
  }
  .v02-dot {
    width: 8px;
    height: 8px;
    background: rgba(255, 255, 255, 0.9);
  }

  /* ---- empty approval_chain field + its hairline glow box ---- */
  .v02-approverow {
    position: relative;
  }
  .v02-emptyval {
    color: rgba(255, 255, 255, 0.45);
  }
  .v02-emptybox {
    position: absolute;
    inset: 0;
    border: 1px solid rgba(215, 216, 217, 0.10);
    pointer-events: none;
  }

  /* ---- verdict zone: pending strip swaps to the amber halt band ---- */
  .v02-verdictzone {
    position: relative;
    flex: 0 0 auto;
    margin: 28px 48px 0;
    height: 172px;
  }
  .v02-pending {
    position: absolute;
    inset: 0;
    border: 1px solid rgba(215, 216, 217, 0.22);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 20px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.32);
  }
  .v02-band {
    position: absolute;
    inset: 0;
    background: #fab219;
    display: flex;
    align-items: baseline;
    gap: 28px;
    padding: 0 44px;
  }
  .v02-bandstub {
    align-self: center;
    width: 36px;
    height: 2px;
    background: #1A1A19;
    flex: 0 0 auto;
  }
  .v02-halt {
    font-family: 'Barlow', sans-serif;
    font-weight: 900;
    font-size: 112px;
    line-height: 1;
    letter-spacing: -0.02em;
    color: #1A1A19;
  }
  .v02-bandreason {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 31px;
    letter-spacing: 0.14em;
    color: #1A1A19;
    transform: translateY(-6px);
  }

  /* ---- terminal well (anchored downward expansion + verbatim print) ---- */
  .v02-wellwrap {
    flex: 0 0 auto;
    margin: 26px 48px 0;
    height: 128px;
    overflow: hidden;
  }
  .v02-wellinner {
    height: 128px;
  }
  .v02-well {
    height: 128px;
    border: 1px solid rgba(215, 216, 217, 0.18);
    background: rgba(255, 255, 255, 0.04);
    display: flex;
    align-items: center;
    padding: 0 36px;
  }
  .v02-wellline {
    position: relative;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 31px;
    color: #AFB3B7;
    white-space: nowrap;
  }
  .v02-wt {
    position: relative;
    display: inline-block;
    color: #AFB3B7;
  }
  .v02-tokenline {
    position: absolute;
    left: 0;
    right: 0;
    bottom: -8px;
    height: 2px;
    background: #FFFFFF;
    transform: scaleX(0);
    transform-origin: 0% 50%;
  }
  .v02-wellcaret {
    display: inline-block;
    width: 15px;
    height: 28px;
    margin-left: 8px;
    background: #AFB3B7;
    vertical-align: -3px;
  }
</style>

<div id="root" data-composition-id="02-halt" data-width="1920" data-height="1080">
  <div class="clip v02-bg" data-start="0" data-duration="9.557" data-track-index="0"></div>
  <div class="clip v02-stage" data-start="0" data-duration="9.557" data-track-index="1">
    <div class="v02-world">

      <div class="v02-chrome">
        <span>Claim evaluation</span>
        <span>No. 02 / 07</span>
      </div>

      <div class="v02-card">
        <div class="v02-cardhead">
          <span>Decision</span>
          <span class="v02-cardhead-id">policy gate</span>
        </div>

        <!-- claim row: the claim types on -->
        <div class="v02-row v02-claimrow">
          <div class="v02-key">claim:</div>
          <div class="v02-val">
            <span class="v02-claimval" id="v02-claimval"></span><span class="v02-caret" id="v02-caret"></span>
            <div class="v02-sheen" id="v02-sheen"></div>
          </div>
        </div>

        <!-- working state: the machine evaluates -->
        <div class="v02-status">
          <div class="v02-spin" id="v02-spin">
            <svg width="30" height="30" viewBox="0 0 30 30">
              <circle cx="15" cy="15" r="12.5" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="2.6" stroke-dasharray="52 26.5" />
            </svg>
          </div>
          <div class="v02-statuslabel">Evaluating</div>
          <div class="v02-dots">
            <span class="v02-dot" id="v02-dot0"></span>
            <span class="v02-dot" id="v02-dot1"></span>
            <span class="v02-dot" id="v02-dot2"></span>
          </div>
        </div>

        <!-- the empty approval chain -->
        <div class="v02-row v02-approverow">
          <div class="v02-emptybox" id="v02-emptybox"></div>
          <div class="v02-key">approval_chain:</div>
          <div class="v02-val v02-emptyval" id="v02-emptyval">[]</div>
        </div>

        <!-- verdict zone: pending strip -> amber HALT band -->
        <div class="v02-verdictzone">
          <div class="v02-pending" id="v02-pending">Verdict &middot; pending</div>
          <div class="v02-band" id="v02-band">
            <div class="v02-bandstub"></div>
            <div class="v02-halt">HALT</div>
            <div class="v02-bandreason">&middot; EVIDENCE_MISSING</div>
          </div>
        </div>

        <!-- terminal well: prints verbatim -->
        <div class="v02-wellwrap" id="v02-wellwrap">
          <div class="v02-wellinner" id="v02-wellinner">
            <div class="v02-well">
              <div class="v02-wellline" id="v02-wellline"><span class="v02-wellcaret" id="v02-wellcaret"></span></div>
            </div>
          </div>
        </div>

      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
  (function () {
    var stage = document.getElementById('root');
    if (!stage || !window.gsap) { return; }

    var tl = gsap.timeline({ paused: true, defaults: { ease: 'power2.out' } });
    window.__timelines = window.__timelines || {};
    window.__timelines['02-halt'] = tl;

    var el = function (id) { return document.getElementById(id); };

    /* ---- build typed char spans (deterministic, stepped by .set calls) ---- */
    var claimSpans = [];
    (function () {
      var host = el('v02-claimval');
      var CLAIM = 'deploy_to_production';
      var frag = document.createDocumentFragment();
      for (var i = 0; i < CLAIM.length; i++) {
        var s = document.createElement('span');
        s.className = 'v02-ch';
        s.textContent = CLAIM.charAt(i);
        frag.appendChild(s);
        claimSpans.push(s);
      }
      host.appendChild(frag);
    })();
    gsap.set(claimSpans, { opacity: 0 });

    var wellSpans = [];
    (function () {
      var line = el('v02-wellline');
      var caret = el('v02-wellcaret');
      var parts = [
        { t: 'no approval -> HALT ', cls: 'v02-wp' },
        { t: '[EVIDENCE_MISSING]', cls: 'v02-wt' }
      ];
      var frag = document.createDocumentFragment();
      parts.forEach(function (p) {
        for (var i = 0; i < p.t.length; i++) {
          var s = document.createElement('span');
          s.className = 'v02-ch ' + p.cls;
          if (p.cls === 'v02-wt') {
            var inner = document.createElement('span');
            inner.className = 'v02-ch';
            inner.textContent = p.t.charAt(i);
            s.appendChild(inner);
          } else {
            s.textContent = p.t.charAt(i);
          }
          frag.appendChild(s);
          wellSpans.push(s);
        }
      });
      line.insertBefore(frag, caret);
    })();
    gsap.set(wellSpans, { opacity: 0 });

    /* token underline draw-in target */
    var tokenLine = document.createElement('span');
    tokenLine.className = 'v02-tokenline';
    var tokenChars = wellSpans.filter(function (s) { return s.className.indexOf('v02-wt') !== -1; });
    if (tokenChars.length) { tokenChars[0].appendChild(tokenLine); }

    /* ============================================================
       Scene 1 (0.0 - 2.3) — trigger: the decision card opens,
       the claim types itself on.
       ============================================================ */
    tl.fromTo(stage.querySelector('.v02-chrome'), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'power1.out' }, 0.02);

    var card = stage.querySelector('.v02-card');
    gsap.set(card, { transformOrigin: '50% 50%' });
    tl.fromTo(card, { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.5, ease: 'back.out(1.4)' }, 0.04);

    tl.fromTo(stage.querySelector('.v02-pending'), { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.4);

    var claimRow = stage.querySelector('.v02-claimrow');
    tl.fromTo(claimRow, { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4 }, 0.55);

    /* typed-on claim (discrete-text-sequence mechanics: stepped sets) */
    var t0 = 0.72, step = 0.072;
    gsap.set(el('v02-caret'), { opacity: 0 });
    gsap.set(el('v02-wellcaret'), { opacity: 0 });
    tl.set(el('v02-caret'), { opacity: 1 }, t0 - 0.05);
    claimSpans.forEach(function (s, i) {
      tl.set(s, { opacity: 1 }, t0 + i * step);
    });
    /* caret blinks twice after the string lands, then goes dark */
    tl.to(el('v02-caret'), { keyframes: { opacity: [0, 1, 0, 1, 0] }, duration: 0.7, ease: 'steps(1)' }, 2.2);

    /* single-pass sheen sweep through the typed letters */
    var sheen = el('v02-sheen');
    tl.fromTo(sheen, { x: 0, opacity: 0 }, { x: 600, opacity: 1, duration: 0.46, ease: 'power1.in' }, 2.28);
    tl.to(sheen, { opacity: 0, duration: 0.12 }, 2.62);

    /* ============================================================
       Scene 2 (2.15 - 5.1) — working state: the machine evaluates.
       Spinner turns, dots pulse — all finite, timeline-driven.
       ============================================================ */
    var statusRow = stage.querySelector('.v02-status');
    tl.fromTo(statusRow, { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35 }, 2.15);

    /* constant-speed rotation, one finite tween ending exactly at the snap */
    var spin = el('v02-spin');
    gsap.set(spin, { transformOrigin: '50% 50%' });
    tl.to(spin, { rotation: 1062, duration: 2.95, ease: 'none' }, 2.2);

    /* phase-offset dot pulses, bounded window */
    [0, 1, 2].forEach(function (i) {
      var d = el('v02-dot' + i);
      gsap.set(d, { opacity: 0.15 });
      tl.to(d, { keyframes: { opacity: [1, 0.2, 1, 0.2, 1, 0.2] }, duration: 2.65, ease: 'sine.inOut' }, 2.45 + i * 0.16);
    });

    /* ============================================================
       Scene 2.5 (3.4) — "No approval in the chain": the empty
       field lands.
       ============================================================ */
    var approveRow = stage.querySelector('.v02-approverow');
    tl.fromTo(approveRow, { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.42 }, 3.4);

    /* ============================================================
       Scene 3 (5.1 - 6.7) — the receipt: verdict SNAPS amber,
       the well expands and prints verbatim.
       ============================================================ */
    var SNAP = 5.1;

    /* working pulse dies the instant the verdict lands */
    tl.to(statusRow, { opacity: 0, duration: 0.14, ease: 'power1.in' }, SNAP);

    /* scale-swap: pending strip yields, amber band snaps into the same footprint */
    var pending = el('v02-pending');
    var band = el('v02-band');
    gsap.set(band, { opacity: 0, transformOrigin: '50% 50%' });
    tl.to(pending, { opacity: 0, scale: 0.985, duration: 0.12, ease: 'power2.in' }, SNAP);
    tl.fromTo(band, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.36, ease: 'back.out(1.6)' }, SNAP + 0.04);

    /* anchored downward expansion: height-masked wrapper + inner counter-translate */
    tl.fromTo(el('v02-wellwrap'), { height: 0 }, { height: 128, duration: 0.55, ease: 'power3.out' }, 5.55);
    tl.fromTo(el('v02-wellinner'), { y: -128 }, { y: 0, duration: 0.55, ease: 'power3.out' }, 5.55);

    /* the well prints the line verbatim */
    var w0 = 6.02, wstep = 0.017;
    tl.set(el('v02-wellcaret'), { opacity: 1 }, w0 - 0.04);
    wellSpans.forEach(function (s, i) {
      tl.set(s, { opacity: 1 }, w0 + i * wstep);
    });
    tl.to(el('v02-wellcaret'), { opacity: 0, duration: 0.08 }, 6.95);

    /* ============================================================
       Scene 4 (7.1 - end) — "Evidence missing.": the empty field's
       hairline glows; the missing token is called out. Hold to end.
       ============================================================ */
    var box = el('v02-emptybox');
    tl.fromTo(box,
      { borderColor: 'rgba(215,216,217,0.10)', boxShadow: '0 0 0px rgba(255,255,255,0)' },
      { borderColor: 'rgba(255,255,255,0.9)', boxShadow: '0 0 24px rgba(255,255,255,0.30)', duration: 0.34, ease: 'power2.out' }, 7.2);
    tl.to(box, { borderColor: 'rgba(215,216,217,0.35)', boxShadow: '0 0 6px rgba(255,255,255,0.08)', duration: 0.3, ease: 'sine.inOut' }, 7.56);
    tl.to(box, { borderColor: 'rgba(255,255,255,0.9)', boxShadow: '0 0 24px rgba(255,255,255,0.30)', duration: 0.34, ease: 'power2.out' }, 7.88);

    var emptyVal = el('v02-emptyval');
    tl.fromTo(emptyVal, { color: 'rgba(255,255,255,0.45)' }, { color: '#FFFFFF', duration: 0.4 }, 7.2);

    /* token call-out: [EVIDENCE_MISSING] brightens + underline draws */
    var tokenHost = stage.querySelector('.v02-wt');
    if (tokenHost) {
      tl.fromTo(tokenHost, { color: '#AFB3B7' }, { color: '#FFFFFF', duration: 0.35 }, 7.35);
      tl.fromTo(tokenLine, { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: 'power2.out' }, 7.55);
    }

    /* the one camera move: slow continuous push into the verdict, easing out */
    var world = stage.querySelector('.v02-world');
    gsap.set(world, { transformOrigin: '40% 66%' });
    tl.fromTo(world, { scale: 1 }, { scale: 1.045, duration: 4.4, ease: 'power1.inOut' }, 5.1);

    /* hold to 9.557s — no exit (root transition owns it) */
  })();
</script>
</template>
