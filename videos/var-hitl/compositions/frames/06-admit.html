<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
  (function () {
    var stage = document.getElementById('root');
    if (!stage || !window.gsap) { return; }

    var tl = gsap.timeline({ paused: true, defaults: { ease: 'power2.out' } });
    window.__timelines = window.__timelines || {};
    window.__timelines['06-admit'] = tl;

    var el = function (id) { return document.getElementById(id); };

    /* ---- build typed char spans (deterministic, stepped by .set calls) ---- */
    var chainSpans = [];
    (function () {
      var host = el('v06-chainval');
      var NAME = "['senior_engineer']";
      var frag = document.createDocumentFragment();
      for (var i = 0; i < NAME.length; i++) {
        var s = document.createElement('span');
        s.className = 'v06-ch';
        s.textContent = NAME.charAt(i);
        frag.appendChild(s);
        chainSpans.push(s);
      }
      host.appendChild(frag);
    })();
    gsap.set(chainSpans, { opacity: 0 });

    var wellSpans = [];
    (function () {
      var line = el('v06-wellline');
      var caret = el('v06-wellcaret');
      var parts = [
        { t: 'after approval -> ', cls: 'v06-wp' },
        { t: 'ADMIT', cls: 'v06-wtg' },
        { t: ' (envelope approval_chain now: ', cls: 'v06-wp' },
        { t: "['senior_engineer']", cls: 'v06-wtn' },
        { t: ')', cls: 'v06-wp' }
      ];
      var frag = document.createDocumentFragment();
      parts.forEach(function (p) {
        for (var i = 0; i < p.t.length; i++) {
          var s = document.createElement('span');
          s.className = 'v06-ch ' + p.cls;
          s.textContent = p.t.charAt(i);
          frag.appendChild(s);
          wellSpans.push(s);
        }
      });
      line.insertBefore(frag, caret);
    })();
    gsap.set(wellSpans, { opacity: 0 });

    gsap.set(el('v06-chaincaret'), { opacity: 0 });
    gsap.set(el('v06-wellcaret'), { opacity: 0 });

    /* ============================================================
       Scene 1 (0.0) — the card RETURNS on the cut: chrome, claim
       `deploy_to_production` and the pending verdict present at t=0.
       ============================================================ */

    /* ============================================================
       Scene 2 (0.05 - 2.5) — working state under the riser: the
       machine re-evaluates. Spinner + dots, all finite, timeline-
       driven, all ending exactly at the sub-drop.
       ============================================================ */
    var statusRow = stage.querySelector('.v06-status');
    tl.fromTo(statusRow, { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35 }, 0.05);

    var spin = el('v06-spin');
    gsap.set(spin, { transformOrigin: '50% 50%' });
    tl.to(spin, { rotation: 810, duration: 2.25, ease: 'none' }, 0.25);

    [0, 1, 2].forEach(function (i) {
      var d = el('v06-dot' + i);
      gsap.set(d, { opacity: 0.15 });
      tl.to(d, { keyframes: { opacity: [1, 0.2, 1, 0.2, 1, 0.2] }, duration: 2.05 - i * 0.14, ease: 'sine.inOut' }, 0.45 + i * 0.14);
    });

    /* the one camera move: a slow push resolving exactly at the drop, still after */
    var world = stage.querySelector('.v06-world');
    gsap.set(world, { transformOrigin: '42% 60%' });
    tl.fromTo(world, { scale: 1 }, { scale: 1.032, duration: 2.5, ease: 'power1.inOut' }, 0);

    /* ============================================================
       Scene 2.5 (1.72 - 2.43) — "with a name attached": the chain
       types on the approver.
       ============================================================ */
    var approveRow = stage.querySelector('.v06-approverow');
    tl.fromTo(approveRow, { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.42 }, 1.72);

    tl.set(el('v06-chaincaret'), { opacity: 1 }, 1.78);
    chainSpans.forEach(function (s, i) {
      tl.set(s, { opacity: 1 }, 1.80 + i * 0.035);
    });
    tl.to(el('v06-chaincaret'), { opacity: 0, duration: 0.05 }, 2.44);

    /* ============================================================
       Scene 3 (2.5) — SUB-DROP: the verdict flips GREEN ADMIT with
       one ripple; the well expands and prints verbatim.
       ============================================================ */
    var DROP = 2.5;

    /* working pulse dies the instant the verdict lands */
    tl.to(statusRow, { opacity: 0, duration: 0.12, ease: 'power1.in' }, DROP);

    /* scale-swap: pending strip yields, green band snaps into the same footprint */
    var pending = el('v06-pending');
    var band = el('v06-band');
    gsap.set(band, { opacity: 0, transformOrigin: '50% 50%' });
    tl.to(pending, { opacity: 0, scale: 0.985, duration: 0.12, ease: 'power2.in' }, DROP);
    tl.fromTo(band, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.36, ease: 'back.out(1.6)' }, DROP + 0.04);

    /* the single ripple */
    var ripple = el('v06-ripple');
    gsap.set(ripple, { opacity: 0, transformOrigin: '50% 50%' });
    tl.fromTo(ripple, { scale: 0.92, opacity: 0.85 }, { scale: 1.16, opacity: 0, duration: 0.55, ease: 'power2.out' }, DROP + 0.04);

    /* anchored downward expansion: height-masked wrapper + inner counter-translate */
    tl.fromTo(el('v06-wellwrap'), { height: 0 }, { height: 128, duration: 0.42, ease: 'power3.out' }, 2.6);
    tl.fromTo(el('v06-wellinner'), { y: -128 }, { y: 0, duration: 0.42, ease: 'power3.out' }, 2.6);

    /* the well prints the line verbatim */
    tl.set(el('v06-wellcaret'), { opacity: 1 }, 2.78);
    wellSpans.forEach(function (s, i) {
      tl.set(s, { opacity: 1 }, 2.82 + i * 0.004);
    });
    tl.to(el('v06-wellcaret'), { opacity: 0, duration: 0.03 }, 3.12);

    /* dead still from ~3.15s — hold to 3.179s, no exit (root transition owns it) */
  })();
</script>
