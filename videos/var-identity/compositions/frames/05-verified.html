<script>
  (function () {
    var stage = document.getElementById('root');
    if (!stage || !window.gsap) { return; }

    var tl = gsap.timeline({ paused: true, defaults: { ease: 'power2.out' } });
    window.__timelines = window.__timelines || {};
    window.__timelines['05-verified'] = tl;

    /* ---- Scene 1 establishing (0.0 - 0.5s): chrome, rows, verdict column ---- */
    tl.fromTo(stage.querySelector('.v05-chrome'), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'power1.out' }, 0.02);
    tl.fromTo(stage.querySelectorAll('.v05-row'), { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.34, stagger: 0.06, ease: 'power2.out' }, 0.0);
    tl.fromTo(stage.querySelector('.v05-divider'), { scaleY: 0, transformOrigin: '50% 0%' }, { scaleY: 1, duration: 0.5, ease: 'power2.out' }, 0.08);
    tl.fromTo(stage.querySelector('.v05-verdict'), { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: 'power2.out' }, 0.1);

    /* ---- pending-tag spinner: constant-speed, finite, timeline-driven ---- */
    var tagArc = stage.querySelector('.v05-tag-arc');
    gsap.set(tagArc, { rotation: 0, transformOrigin: '50% 50%' });
    tl.to(tagArc, { rotation: 720 * (5.0 - 0.05), duration: 5.0 - 0.05, ease: 'none' }, 0.05);

    /* ---- check rows: spin while pending, tick blue one per cue ---- */
    var cues = [0.4, 1.9, 3.4];
    var rows = Array.prototype.slice.call(stage.querySelectorAll('.v05-row'));
    rows.forEach(function (row, i) {
      var T = cues[i];
      var arc = row.querySelector('.v05-arc');
      var status = row.querySelector('.v05-status');
      var checkSvg = row.querySelector('.v05-check');
      var checkPath = checkSvg.querySelector('path');
      var label = row.querySelector('.v05-label');
      var idx = row.querySelector('.v05-idx');

      /* svg-path-draw setup: measure, never guess */
      var len = checkPath.getTotalLength() * 1.05;
      checkPath.style.strokeDasharray = String(len);
      checkPath.style.strokeDashoffset = String(len);

      /* diegetic working state: arc rotation, finite + seek-safe */
      gsap.set(arc, { rotation: 0, transformOrigin: '50% 50%' });
      tl.to(arc, { rotation: 720 * (T - 0.05), duration: T - 0.05, ease: 'none' }, 0.05);

      /* the pulse dies the instant the result lands */
      tl.to(arc, { opacity: 0, duration: 0.1, ease: 'power1.in' }, T);

      /* badge flip: check draws in (power2.out — pens don't bounce) + scale bounce on the box */
      tl.fromTo(checkPath, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.32, ease: 'power2.out' }, T + 0.04);
      tl.fromTo(status, { scale: 1 }, { scale: 1.14, duration: 0.12, ease: 'power2.out' }, T);
      tl.to(status, { scale: 1, duration: 0.3, ease: 'back.out(3)' }, T + 0.12);
      tl.fromTo(status, { borderColor: 'rgba(215,216,217,0.28)' }, { borderColor: 'rgba(57,135,229,0.65)', duration: 0.35, ease: 'power1.out' }, T);

      /* label brightens, index snaps to accent */
      tl.fromTo(label, { color: 'rgba(255,255,255,0.55)' }, { color: '#FFFFFF', duration: 0.35, ease: 'power1.out' }, T);
      tl.fromTo(idx, { color: '#AFB3B7' }, { color: '#3987E5', duration: 0.35, ease: 'power1.out' }, T);
    });

    /* ---- chrome: per user / per call / not once at login (4.4s) ---- */
    tl.fromTo(stage.querySelector('.v05-chromeline'), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power2.out' }, 4.4);

    /* ---- Scene 2: verdict pill flips GREEN exactly on the drop (5.0s) ----
       scale-swap-transition: outgoing power2.in shrink, incoming back.out pop,
       incoming z-above, same fixed footprint + shared transform-origin. ---- */
    var pending = stage.querySelector('.v05-tag-pending');
    var done = stage.querySelector('.v05-tag-done');
    var ripple = stage.querySelector('.v05-ripple');
    gsap.set([pending, done, ripple], { transformOrigin: '50% 50%' });

    tl.to(pending, { scale: 0.72, opacity: 0, duration: 0.3, ease: 'power2.in' }, 5.0);
    tl.fromTo(done, { scale: 0.72, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: 'back.out(1.7)' }, 5.15);

    /* single ripple ring — one pass, gone by 5.58s */
    tl.fromTo(ripple, { scale: 1, opacity: 0.9 }, { scale: 1.3, opacity: 0, duration: 0.46, ease: 'power1.out', immediateRender: false }, 5.12);

    /* ---- Scene 3: DEAD STILL — no tweens past 5.6s; hold to 9.472s ---- */
  })();
</script>
