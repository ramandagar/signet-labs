      tl.fromTo(

        { scaleX: 1, duration: 0.45, ease: "power2.out" },
        0.4

        q("03-envelope-headtext"),
        { clipPath: "inset(-6% 100% -6% -2%)" },
        { clipPath: "inset(-6% -2% -6% -2%)", duration: 0.55, ease: "power3.out" },
        0.5
      );
      // corner seal emblem: spring pop (accent marker gets the overshoot)
