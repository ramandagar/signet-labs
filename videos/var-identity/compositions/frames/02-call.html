    [class~="02-call-word"] {

    }
    [class~="02-call-l"] {

    }
  </style>

  <div

  >
    <!-- track 0: ground + Crouwel grid -->
    <div class="clip 02-call-bg" data-start="0" data-duration="4.117" data-track-index="0">

    <!-- track 1: chrome + card theater + display payoff -->

              ><span class="02-call-ch">t</span><span class="02-call-ch">o</span><span class="02-call-ch">o</span><span class="02-call-ch">l</span><span class="02-call-ch">s</span><span class="02-call-ch">/</span><span class="02-call-ch">c</span><span class="02-call-ch">a</span><span class="02-call-ch">l</span><span class="02-call-ch">l</span><span class="02-call-caret 02-call-caret-head"></span></span>

  <script>
    (function () {
      var root =
        (document.currentScript && document.currentScript.previousElementSibling) ||
        document.querySelector('[data-composition-id="02-call"]');
      var q = function (c) {
        return root.querySelector('[class~="' + c + '"]');
      };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

      // Character advance of IBM Plex Mono is exactly 0.6em — caret glide targets are
      // nChars * 0.6 * fontSize(px). Fonts are locked at this fixed 1920x1080 canvas:
      // header 1.5625cqw = 30px -> 18px/char; rows 1.9792cqw = 38px -> 22.8px/char.

      var type = function (scope, t0, step) {
        var chars = scope.querySelectorAll('[class~="02-call-ch"]');
        for (var i = 0; i < chars.length; i++) {
          tl.fromTo(chars[i], { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, t0 + i * step);
        }
        return chars.length;
      };

      // ---- Scene 1 (0–1.37s; packet 0–2.0s scaled x0.686 to the fixed 4.117s):
      // canvas + chrome; the card rises in; header `tools/call` types.
      tl.fromTo(q("02-call-grid"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0);
      tl.fromTo(
        q("02-call-chrome-line"),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.5, ease: "power2.out" },
        0.05
      );
      tl.fromTo(
        q("02-call-chrome-label"),
        { autoAlpha: 0, y: -8 },
        { autoAlpha: 1, y: 0, duration: 0.4 },
        0.15
      );
      tl.fromTo(
        q("02-call-chrome-num"),
        { autoAlpha: 0, y: -8 },
        { autoAlpha: 1, y: 0, duration: 0.4 },
        0.22
      );

      // Macro move (the shot's ONE camera move): slow continuous push toward the slot.
      tl.fromTo(
        q("02-call-camera"),
        { scale: 1 },
        { scale: 1.032, transformOrigin: "600px 600px", duration: 4.117, ease: "none" },
        0
      );

      tl.fromTo(
        q("02-call-card"),
        { y: 64, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.75 },
        0.05
      );
      tl.fromTo(
        q("02-call-stub"),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.45, ease: "power2.out" },
        0.4
      );

      // header types: 10 chars x 0.08s from 0.55 -> 1.35; caret blinks (finite), then dies.
      var headText = q("02-call-headtext");
      var nHead = type(headText, 0.55, 0.08);
      tl.fromTo(
        q("02-call-caret-head"),
        { x: 0 },
        { x: nHead * 18, duration: nHead * 0.08, ease: "none" },
        0.55
      );
      tl.fromTo(
        q("02-call-caret-head"),
        { autoAlpha: 1 },
        { autoAlpha: 0, duration: 0.16, ease: "steps(1)", yoyo: true, repeat: 4, immediateRender: false },
        0.55
      );
      tl.fromTo(
        q("02-call-headtag"),
        { autoAlpha: 0 },
        { autoAlpha: 1, duration: 0.35 },
        1.0
      );

      // ---- Scene 2 (1.37–2.88s; packet 2.0–4.2s scaled): params block types.
      // row 1: name: "read_file" — 17 chars x 0.04s from 1.5 -> 2.14.
      var row1 = q("02-call-rowname");
      var n1 = type(row1, 1.5, 0.04);
      tl.fromTo(
        q("02-call-caret-row1"),
        { x: 0 },
        { x: n1 * 22.8, duration: n1 * 0.04, ease: "none" },
        1.5
      );
      tl.fromTo(
        q("02-call-caret-row1"),
        { autoAlpha: 1 },
        { autoAlpha: 0, duration: 0.16, ease: "steps(1)", yoyo: true, repeat: 4, immediateRender: false },
        1.5
      );
      // row 2: path: "src/auth.py" — 18 chars x 0.04s from 2.2 -> 2.88.
      var row2 = q("02-call-rowpath");
      var n2 = type(row2, 2.2, 0.04);
      tl.fromTo(
        q("02-call-caret-row2"),
        { x: 0 },
        { x: n2 * 22.8, duration: n2 * 0.04, ease: "none" },
        2.2
      );
      tl.fromTo(
        q("02-call-caret-row2"),
        { autoAlpha: 1 },
        { autoAlpha: 0, duration: 0.16, ease: "steps(1)", yoyo: true, repeat: 4, immediateRender: false },
        2.2
      );

      // ---- Scene 3 (2.88–4.117s; packet 4.2–6.0s scaled): the empty _meta slot
      // rises into the card's foot, then highlights hairline-blue — the vacancy lands.
      tl.fromTo(
        q("02-call-slot"),
        { yPercent: 110 },
        { yPercent: 0, duration: 0.5 },
        2.85
      );
      tl.fromTo(
        q("02-call-slotlabel"),
        { autoAlpha: 0 },
        { autoAlpha: 1, duration: 0.35 },
        3.0
      );
      // the highlight: hairline -> accent blue, faint blue wash, label flips blue, stub stamps in
      tl.fromTo(
        q("02-call-slot"),
        { borderColor: "rgba(215,216,217,0.28)", backgroundColor: "rgba(255,255,255,0)" },
        {
          borderColor: "rgba(57,135,229,0.95)",
          backgroundColor: "rgba(57,135,229,0.07)",
          duration: 0.45,
          ease: "power2.out"
        },
        3.2
      );
      tl.fromTo(
        q("02-call-slotlabel"),
        { color: "#afb3b7" },
        { color: "#3987e5", duration: 0.35, ease: "power2.out" },
        3.25
      );
      tl.fromTo(
        q("02-call-slotstub"),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.4 },
        3.35
      );

      // Display payoff word lands letter-staggered with the highlight (content arriving
      // into the back half — never front-loaded).
      tl.fromTo(
        q("02-call-paystub"),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.4, ease: "power2.out" },
        3.3
      );
      var letters = q("02-call-word").querySelectorAll('[class~="02-call-l"]');
      for (var i = 0; i < letters.length; i++) {
        tl.fromTo(
          letters[i],
          { opacity: 0, y: 44, filter: "blur(10px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.42 },
          3.4 + i * 0.035
        );
      }

      // ---- hold to 4.117s under the camera drift; no exit — the root transition owns it.
      window.__timelines["02-call"] = tl;
    })();
  </script>
