  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var DUR = 10.624;

      function byId(id) {
        return document.getElementById(id);
      }

      var world = byId("04-dock-world");
      var env = byId("04-dock-env");
      var rail = byId("04-dock-rail");
      var tick = byId("04-dock-tick");
      var ghost = byId("04-dock-ghost");
      var glow = byId("04-dock-glow");
      var hint = byId("04-dock-hint");
      var well = byId("04-dock-well");
      var jwtKey = byId("04-dock-jwt-key");
      var jwtVal = byId("04-dock-jwt-val");
      var cursor = byId("04-dock-cursor");
      var chipA = byId("04-dock-chip-a");
      var chipB = byId("04-dock-chip-b");

      /* ---- camera: ONE state, ONE writer (multi-phase steady push + sine drift) ---- */
      var cam = { s: 1, x: 0, y: 0 };
      var drift = { p: 0 };
      function applyCamera() {
        var dx = Math.sin(drift.p) * 3;
        var dy = Math.sin(drift.p * 1.3) * 2;
        world.style.transform =
          "translate(" + (cam.x + dx).toFixed(3) + "px, " + (cam.y + dy).toFixed(3) +
          "px) scale(" + cam.s.toFixed(5) + ")";
      }
      applyCamera();

      /* ---- rail draw setup: measured geometry ---- */
      var railLen = rail.getTotalLength();
      rail.style.strokeDasharray = String(railLen);
      rail.style.strokeDashoffset = String(railLen);

      /* ---- motion blur on the travel leg: proxy-tweened directional blur ---- */
      var blurNode = byId("04-dock-streak-blur");
      var blur = { v: 0 };
      function writeBlur() {
        blurNode.setAttribute("stdDeviation", blur.v.toFixed(2) + " 0");
      }
      writeBlur();

      /* ---- verbatim JWT typing (smooth character slice) ---- */
      var JWT = "io.var.identity.envelope = eyJhbGciOiJIUzI1NiIs\u2026";
      var JWT_SPLIT = 27; /* "io.var.identity.envelope = " | "eyJhbGciOiJIUzI1NiIs…" */
      var TYPE_AT = 2.82;
      var TYPE_DUR = 3.58;
      var typed = { n: 0 };
      function writeJwt() {
        var s = JWT.substring(0, Math.floor(typed.n));
        jwtKey.textContent = s.substring(0, Math.min(JWT_SPLIT, s.length));
        jwtVal.textContent = s.length > JWT_SPLIT ? s.substring(JWT_SPLIT) : "";
      }
      writeJwt();

      /* ---- deterministic cursor blink (sin square wave on the timeline) ---- */
      var blink = { p: 0 };
      function writeCursor() {
        cursor.style.opacity = Math.sin(blink.p) > 0 ? "1" : "0.2";
      }
      writeCursor();

      var tl = gsap.timeline({ paused: true });

      /* camera legs: establish -> motivated nudge toward the dock -> settle push */
      tl.to(cam, { s: 1.018, duration: 1.2, ease: "power2.out", onUpdate: applyCamera }, 0);
      tl.to(cam, { s: 1.048, x: -16, duration: 1.4, ease: "power2.inOut", onUpdate: applyCamera }, 1.2);
      tl.to(cam, { s: 1.062, x: -6, duration: DUR - 2.6, ease: "power1.inOut", onUpdate: applyCamera }, 2.6);
      /* drift overlay: full-duration sine Lissajous, the single transform writer */
      tl.to(drift, { p: Math.PI * 2 * 2.2, duration: DUR, ease: "none", onUpdate: applyCamera }, 0);

      /* Scene 1 (0.0-1.2) — both cards on stage (handoff pose); slot glow pulses */
      Array.prototype.forEach.call(
        document.querySelectorAll('[class~="04-dock-fade"]'),
        function (el) {
          tl.fromTo(
            el,
            { opacity: 0, y: 10 },
            { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
            Number(el.getAttribute("data-fade-at")) || 0.1
          );
        }
      );
      tl.fromTo(glow, { opacity: 0.45 }, { opacity: 0.9, duration: 0.55, ease: "power2.out" }, 0.15);
      tl.to(glow, { opacity: 0.5, duration: 0.4, ease: "power2.inOut" }, 0.8);

      /* Scene 2 (1.2-2.6) — rail draws, envelope travels right, docks at scale 0.62 */
      tl.to(rail, { strokeDashoffset: 0, duration: 0.85, ease: "power2.out" }, 1.2);
      tl.fromTo(tick, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 1.9);
      tl.fromTo(ghost, { opacity: 0 }, { opacity: 0.55, duration: 0.7, ease: "power2.out" }, 1.5);

      tl.fromTo(
        env,
        { x: 0, y: 0, scale: 1 },
        { x: 778, y: 0, scale: 0.62, duration: 1.2, ease: "power2.inOut" },
        1.25
      );
      /* blur envelope split at the velocity peak (inOut leg: 0 -> PEAK -> 0) */
      tl.to(blur, { v: 8, duration: 0.6, ease: "power2.in", onUpdate: writeBlur }, 1.25);
      tl.to(blur, { v: 0, duration: 0.6, ease: "power2.out", onUpdate: writeBlur }, 1.85);

      /* glow brightens on approach; dock punch at landing; hint swaps out */
      tl.to(glow, { opacity: 0.95, duration: 0.65, ease: "power2.out" }, 1.8);
      tl.fromTo(glow, { opacity: 0.95 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, 2.45);
      tl.to(glow, { opacity: 0.25, duration: 0.7, ease: "power2.out" }, 2.62);
      tl.to(hint, { opacity: 0, duration: 0.28, ease: "power2.out" }, 2.32);
      tl.to(rail, { strokeOpacity: 0.3, duration: 0.6, ease: "power1.inOut" }, 2.75);

      /* Scene 3 (2.6-6.4) — the well arrives; the JWT line types verbatim */
      tl.fromTo(
        well,
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        2.4
      );
      tl.to(typed, { n: JWT.length, duration: TYPE_DUR, ease: "none", onUpdate: writeJwt }, TYPE_AT);

      /* Scene 4 (6.4-9.0) — chips land small on their VO cues, then hold */
      tl.fromTo(
        chipA,
        { scale: 0.6, opacity: 0, y: 8 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        6.55
      );
      tl.fromTo(
        chipB,
        { scale: 0.6, opacity: 0, y: 8 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        7.62
      );

      /* hold (9.0-10.624) — camera drift + cursor blink keep it alive; no exits */
      tl.to(blink, { p: Math.PI * 2 * 16, duration: DUR, ease: "none", onUpdate: writeCursor }, 0);

      window.__timelines["04-dock"] = tl;
    })();
  </script>
