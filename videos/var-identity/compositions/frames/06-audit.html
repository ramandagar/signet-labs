<script>
  (function () {
    var DUR = 7.723;
    var FULL = "audit query : 8 events acted on behalf of alice@…";
    var KEY_LEN = 13; // "audit query :" rides in accent; the answer itself stays ink

    var keyEl = document.getElementById("f06a-wellkey");
    var restEl = document.getElementById("f06a-wellrest");
    var caretEl = document.getElementById("f06a-caret");

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    // Scene 1 (0.0–2.6) — the answer line types verbatim.
    // Smooth-slice typing: onUpdate writes a pure function of the driver value,
    // so any seek (forward or reverse) re-derives the exact string.
    var typer = { p: 0 };
    tl.fromTo(
      typer,
      { p: 0 },
      {
        p: 1,
        duration: 1.95,
        ease: "power1.inOut",
        onUpdate: function () {
          var n = Math.round(typer.p * FULL.length);
          keyEl.textContent = FULL.slice(0, Math.min(n, KEY_LEN));
          restEl.textContent = n > KEY_LEN ? FULL.slice(KEY_LEN, n) : "";
        }
      },
      0.45
    );

    // Caret — solid while typing, then a deterministic idle blink (4 whole
    // square-wave cycles), then settles dim while the ledger fills.
    // One driver, one property, pure function of driver time: seek-safe.
    var caretDriver = { t: 0 };
    tl.fromTo(
      caretDriver,
      { t: 0 },
      {
        t: DUR,
        duration: DUR,
        ease: "none",
        onUpdate: function () {
          var t = caretDriver.t, o;
          if (t < 2.40) {
            o = 1;
          } else if (t < 5.30) {
            var phase = ((t - 2.40) / 2.90) * Math.PI * 2 * 4;
            o = Math.sin(phase) > 0 ? 0.9 : 0.12;
          } else {
            o = 0.25;
          }
          caretEl.style.opacity = o;
        }
      },
      0
    );

    // Scene 2 (2.6–6.4) — four audit rows land, one per beat.
    // Waterfall arrival, house form: binary-opacity whip-in via tl.set + a short
    // power4.out travel to rest; the row's hairline rules itself in first.
    [2.70, 3.60, 4.50, 5.40].forEach(function (t, i) {
      var n = i + 1;
      tl.set(document.getElementById("f06a-rule" + n), { opacity: 1 }, t);
      tl.set(document.getElementById("f06a-row" + n), { opacity: 1, y: 40 }, t + 0.04);
      tl.to(document.getElementById("f06a-row" + n), { y: 0, duration: 0.18, ease: "power4.out" }, t + 0.04);
    });
    // the ledger closes when the gate admits
    tl.set(document.getElementById("f06a-rule5"), { opacity: 1 }, 5.50);

    // Scene 3 (6.4–end) — the payoff lands: rule stub draws, display line rises,
    // then the frame holds still to the final frame. No exits anywhere.
    tl.fromTo("#f06a-stub", { scaleX: 0 }, { scaleX: 1, duration: 0.40, ease: "power3.out" }, 6.40);
    tl.fromTo("#f06a-payoff", { y: 28, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 6.45);

    // full-span anchor so the sub-comp timeline spans the whole frame
    tl.to({}, { duration: DUR }, 0);
    window.__timelines["06-audit"] = tl;
  })();
</script>
